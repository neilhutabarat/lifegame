<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Warnet & Life Simulator (2010–Now) • Oneilverse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-theme">

<div class="app-shell">
  <!-- 1. TOP HUD TERKUNCI (TANPA SCROLL SAMPING DI HP) -->
  <header class="top-hud-locked">
    <div class="hud-bar-top">
      <button class="hud-user-btn" type="button" onclick="openCharacterCreationModal()" title="Karakter / Reset">
        👤 <span id="hudPlayerBadge">Neil (12 Thn)</span>
      </button>
      <div class="hud-clock-box">
        <b id="hudDateTime">Jum, 1/1/2010 • 08:00</b>
        <small id="hudCityUmr">Jambi • $1=Rp9.090</small>
      </div>
      <button id="btnToggleOpen" type="button" class="hud-open-btn success" onclick="toggleRentalOpenStatus()">🟢 BUKA</button>
    </div>

    <div class="hud-bar-controls">
      <div class="speed-controls">
        <button id="btnPause" class="speed-btn" type="button" onclick="togglePause()">⏸️</button>
        <button class="speed-btn active" type="button" data-speed="1" onclick="setSpeed(1)">1x</button>
        <button class="speed-btn" type="button" data-speed="2" onclick="setSpeed(2)">2x</button>
        <button class="speed-btn" type="button" data-speed="4" onclick="setSpeed(4)">4x</button>
        <button class="speed-btn" type="button" data-speed="8" onclick="setSpeed(8)">8x</button>
        <button class="speed-btn" type="button" data-speed="16" onclick="setSpeed(16)">16x</button>
      </div>
      <div class="hud-mini-tools">
        <button type="button" onclick="openDrawerTab('life')" title="Stamina & Kesehatan">❤️ <span id="hudEnergy">100%</span></button>
        <button type="button" onclick="manualCleanShop()">🧹 <span id="hudClean">100%</span></button>
        <button type="button" id="btnSoundToggle" onclick="toggleSound()">🔊</button>
        <button type="button" onclick="openCloudSyncModal()">☁️</button>
      </div>
    </div>

    <!-- GRID 3x2 STAT KEUANGAN, INTERNET, PLN/GENSET & GALON (TANPA SCROLL SAMPING!) -->
    <div class="hud-stats-grid">
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Laci Kasir</span>
        <b id="hudLaci" style="color:#c084fc;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Dompet</span>
        <b id="hudHand" style="color:#4ade80;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Bank</span>
        <b id="hudBank" style="color:#38bdf8;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openDrawerTab('discs')">
        <span>Internet &amp; Ping</span>
        <b id="hudPpob" style="color:#fbbf24;">1 Mbps • 24ms</b>
      </div>
      <div class="stat-cell" onclick="openDrawerTab('finance')">
        <span>PLN / Genset</span>
        <b id="hudKwh">45kWh • ⛽5L</b>
      </div>
      <div class="stat-cell" onclick="openDrawerTab('agen_ppob')">
        <span>Galon &amp; Antre</span>
        <b style="color:#38bdf8;">💧<span id="hudGalon">45</span> • +<span id="lblQueueCount">0</span></b>
      </div>
    </div>
  </header>

  <!-- 2. PAPAN BILLING 20 PC WARNET (PAKET BAR MENURUN vs BILLING METER RUPIAH NAIK PER DETIK + UPDATE PATCH MB/GB) -->
  <main id="studio3dViewport" class="room-board-locked"></main>

  <!-- 3. TICKER AKTIVITAS SINGKAT -->
  <div id="liveToastBar" class="live-toast-bar" onclick="openDrawerTab('logs')">
    📢 Tap PC untuk rakit komponen / atur tarif billing, atau gunakan dock bawah.
  </div>

  <!-- 4. DOCK BAWAH 4x2 SIMPLE & FUNGSIONAL (TANPA SCROLL) -->
  <nav class="bottom-dock-locked" style="grid-template-columns:repeat(4,minmax(0,1fr));">
    <button class="dock-btn" type="button" data-tab="slots" onclick="openDrawerTab('slots')"><span>🖥️</span><small>Billing/PC</small></button>
    <button class="dock-btn" type="button" data-tab="store_hw" onclick="openDrawerTab('store_hw')"><span>🛒</span><small>Rakit/Server</small></button>
    <button class="dock-btn" type="button" data-tab="discs" onclick="openDrawerTab('discs')"><span>🌐</span><small>Game/ISP</small></button>
    <button class="dock-btn" type="button" data-tab="cashier_stik" onclick="openDrawerTab('cashier_stik')"><span>🔧</span><small>Teknisi/Part</small></button>
    <button class="dock-btn" type="button" data-tab="agen_ppob" onclick="openDrawerTab('agen_ppob')"><span>🍜</span><small>PopMie/Galon</small></button>
    <button class="dock-btn" type="button" data-tab="employees" onclick="openDrawerTab('employees')"><span>👷</span><small>Karyawan</small></button>
    <button class="dock-btn" type="button" data-tab="finance" onclick="openDrawerTab('finance')"><span>⚡</span><small>PLN/Genset</small></button>
    <button class="dock-btn" type="button" data-tab="life" onclick="openDrawerTab('life')"><span>🧬</span><small>Hidup/Motor</small></button>
  </nav>
</div>

<!-- SLIDE-UP DRAWER MENU -->
<div id="appDrawerBackdrop" class="drawer-backdrop" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer-sheet">
    <div class="drawer-header">
      <h2 id="drawerTitle">📱 Menu Manajemen Warnet</h2>
      <button class="drawer-close" type="button" onclick="closeDrawer()">✕ Tutup</button>
    </div>
    <div id="rightPanelContent" class="drawer-body"></div>
  </div>
</div>

<!-- HIDDEN LOG STORAGE -->
<div id="logBox" style="display:none;"></div>

<!-- MODAL POPUP -->
<div id="customModalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeCustomModal()">
  <div class="modal">
    <h3 id="customModalTitle" style="margin:0;color:var(--accent);font-size:0.95rem;">Judul</h3>
    <div id="customModalBody" style="display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;"></div>
    <div id="customModalFooter" style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="catalog_games.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="world3d.js"></script>
</body>
</html>
