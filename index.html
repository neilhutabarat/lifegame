<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warnet Juragan 2008</title>
<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#1d1d1b;--mt:#6b6a63;--bd:#dcd8cc;--ac:#0f766e;--ok:#15803d;--wr:#b45309;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sf:#201f1c;--tx:#efece3;--mt:#9a978b;--bd:#37352f;--ac:#2dd4bf;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--sf:#201f1c;--tx:#efece3;--mt:#9a978b;--bd:#37352f;--ac:#2dd4bf;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px}
.r{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.r b{font-size:17px}.mt,.lg{color:var(--mt)}.lg{font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.chip{padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
button,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
input{width:90px;padding:4px 6px}
main{padding:0 12px 24px;display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:auto}
@media(min-width:860px){main{grid-template-columns:1fr 1fr}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:80px}
.card.p{border-color:var(--ac)}.card.d{border-color:var(--wr)}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.tabs button{padding:4px 8px}
</style></head><body>
<div id="hd" class="top"></div><div id="ctl" class="ctl"></div>
<div id="auth" class="ctl"><span class="lg" id="authmsg">Simpanan: lokal (browser)</span><button id="login" hidden>Masuk dengan Google</button><button id="cloudsave" hidden>Simpan ke cloud</button><button id="logout" hidden>Keluar</button></div>
<main><section><h2>Ruang usaha</h2><div id="sts" class="grid"></div></section><section><div id="tb" class="tabs"></div><div id="side"></div></section></main>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const put=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};
const K={pc1:{n:'PC Pentium 4 + monitor CRT',r:3000,p:2800000,c:'pc',w:300},pc2:{n:'PC Core 2 Duo + LCD 17 inci',r:4500,p:5500000,c:'pc',w:250},ps1:{n:'PS1',r:2000,p:400000,c:'ps',w:20,tv:1},ps2:{n:'PS2',r:3500,p:1100000,c:'ps',w:35,tv:1},ps3:{n:'PS3',r:8000,p:5800000,c:'ps',w:200,tv:1}};
const TV=[{n:'Tabung 14 inci',p:700000,w:60,q:0},{n:'Tabung 21 inci',p:1400000,w:90,q:.03},{n:'LCD 32 inci',p:6500000,w:120,q:.06}];
const I=[{id:'indomie',n:'Indomie goreng + telur',p:5000,c:2500,w:5,eq:'kom',g:.04},{id:'esteh',n:'Es teh manis',p:2000,c:700,w:5,eq:'kul',l:.04},{id:'kopi',n:'Kopi sachet',p:2500,c:1100,w:4,eq:'kom',g:.02,l:.03},{id:'tehbotol',n:'Teh Botol Sosro',p:3000,c:2000,w:3,eq:'kul'},{id:'aqua',n:'Aqua 600ml',p:2500,c:1600,w:3,eq:'kul'},{id:'gorengan',n:'Gorengan',p:1000,c:450,w:5,eq:'kom',g:.03},{id:'chitato',n:'Chitato',p:5000,c:4000,w:2}];
const EQ={kom:['Kompor gas',250000],kul:['Kulkas',1800000]};
const V=[{id:'pulsa',n:'Counter pulsa dan servis HP',p:30e6,a:1.5e6,b:3e6,u:5e5},{id:'fc',n:'Fotokopi dan ATK',p:45e6,a:2e6,b:4e6,u:8e5},{id:'laundry',n:'Laundry kiloan',p:40e6,a:2.5e6,b:4.5e6,u:1e6},{id:'wm',n:'Warung makan',p:60e6,a:3e6,b:6e6,u:1.5e6},{id:'toko',n:'Toko kelontong',p:80e6,a:4e6,b:8e6,u:2e6},{id:'bengkel',n:'Bengkel motor (jasa servis)',p:120e6,a:5e6,b:10e6,u:2e6}];
const AS=[{id:'hp',n:'Nokia 6300',p:2.9e6,r:.03},{id:'bb',n:'BlackBerry Bold 9000',p:6.5e6,r:.05},{id:'mtr',n:'Honda Supra X 125',p:15.5e6,r:.05},{id:'avz',n:'Toyota Avanza',p:140e6,r:.1},{id:'jazz',n:'Honda Jazz',p:200e6,r:.12}];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const NM=['Budi','Rizky','Dimas','Putri','Agus','Siti','Fajar','Dewi','Bayu','Nina','Joko','Rani','Eko','Tika'];
const KEY='warnet_2008_v1';let S,rc=0;
const INF=[11.06,2.78,6.96,3.79,4.3,8.38,8.36,3.35,3.02,3.61,3.13,2.72,1.68,1.87,5.51,2.61,1.57,2.9];
let _m=-1,_f=1;const fx=()=>{const m=Math.floor(day()/30);if(m!==_m){_m=m;let f=1,y=Math.floor(m/12);for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;f*=1+(INF[y]!==undefined?INF[y]:3)/100*(m%12)/12;_f=f}return _f};
const P=n=>Math.round(n*fx()/50)*50;
const J=[{n:'Les privat (mengajar)',age:16,h:2,pay:60000,st:12,e:0},{n:'Servis PC panggilan',age:17,h:2,pay:100000,st:12,e:0},{n:'Kasir minimarket (shift)',age:18,h:8,pay:70000,st:35,e:0},{n:'Pegawai kantoran paruh waktu',age:19,h:6,pay:110000,st:25,e:2},{n:'Konsultan usaha',age:22,h:4,pay:450000,st:15,e:3}];
function fresh(){const pr={};Object.keys(K).forEach(k=>pr[k]=K[k].r);I.forEach(i=>pr[i.id]=i.p);
 S={m:500000,b:19500000,T:420,stam:100,rw:3,rr:3,open:false,faint:false,st:[],stock:Object.fromEntries(I.map(i=>[i.id,0])),sup:{gas:0,gal:0},eq:{},q:[],kwh:0,out:0,gen:false,sol:0,cap:10,rent:0,emp:0,ln:null,v:{},as:{},pt:null,mar:0,kids:0,preg:0,kb:0,busy:0,jp:0,dt:-9999,bC:0,bI:0,spd:1,pause:false,tab:'un',pr,cf:-999,log:['Tahun 2008. Garasi masih kosong. Beli unit di tab Unit dan token listrik di tab Listrik.'],inc:0,exp:0}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.st)fresh();
const save=()=>{S.sv=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave()};
const day=()=>Math.floor(S.T/1440),age=()=>Math.floor(day()/360)+15;
const clock=()=>String(Math.floor(S.T/60)%24).padStart(2,'0')+':'+String(S.T%60).padStart(2,'0');
const log=m=>{S.log.unshift(clock()+' '+m);S.log.length=Math.min(S.log.length,12)};
const have=()=>S.m+S.b,used=()=>S.st.length+S.sol;
const spend=n=>{const t=Math.min(Math.max(S.m,0),n);S.m-=t;S.b-=n-t;S.exp+=n};
const buy=n=>{if(have()<n){log('Uang kurang ('+fmt(n)+').');return 0}spend(n);return 1};
const mult=()=>S.bI>S.T?2:1;
const dur=m=>Math.floor(m/60)+'j '+(m%60)+'m';
const bill=c=>Math.round(c.r*c.used/60/100)*100+c.o.reduce((a,i)=>a+i.p,0);
const sw=s=>K[s.k].w+(s.tv>=0?TV[s.tv].w:0);
const rep=(c,d)=>{const f=c==='pc'?'rw':'rr';S[f]=Math.min(5,Math.max(1,S[f]+d))};
const red=()=>Math.min(.3,AS.reduce((a,x)=>a+(S.as[x.id]?x.r:0),0));
const drain=()=>5*(1+(S.mar?.2:0)+(S.preg?.3:0)+S.kids*.1)/(1+.5*S.emp)*(1-red());
const dm=(k)=>Math.min(1.6,Math.max(.15,1.7-.7*S.pr[k]/(K[k].r*fx())));
function order(c){const a=I.filter(i=>(!i.eq||S.eq[i.eq])&&S.stock[i.id]>0&&S.sup.gas>=(i.g||0)&&S.sup.gal>=(i.l||0));if(!a.length)return;
 let r=Math.random()*a.reduce((x,i)=>x+i.w,0),it;for(it of a){r-=it.w;if(r<=0)break}
 S.stock[it.id]--;S.sup.gas-=it.g||0;S.sup.gal-=it.l||0;c.o.push({n:it.n,p:S.pr[it.id]})}
function power(h){let w=S.open?100:0;S.st.forEach(s=>{if(s.c)w+=sw(s)});if(!w){S.out=0;return}
 let e=w/1000;if(h>=8&&h<16)e-=Math.min(e,S.sol*.7);if(e<=0){S.out=0;return}
 if(S.kwh>=e){S.kwh-=e;S.out=0}else if(S.gen){spend(P(5000));S.out=0}else{if(!S.out)log('Token listrik habis! Warnet padam.');S.out=1}}
function monthEnd(){let inc=0,out=0;const pay=n=>{if(n>0){spend(n);out+=n}};
 const a=age(),mo=Math.floor(day()/30);
 pay(P(600000));pay(S.emp*P(900000));pay(P(S.rent));
 if(a>=18)pay(P(1500000+S.kids*1000000+(S.mar?500000:0)+(S.kb?50000:0)));else{const j=P(500000);S.b+=j;inc+=j}
 if(S.ln){if(have()>=S.ln.pay)pay(S.ln.pay);else{spend(Math.round(S.ln.pay*1.02));rep('pc',-.1);log('Cicilan telat, kena denda 2%.')}if(--S.ln.left<=0)S.ln=null}
 if(S.b>0){const i=Math.round(S.b*.0033);S.b+=i;inc+=i}
 V.forEach(v=>{if(S.v[v.id]){const g=P((v.a+Math.random()*(v.b-v.a))*(.6+(S.rw+S.rr)/10)-v.u);S.b+=g;inc+=g}});
 if(S.pt){S.pt.love=Math.max(0,S.pt.love-(S.stam<30?8:2));
  if(S.mar){if(mo%12===0){S.pt.sal=Math.round(S.pt.sal*(1+(INF[Math.floor(mo/12)-1]!==undefined?INF[Math.floor(mo/12)-1]:3)/100)*(.9+Math.random()*.3));if(Math.random()<.08){S.pt.jl=3;log('Suami kena PHK.')}}
   if(S.pt.jl>0)S.pt.jl--;else{const n=Math.round(S.pt.sal*(.7+Math.random()*.1));S.b+=n;inc+=n}
   if(S.pt.love<15){pay(5000000);S.mar=0;S.pt=null;S.preg=0;log('Rumah tangga retak, kalian bercerai.')}}
  else if(S.pt.love<=0){S.pt=null;log('Pacar memutuskan hubungan.')}}
 if(S.mar){if(S.preg>0){if(--S.preg===0){S.kids++;pay(3000000);log('Anak lahir! Biaya persalinan Rp 3 juta.')}}
  else if(S.kids<3&&Math.random()<(S.kb?.015:.09)){S.preg=9;log('Kamu hamil. Stamina lebih cepat terkuras.')}}
 log(BLN[mo%12]+': masuk '+fmt(inc)+', tagihan bulanan '+fmt(out)+'.');S.inc=0;S.exp=0;save()}
function step(){
 S.T++;const h=Math.floor(S.T/60)%24,mi=S.T%60;
 if(S.T%1440===0&&day()%30===0)monthEnd();
 if(S.open)S.stam-=drain()/60;else S.stam=Math.min(100,S.stam+10/60);
 if(S.stam<=0){S.stam=0;S.open=false;S.faint=true;log('Kamu pingsan kecapekan! Warnet tutup paksa.')}
 if(S.faint&&S.stam>=40){S.faint=false;log('Badan sudah segar.')}
 if(mi===0)power(h);if(S.busy>0&&--S.busy===0){S.m+=S.jp;S.inc+=S.jp;log('Pulang kerja, dapat '+fmt(S.jp)+'.')}
 if(S.out)return;
 if(S.open){const wt=h>=15&&h<23?1:h>=8&&h<15?.55:h>=23||h<3?.45:.1;
  S.st.forEach(s=>{const cat=K[s.k].c;if(Math.random()<.3*wt*(.5+S[cat==='pc'?'rw':'rr']/5)*dm(s.k)*(S.bC>S.T?2:1)/60)
   S.q.push({n:NM[Math.random()*NM.length|0],cat,want:60+Math.random()*180|0,used:0,wait:0,o:[],ph:'q'})})}
 for(const c of S.q.slice()){c.wait++;const s=S.st.find(x=>!x.c&&K[x.k].c===c.cat);
  if(s){s.c=c;c.k=s.k;c.r=S.pr[s.k];c.q=s.tv>=0?TV[s.tv].q:0;c.ph='p';S.q.splice(S.q.indexOf(c),1)}
  else if(c.wait>75){S.q.splice(S.q.indexOf(c),1);rep(c.cat,-.05);log(c.n+' bosan antre, pulang.')}}
 S.st.forEach((s,i)=>{const c=s.c;if(!c)return;
  if(c.ph==='p'){c.used++;if(Math.random()<1/50)order(c);if(c.used>=c.want){c.ph='d';c.dw=0;log(c.n+' selesai di '+K[s.k].n+'.')}}
  else{c.dw++;if(S.emp&&Math.random()<Math.min(1,.2*S.emp))collect(i);else if(c.dw>120){log(c.n+' kabur tanpa bayar '+fmt(bill(c))+'!');rep(c.cat,-.1);s.c=null}}})}
function collect(i){const s=S.st[i],c=s&&s.c;if(!c||c.ph!=='d')return;const b=bill(c)*mult();S.m+=b;S.inc+=b;rep(c.cat,.03+c.q);s.c=null}
const A={
 tog(){if(S.faint)return log('Masih lemas, istirahat dulu.');if(!S.st.length)return log('Belum ada unit untuk disewakan.');S.open=!S.open;log(S.open?'Warnet BUKA.':'Warnet TUTUP.')},
 pause(){S.pause=!S.pause},spd(i){S.spd=+i},tab(i){S.tab=i},
 cof(){if(S.stock.kopi<1||S.sup.gas<.02)return log('Butuh stok kopi dan gas.');if(S.T-S.cf<60||S.stam>=100)return;S.stock.kopi--;S.sup.gas-=.02;S.stam=Math.min(100,S.stam+15);S.cf=S.T},
 coll(i){if(S.busy>0)return log('Lagi kerja di luar.');collect(+i)},all(){if(S.busy>0)return log('Lagi kerja di luar.');S.st.forEach((s,i)=>collect(i))},
 bu(v){const[k,j]=v.split(':'),c=K[k],t=j!=null?TV[j]:null;if(used()>=S.cap)return log('Ruangan penuh.');if(!buy(c.p+(t?t.p:0)))return;S.st.push({k,tv:t?+j:-1,c:null});log('Beli '+c.n+(t?' + TV '+t.n:'')+'.')},
 eq(i){if(S.eq[i])return;if(buy(EQ[i][1]))S.eq[i]=1},
 bs(i){const it=I.find(x=>x.id===i);if(buy(P(it.c)*10))S.stock[i]+=10},
 sp(i){if(buy(P(i==='gas'?65000:45000)))S.sup[i]+=5},
 tok(n){if(buy(P(n*1000)+2500)){S.kwh+=+n;S.out=0}},
 gen(){if(!S.gen&&buy(4500000))S.gen=true},
 sol(){if(used()>=S.cap)return log('Tidak ada tempat untuk panel.');if(buy(70e6))S.sol++},
 mv(i){if(i==='r'&&S.cap<30&&buy(5e6)){S.cap=30;S.rent=2.5e6}if(i==='b'&&S.cap<80&&buy(600e6)){S.cap=80;S.rent=0}},
 hi(){S.emp++},fi(){if(S.emp>0)S.emp--},
 dep(n){const t=Math.min(+n,S.m);S.m-=t;S.b+=t},wd(n){const t=Math.min(+n,Math.max(S.b,0));S.b-=t;S.m+=t},
 ln(n){if(age()<21)return log('Pinjaman bank butuh usia minimal 21 tahun.');if(S.ln)return log('Masih ada cicilan berjalan.');n=+n;const r=.18/12;S.ln={pay:Math.round(n*r/(1-Math.pow(1+r,-12))),left:12};S.b+=n;log('Pinjaman cair '+fmt(n)+'.')},
 fd(){if(age()<18||S.pt)return;const x=Math.random(),s=x<.35?[1.2e6,2e6,'sederhana']:x<.85?[3e6,6e6,'biasa']:[15e6,40e6,'mapan'];S.pt={n:['Andre','Hendra','Kevin','Rudi','Tommy'][Math.random()*5|0],sal:Math.round(s[0]+Math.random()*(s[1]-s[0])),cls:s[2],love:20,jl:0}},
 date(){if(!S.pt||!buy(100000))return;S.stam-=5;S.pt.love=Math.min(100,S.pt.love+5+Math.random()*6)},
 qt(){if(!S.pt||S.T-S.dt<1440)return;S.dt=S.T;S.stam=Math.max(1,S.stam-3);S.pt.love=Math.min(100,S.pt.love+3)},
 mr(){if(!S.pt||S.mar||age()<19||S.pt.love<60||!buy(10e6))return;S.mar=1;log('Kalian menikah!')},
 bk(){if(!S.pt)return;if(S.mar)spend(5e6);S.mar=0;S.pt=null;S.preg=0},
 kb(){S.kb=S.kb?0:1},
 ven(i){const v=V.find(x=>x.id===i);if(S.v[i])return;if(age()<18)return log('Modal usaha baru bisa dibuka setelah usia 18.');if(buy(P(v.p)))S.v[i]=1},
 ast(i){const x=AS.find(y=>y.id===i);if(!S.as[i]&&buy(P(x.p)))S.as[i]=1},
 bI(){if(buy(200000))S.bI=Math.max(S.bI,S.T)+2880},bC(){if(buy(150000))S.bC=Math.max(S.bC,S.T)+2880},
 job(i){const j=J[i];if(S.busy>0)return log('Masih bekerja di luar.');if(age()<j.age)return log('Belum cukup umur untuk pekerjaan ini.');if(S.open&&S.emp<Math.max(1,j.e))return log('Tutup warnet dulu, atau punya minimal '+Math.max(1,j.e)+' pegawai.');if(S.stam<j.st+10)return log('Terlalu capek untuk kerja.');S.stam-=j.st;S.busy=j.h*60;S.jp=P(j.pay);log('Berangkat kerja: '+j.n+' ('+j.h+' jam).')},
 mk(){Object.keys(K).forEach(k=>S.pr[k]=P(K[k].r));I.forEach(i=>S.pr[i.id]=P(i.p))},
 rst(){if(!rc){rc=1;return}rc=0;fresh();save()}};
document.addEventListener('pointerup',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.dataset.a!=='rst')rc=0;A[b.dataset.a](b.dataset.i);render()});
document.addEventListener('change',e=>{const k=e.target.dataset.p;if(k)S.pr[k]=Math.max(0,Math.round(+e.target.value||0))});
const R=(l,s,a,i,b,x)=>`<div class="row"><span>${l}<br><span class="lg">${s}</span></span>${a?`<button data-a="${a}" data-i="${i}" ${x?'disabled':''}>${b}</button>`:''}</div>`;
const B=(a,i,t,x)=>`<button data-a="${a}" data-i="${i}" ${x?'disabled':''}>${t}</button>`;
function side(){const t=S.tab;let h='';
 if(t==='un'){h=`<div class="lg">Terpakai ${used()}/${S.cap} slot (panel surya juga makan tempat)</div>`+Object.keys(K).map(k=>{const c=K[k];
  return c.tv?`<div class="row"><span>${c.n}<br><span class="lg">pasar ${fmt(P(c.r))}/jam · pilih TV</span></span><span>${TV.map((v,j)=>B('bu',k+':'+j,v.n+' '+fmt(c.p+v.p)),0).join(' ')}</span></div>`:R(c.n,'pasar '+fmt(P(c.r))+'/jam · '+c.w+' W','bu',k,fmt(c.p))}).join('')+Object.keys(EQ).map(k=>R(EQ[k][0],'syarat jual makanan/minuman','eq',k,S.eq[k]?'Punya':fmt(EQ[k][1]),S.eq[k])).join('')}
