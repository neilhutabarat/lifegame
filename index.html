@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sf:#201f1c;--tx:#efece3;--mt:#9a978b;--bd:#37352f;--ac:#2dd4bf;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--sf:#201f1c;--tx:#efece3;--mt:#9a978b;--bd:#37352f;--ac:#2dd4bf;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px}
.r{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.r b{font-size:17px}.mt,.lg{color:var(--mt)}.lg{font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ac)}
.chip{padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
button,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.sm{padding:3px 7px;font-size:12px;border-radius:6px}
button.bad{border-color:var(--bad);color:var(--bad)}
input{width:90px;padding:4px 6px}
main{padding:0 12px 24px;display:grid;gap:14px;grid-template-columns:1fr;max-width:1160px;margin:auto}
@media(min-width:860px){main{grid-template-columns:1fr 1fr}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:86px;display:flex;flex-direction:column;gap:4px}
.card.p{border-color:var(--ac)}.card.d{border-color:var(--wr)}.card.brk{border-color:var(--bad)}
.upbox{margin-top:4px;padding-top:6px;border-top:1px dashed var(--bd);display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.tabs button{padding:4px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin:8px 0}
.cal div{padding:4px 2px;border-radius:6px;font-size:12px;border:1px solid transparent}
.cal .ch{font-weight:700;color:var(--mt)}
.cal .hol{color:var(--bad);font-weight:700}
.cal .tod{border-color:var(--ac);background:var(--ac);color:var(--bg);font-weight:700}

function holName(y,m,d){
  if(m===0&&d===1)return 'Tahun Baru Masehi';
  if(m===4&&d===1&&y>=2014)return 'Hari Buruh';
  if(m===5&&d===1&&y>=2017)return 'Hari Lahir Pancasila';
  if(m===7&&d===17)return 'HUT RI';
  if(m===11&&d===25)return 'Hari Raya Natal';
  return HOL[y+'-'+(m+1)+'-'+d]||'';
}
const isHol=dt=>{const d=dt||curDate();return d.getDay()===0||!!holName(d.getFullYear(),d.getMonth(),d.getDate())};
function schoolEnd(dt){
  const d=dt||curDate(),dow=d.getDay();
  if(age()>=18||isHol(d))return 0;
  return dow===5?12:dow===6?13:14;
}
function inSchool(){

let _m=-1,_f=1;
const fxAt=yr=>{
  let f=1,y=Math.max(0,yr-2008);
  for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;
  return f;
};
const fx=()=>{
  const dt=curDate(),m=(dt.getFullYear()-2008)*12+dt.getMonth();
  if(m!==_m){_m=m;let f=1,y=Math.floor(m/12);for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;f*=1+(INF[y]!==undefined?INF[y]:3)/100*(m%12)/12;_f=f}
  return _f;
};
const P=n=>Math.round(n*fx()/50)*50;
const Py=(n,yr)=>Math.round(n*(fx()/fxAt(yr||2008))/50)*50;

const shiftHours=e=>{const d=(e.end-e.start+24)%24;return d===0?24:d};
function empWorkingNow(e){
  if(e.sick>0||e.off>0)return false;
  const h=Math.floor(S.T/60)%24;
  if(e.start===e.end)return true;
  return e.start<e.end?(h>=e.start&&h<e.end):(h>=e.start||h<e.end);
}

function taxInfo(omzetBulan){
  const dt=curDate(),y=dt.getFullYear(),m=dt.getMonth();
  if(y<2013||(y===2013&&m<6))return {rate:.015,amt:Math.round(omzetBulan*.015),lbl:'Norma 1,5%'};
  if(y<2018||(y===2018&&m<6))return {rate:.01,amt:Math.round(omzetBulan*.01),lbl:'PP 46/2013 1%'};
  if(y<2022)return {rate:.005,amt:Math.round(omzetBulan*.005),lbl:'PP 23/2018 0,5%'};
  const prev=S.yrInc||0,tot=prev+omzetBulan;
  if(tot<=500e6)return {rate:0,amt:0,lbl:'UU HPP 0% (≤500jt)'};
  const kena=prev>=500e6?omzetBulan:(tot-500e6);
  return {rate:.005,amt:Math.round(kena*.005),lbl:'UU HPP 0,5%'};
}

  if(o.solCap===undefined)o.solCap=o.sol>0?o.sol*5:0;
  if(o.sol>0&&o.solCap===0)o.solCap=o.sol*5;
  if(!o.wx)o.wx='cerah';
  if(!Array.isArray(o.emps)){
    o.emps=[];
    const cnt=o.emp||0;
    for(let i=0;i<cnt;i++)o.emps.push({id:i+1,n:EMPNM[i%EMPNM.length],start:8,end:20,sal:900000,burn:0,sick:0,off:0,offMo:-1});
  }
  if(!o.empSeq)o.empSeq=o.emps.length+1;
  if(!Array.isArray(o.dep))o.dep=[];
  if(o.propLn===undefined)o.propLn=null;
  if(o.yrInc===undefined)o.yrInc=0;
  if(o.bI>1)o.bI=o.bI>o.T?1:0;
  if(o.bC>1)o.bC=o.bC>o.T?1:0;

  Object.keys(K).forEach(k=>{if(o.pr[k]===undefined)o.pr[k]=K[k].r});
  o.st.forEach(s=>{if(s.lv===undefined)s.lv=0;if(s.brk===undefined)s.brk=false});
  return o;
}

const dm=k=>Math.min(1.6,Math.max(.15,1.7-.7*S.pr[k]/Py(K[k].r,K[k].yr)));

function updateWeather(){
  const m=curDate().getMonth(),rainy=(m>=10||m<=2);
  const r=Math.random();
  S.wx=rainy?(r<.4?'cerah':r<.75?'mendung':'hujan'):(r<.65?'cerah':r<.9?'mendung':'hujan');
}

function solarStats(){
  const h=Math.floor(S.T/60)%24;
  let w=S.open?100:0;S.st.forEach(s=>{if(s.c)w+=sw(s)});
  const load=w/1000;
  let gen=0;
  if(S.sol>0&&h>=6&&h<17){
    const wm=S.wx==='cerah'?1:S.wx==='mendung'?.45:.18;
    gen=S.sol*2.5*wm;
  }
  return {load,gen,net:gen-load};
}

function power(h){
  if(h%4===0)updateWeather();
  const st=solarStats();
  let load=st.load;
  const direct=Math.min(load,st.gen);load-=direct;
  const surplus=st.gen-direct;
  if(surplus>0&&S.solCap>0)S.solBat=Math.min(S.solCap,S.solBat+surplus);
  if(load>0&&S.solBat>0){const fb=Math.min(load,S.solBat);S.solBat-=fb;load-=fb}
  if(load<=0){S.out=0;return}
  if(S.kwh>=load){S.kwh-=load;S.out=0}
  else if(S.gen){spend(P(5000));S.out=0}
  else{if(!S.out)log('Token listrik & baterai surya habis! Warnet padam.');snd('warn');S.out=1}
}

function dayEnd(){
  const stdSal=P(900000);
  S.emps.forEach(e=>{
    if(e.off>0){e.off--;return}
    if(e.sick>0){
      e.sick--;
      if(e.sick===0)log(e.n+' sudah sembuh dan siap kerja lagi.');
      return;
    }
    const hrs=shiftHours(e);
    const over=Math.max(0,hrs-12);
    const salFactor=e.sal<stdSal*.8?1.5:e.sal>=stdSal*1.2?.75:1;
    e.burn=Math.min(100,e.burn+(2.6+over*.65)*salFactor);
    const sickChance=.0035+over*.0032+(e.burn>75?.012:e.burn>50?.004:0);
    if(Math.random()<sickChance){
      e.sick=1+Math.floor(Math.random()*2);
      log(e.n+' sedang sakit ('+e.sick+' hari). Kamu harus menggantikan jaga shift-nya!');
      snd('warn');
    }
  });
}

function monthEnd(){
  let inc=0,out=0;
  const pay=n=>{if(n>0){spend(n);out+=n}};
  const dt=curDate(),prev=new Date(dt.getFullYear(),dt.getMonth()-1,1);
  const a=age(),mo=(dt.getFullYear()-2008)*12+dt.getMonth();
  pay(P(600000));
  const totalGaji=S.emps.reduce((z,e)=>z+e.sal,0);
  pay(totalGaji);
  pay(P(S.rent));
  if(a>=18)pay(P(1500000+S.kids*1000000+(S.mar?500000:0)+(S.kb?50000:0)));
  else{const j=P(500000);S.b+=j;inc+=j}
  if(S.ln){
    if(have()>=S.ln.pay)pay(S.ln.pay);
    else{spend(Math.round(S.ln.pay*1.02));rep('pc',-.1);log('Cicilan bank telat, kena denda 2%.')}
    if(--S.ln.left<=0)S.ln=null;
  }
  if(S.propLn){
    if(have()>=S.propLn.pay)pay(S.propLn.pay);
    else{spend(Math.round(S.propLn.pay*1.02));log('Cicilan ruko telat, kena denda 2%.')}
    if(--S.propLn.left<=0){S.propLn=null;log('Cicilan ruko LUNAS!')}
  }
  if(S.b>0){const i=Math.round(S.b*.0033);S.b+=i;inc+=i}
  if(S.dep.length){
    let depInt=0;
    S.dep.forEach(d=>{
      const r=depRate(d.mo);
      const gain=Math.round(d.amt*r);
      depInt+=gain;d.mo++;
    });
    if(depInt>0){S.b+=depInt;inc+=depInt;log('Bunga deposito masuk '+fmt(depInt)+' (bunga bulan depan naik!).')}
  }
  V.forEach(v=>{if(S.v[v.id]){const g=P((v.a+Math.random()*(v.b-v.a))*(.6+(S.rw+S.rr)/10)-v.u);S.b+=g;inc+=g}});
  const tx=taxInfo(S.inc);
  if(tx.amt>0){pay(tx.amt);log('Bayar pajak ('+tx.lbl+'): '+fmt(tx.amt)+'.')}
  S.yrInc=(S.yrInc||0)+S.inc;
  if(dt.getMonth()===0)S.yrInc=0;
  if(S.pt){
    S.pt.love=Math.max(0,S.pt.love-(S.stam<30?8:2));
    if(S.mar){
      if(dt.getMonth()===0){
        S.pt.sal=Math.round(S.pt.sal*(1+(INF[Math.floor(mo/12)-1]!==undefined?INF[Math.floor(mo/12)-1]:3)/100)*(.9+Math.random()*.3));
        if(Math.random()<.08){S.pt.jl=3;log('Suami kena PHK.')}
      }
      if(S.pt.jl>0)S.pt.jl--;else{const n=Math.round(S.pt.sal*(.7+Math.random()*.1));S.b+=n;inc+=n}
      if(S.pt.love<15){pay(5000000);S.mar=0;S.pt=null;S.preg=0;log('Rumah tangga retak, kalian bercerai.')}
    }else if(S.pt.love<=0){S.pt=null;log('Pacar memutuskan hubungan.')}
  }
  if(S.mar){
    if(S.preg>0){if(--S.preg===0){S.kids++;pay(3000000);log('Anak lahir! Biaya persalinan Rp 3 juta.')}}
    else if(S.kids<3&&Math.random()<(S.kb?.015:.09)){S.preg=9;log('Kamu hamil. Stamina lebih cepat terkuras.')}
  }
  (S.rec=S.rec||[]).push({y:prev.getFullYear(),m:prev.getMonth(),w:S.inc,o:inc,x:S.exp,c:S.cm||0,h:S.hm||0});
  S.cm=0;S.hm=0;
  log(BLN[prev.getMonth()]+' '+prev.getFullYear()+': warnet '+fmt(S.inc)+', lain '+fmt(inc)+', keluar '+fmt(S.exp)+'.');
  snd('month');S.inc=0;S.exp=0;save();
}

function step(){
  S.T++;
  const h=Math.floor(S.T/60)%24,mi=S.T%60;
  if(S.T%1440===0&&day()>0){
    dayEnd();
    if(curDate().getDate()===1)monthEnd();
  }
  const onD=empOnDuty();
  if(inSchool()&&S.open&&!onD){
    S.open=false;log('Jam sekolah mulai & tidak ada karyawan jaga! Warnet tutup sementara.');
  }
  if(S.open&&!onD)S.stam-=drain()/60;
  else if(S.open&&onD)S.stam=Math.min(100,S.stam+(inSchool()?0:3/60));
  else S.stam=Math.min(100,S.stam+10/60);
  if(S.stam<=0){
    S.stam=0;S.faint=true;
    if(!onD){S.open=false;snd('warn');log('Kamu pingsan kecapekan! Warnet tutup paksa.')}
    else log('Kamu kecapekan, untung ada karyawan yang jaga.');
  }
  if(S.faint&&S.stam>=40){S.faint=false;log('Badan sudah segar.')}
  if(mi===0)power(h);
  if(S.busy>0&&--S.busy===0){S.m+=S.jp;S.inc+=S.jp;log('Pulang kerja, dapat '+fmt(S.jp)+'.')}
  if(S.out)return;

  if(S.open){
    const holM=isHol()?1.35:1;
    const wt=(h>=15&&h<23?1:h>=8&&h<15?.55:h>=23||h<3?.45:.15)*holM;
    S.st.forEach(s=>{
      if(s.brk)return;
      const kc=K[s.k],gms=ownedGames(kc.pf);
      if(kc.c!=='pc'&&gms.length===0)return;
      const gBonus=kc.c==='pc'?(gms.length?1+Math.min(.55,gms.length*.08):.7):(1+Math.min(.5,(gms.length-1)*.1));
      if(Math.random()<.3*wt*(.5+S[kc.c==='pc'?'rw':'rr']/5)*dm(s.k)*gBonus*(S.bC?2:1)/60){
        let act='Browsing',req=1;
        if(kc.c==='pc'){
          if(gms.length>0&&Math.random()>=.38){
            const g=gms[Math.random()*gms.length|0];act=g.n.replace(' (Ori)','');req=g.req||1;
          }else{
            act=['Browsing','Ngetik Tugas','Facebook/Sosmed','YouTube/Streaming'][Math.random()*4|0];
          }
        }else{
          const g=gms[Math.random()*gms.length|0];act=g.n.replace(' (Ori)','');
        }
        snd('bell');
        S.q.push({n:NM[Math.random()*NM.length|0],pf:kc.pf,cat:kc.c,act,req,want:60+Math.random()*180|0,used:0,wait:0,o:[],ph:'q'});
      }
    });
  }
  for(const c of S.q.slice()){
    c.wait++;
    const s=S.st.find(x=>!x.c&&!x.brk&&K[x.k].pf===c.pf&&(K[x.k].c==='pc'||ownedGames(K[x.k].pf).length>0));
    if(s){
      const kc=K[s.k];
      const heavy=(kc.c==='pc'&&c.req>(kc.tier||1));
      s.c=c;c.k=s.k;c.r=S.pr[s.k];c.lm=UPLV[s.lv||0].m;c.heavy=heavy;
      if(heavy)c.want=Math.max(30,Math.round(c.want*.65));
      c.q=(s.tv>=0?TV[s.tv].q:0)+(s.lv||0)*.015-(heavy?.09:0);
      c.ph='p';
      S.q.splice(S.q.indexOf(c),1);
      if(heavy)log(c.n+' mengeluh '+c.act+' berat/lag di '+kc.n+'! Perlu upgrade PC.');
    }else if(c.wait>75){
      S.q.splice(S.q.indexOf(c),1);rep(c.cat,-.05);log(c.n+' bosan antre, pulang.');
    }
  }
  S.st.forEach((s,i)=>{
    const c=s.c;if(!c)return;
    if(c.ph==='p'){
      c.used++;
      if(Math.random()<1/50)order(c);
      if(Math.random()<.00022){
        const pId=K[s.k].pt;
        if((S.parts[pId]||0)>0){
          S.parts[pId]--;
          log(PT[pId].n+' di '+K[s.k].n+' rusak, diganti stok cadangan (sisa '+S.parts[pId]+').');
        }else{
          s.brk=true;c.ph='d';collect(i);
          log(PT[pId].n+' di '+K[s.k].n+' RUSAK! Stok habis, beli di tab Game.');
          snd('warn');return;
        }
      }
      if(c.used>=c.want){c.ph='d';collect(i)}
    }else{
      c.dw=(c.dw||0)+1;
      if(onD&&Math.random()<Math.min(1,.25*activeEmps().length))collect(i);
      else if(c.dw>120){log(c.n+' kabur tanpa bayar '+fmt(bill(c))+'!');rep(c.cat,-.1);s.c=null}
    }
  });
}

function collect(i){
  const s=S.st[i],c=s&&s.c;if(!c||c.ph!=='d')return;
  const b=bill(c)*mult();S.m+=b;S.inc+=b;rep(c.cat,.03+(c.q||0));
  S.cm=(S.cm||0)+1;S.hm=(S.hm||0)+c.used;
  (S.hist=S.hist||[]).unshift({n:c.n,u:K[c.k].n+' ('+(c.act||'Main')+')',m:c.used,b:b,d:dstr(),o:c.o.length});
  S.hist.length=Math.min(S.hist.length,60);snd('coin');s.c=null;
}

const A={
  tog(){
    if(S.faint&&!empOnDuty())return log('Masih lemas, istirahat dulu.');
    if(inSchool()&&!empOnDuty())return log('Sedang jam sekolah (selesai jam '+schoolEnd()+':00). Rekrut/atur shift karyawan jika ingin buka.');
    if(!S.st.length)return log('Belum ada unit untuk disewakan.');
    S.open=!S.open;log(S.open?'Warnet BUKA.':'Warnet TUTUP.');
  },
  pause(){S.pause=!S.pause},
  spd(i){S.spd=+i},
  tab(i){S.tab=i},
  cof(){
    if(S.stock.kopi<1||S.sup.gas<.02)return log('Butuh stok kopi dan gas.');
    if(S.T-S.cf<60||S.stam>=100)return;
    S.stock.kopi--;S.sup.gas-=.02;S.stam=Math.min(100,S.stam+35);S.cf=S.T;
  },
  coll(i){if(S.busy>0&&!empOnDuty())return log('Lagi kerja di luar.');collect(+i)},
  bu(v){
    const[k,j]=v.split(':'),c=K[k],t=j!=null?TV[j]:null;
    if(c.yr>curYear())return log(c.n+' belum rilis (rilis '+c.yr+').');
    if(t&&t.yr>curYear())return log('TV ini belum rilis.');
    if(used()>=S.cap)return log('Ruangan penuh.');
    const cost=Py(c.p,c.yr)+(t?Py(t.p,t.yr):0);
    if(!buy(cost))return;
    S.st.push({k,tv:t?+j:-1,lv:0,brk:false,c:null});
    log('Beli '+c.n+(t?' + TV '+t.n:'')+'.');
    if(c.c!=='pc'&&!ownedGames(c.pf).length)log('Beli game ori untuk '+c.pf.toUpperCase()+' di tab Game agar bisa disewakan!');
  },
  ed(i){editIdx=editIdx===+i?-1:+i},
  sell(i){
    const s=S.st[+i];if(!s||s.c)return log('Tunggu pelanggan selesai main dulu.');
    const v=unitVal(s);S.m+=v;S.st.splice(+i,1);editIdx=-1;snd('coin');
    log('Jual second '+K[s.k].n+' dapat '+fmt(v)+'.');
  },
  upk(i){
    const s=S.st[+i];if(!s||s.c)return;
    const c=K[s.k];if(!c.next)return;
    const nk=K[c.next];
    if(nk.yr>curYear())return log(nk.n+' baru rilis tahun '+nk.yr+'.');
    if(!buy(Py(c.up,nk.yr)))return;
    s.k=c.next;log('Upgrade unit jadi '+nk.n+'!');
  },
  uptv(v){
    const[idx,j]=v.split(':'),s=S.st[+idx];if(!s||s.c||s.tv<0||+j<=s.tv)return;
    if(TV[+j].yr>curYear())return log('TV ini belum rilis.');
    const cost=Math.max(100000,Py(TV[+j].p,TV[+j].yr)-Math.round(Py(TV[s.tv].p,TV[s.tv].yr)*.5));
    if(!buy(cost))return;
    s.tv=+j;log('Upgrade TV unit #'+(+idx+1)+' jadi '+TV[s.tv].n+'.');
  },
  uplv(i){
    const s=S.st[+i];if(!s||s.c)return;
    const nl=(s.lv||0)+1;if(nl>=UPLV.length)return;
    if(!buy(P(UPLV[nl].p)))return;
    s.lv=nl;log('Upgrade unit #'+(+i+1)+' ke '+UPLV[nl].n+'.');
  },
  fix(i){
    const s=S.st[+i];if(!s||!s.brk)return;
    const pId=K[s.k].pt;
    if((S.parts[pId]||0)<=0)return log('Stok '+PT[pId].n+' kosong! Beli dulu di tab Game.');
    S.parts[pId]--;s.brk=false;log(K[s.k].n+' sudah diperbaiki.');
  },
  bgm(id){
    const g=GM.find(x=>x.id===id);if(!g||S.games[id]||g.yr>curYear())return;
    if(buy(Py(g.p,g.yr))){S.games[id]=1;log('Beli game ori: '+g.n+'.')}
  },
  bpt(id){
    const p=PT[id];if(!p||p.yr>curYear())return;
    if(buy(Py(p.p,p.yr))){S.parts[id]=(S.parts[id]||0)+1;log('Beli cadangan '+p.n+'.')}
  },
  eq(i){if(S.eq[i])return;if(buy(EQ[i][1]))S.eq[i]=1},
  bs(v){
    const[id,q]=v.split(':'),qty=Math.min(1000,Math.max(100,+q||100));
    const it=I.find(x=>x.id===id);if(!it)return;
    if(buy(P(it.c)*qty)){S.stock[id]+=qty;log('Beli stok '+it.n+' +'+qty+'.')}
  },
  sp(i){if(buy(P(i==='gas'?65000:45000)))S.sup[i]+=5},
  tok(n){if(buy(P(n*1000)+2500)){S.kwh+=+n;S.out=0}},
  gen(){if(!S.gen&&buy(4500000))S.gen=true},
  sol(){
    if(buy(70e6)){
      S.sol++;
      if(S.solCap===0){S.solCap=5;S.solBat=2.5}
      log('Pasang panel surya '+S.sol+' kWp di atap (daya maks '+(S.sol*2.5).toFixed(1)+' kW, baterai terisi '+S.solBat.toFixed(1)+' kWh).');
    }
  },
  bat(k){
    const map={5:4e6,10:7.5e6,25:17e6},add=+k;
    if(buy(P(map[k]))){
      S.solCap+=add;
      S.solBat=Math.min(S.solCap,S.solBat+add*.5);
      log('Upgrade kapasitas baterai +'+add+' kWh (terisi '+S.solBat.toFixed(1)+'/'+S.solCap+' kWh).');
    }
  },
  chgbat(){
    if(S.solCap<=0)return log('Pasang panel surya / baterai dulu.');
    const need=S.solCap-S.solBat;
    if(need<.1)return log('Baterai surya sudah penuh.');
    if(S.kwh<=0)return log('Token PLN kosong untuk mengisi baterai.');
    const fill=Math.min(need,S.kwh);
    S.kwh-=fill;S.solBat+=fill;
    log('Isi baterai surya '+fill.toFixed(1)+' kWh dari token PLN.');
  },
  mv(i){
    if(i==='r'&&S.cap<30&&buy(5e6)){S.cap=30;S.rent=2.5e6}
    if(i==='b'&&S.cap<80&&buy(600e6)){S.cap=80;S.rent=0;S.propLn=null;log('Beli ruko tunai 80 slot!')}
    if(i==='bc'&&S.cap<80&&!S.propLn){
      if(age()<21)return log('Kredit ruko butuh usia minimal 21 tahun.');
      if(buy(120e6)){S.cap=80;S.rent=0;S.propLn={pay:10800000,left:60};log('Kredit ruko disetujui! DP Rp 120 jt, cicilan Rp 10,8 jt/bln x 60 bln.')}
    }
  },
  hi(){
    const id=S.empSeq++,n=EMPNM[(id-1)%EMPNM.length]+' #'+id;
    const st=S.emps.length%2===0?8:20,en=(st+12)%24;
    S.emps.push({id,n,start:st,end:en,sal:P(900000),burn:0,sick:0,off:0,offMo:-1});
    log('Rekrut '+n+' (shift '+String(st).padStart(2,'0')+':00–'+String(en).padStart(2,'0')+':00, gaji '+fmt(P(900000))+').');
  },
  fi(id){S.emps=S.emps.filter(e=>e.id!==+id)},
  es(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.start=(e.start+(+d)+24)%24},
  ee(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.end=(e.end+(+d)+24)%24},
  esal(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.sal=Math.max(200000,e.sal+(+d))},
  eoff(id){
    const e=S.emps.find(x=>x.id===+id);if(!e)return;
    const cm=(curYear()-2008)*12+curDate().getMonth();
    if(e.offMo===cm)return log(e.n+' sudah dapat jatah libur bulan ini.');
    if(e.sick>0)return log(e.n+' sedang sakit.');
    e.off=1;e.burn=0;e.offMo=cm;
    log(e.n+' diberi libur 1 hari! Tingkat jenuhnya pulih 100% (0%).');
  },
  dep(n){const t=Math.min(+n,S.m);S.m-=t;S.b+=t},
  wd(n){const t=Math.min(+n,Math.max(S.b,0));S.b-=t;S.m+=t},
  mkdep(n){
    n=+n;if(S.b<n)return log('Saldo rekening kurang untuk deposito '+fmt(n)+'.');
    S.b-=n;S.dep.push({id:Date.now()+Math.random(),amt:n,mo:0});
    log('Buka deposito '+fmt(n)+' (bunga awal 0,5%/bln, naik +0,1% tiap bulan).');snd('buy');
  },
  cldep(idx){
    const d=S.dep[+idx];if(!d)return;
    S.b+=d.amt;S.dep.splice(+idx,1);snd('coin');
    log('Cairkan deposito '+fmt(d.amt)+' ke rekening.');
  },
  ln(n){
    if(age()<21)return log('Pinjaman bank butuh usia minimal 21 tahun.');
    if(S.ln)return log('Masih ada cicilan berjalan.');
    n=+n;const r=.18/12;S.ln={pay:Math.round(n*r/(1-Math.pow(1+r,-12))),left:12};S.b+=n;log('Pinjaman cair '+fmt(n)+'.');
  },
  fd(){
    if(age()<18||S.pt)return;
    const x=Math.random(),s=x<.35?[1.2e6,2e6,'sederhana']:x<.85?[3e6,6e6,'biasa']:[15e6,40e6,'mapan'];
    S.pt={n:['Andre','Hendra','Kevin','Rudi','Tommy'][Math.random()*5|0],sal:Math.round(s[0]+Math.random()*(s[1]-s[0])),cls:s[2],love:20,jl:0};
  },
  date(){if(!S.pt||!buy(100000))return;S.stam-=5;S.pt.love=Math.min(100,S.pt.love+5+Math.random()*6)},
  qt(){if(!S.pt||S.T-S.dt<1440)return;S.dt=S.T;S.stam=Math.max(1,S.stam-3);S.pt.love=Math.min(100,S.pt.love+3)},
  mr(){if(!S.pt||S.mar||age()<19||S.pt.love<60||!buy(10e6))return;S.mar=1;log('Kalian menikah!')},
  bk(){if(!S.pt)return;if(S.mar)spend(5e6);S.mar=0;S.pt=null;S.preg=0},
  kb(){S.kb=S.kb?0:1},
  ven(i){const v=V.find(x=>x.id===i);if(S.v[i])return;if(age()<18)return log('Modal usaha baru bisa dibuka setelah usia 18.');if(buy(P(v.p)))S.v[i]=1},
  ast(i){const x=AS.find(y=>y.id===i);if(!S.as[i]&&buy(P(x.p)))S.as[i]=1},
  bI(){S.bI=S.bI?0:1},
  bC(){S.bC=S.bC?0:1},
  job(i){
    const j=J[i];if(S.busy>0)return log('Masih bekerja di luar.');
    if(age()<j.age)return log('Belum cukup umur untuk pekerjaan ini.');
    if(inSchool())return log('Sedang jam sekolah.');
    if(S.open&&activeEmps().length<Math.max(1,j.e))return log('Tutup warnet dulu, atau pastikan ada minimal '+Math.max(1,j.e)+' karyawan sedang jaga.');
    if(S.stam<j.st+10)return log('Terlalu capek untuk kerja.');
    S.stam-=j.st;S.busy=j.h*60;S.jp=P(j.pay);log('Berangkat kerja: '+j.n+' ('+j.h+' jam).');
  },
  mk(){Object.keys(K).forEach(k=>S.pr[k]=Py(K[k].r,K[k].yr));I.forEach(i=>S.pr[i.id]=P(i.p))},
  mute(){S.mute=!S.mute;if(!S.mute)snd('coin')},
  hv(i){S.hv=i},
  rst(){if(!rc){rc=1;return}rc=0;editIdx=-1;fresh();save()}
};

    +R('Upgrade baterai +5 kWh','kapasitas saat ini '+S.solCap+' kWh (langsung terisi 50%)','bat',5,fmt(P(4e6)))
    +R('Upgrade baterai +10 kWh','simpan daya surya untuk malam/hujan (terisi 50%)','bat',10,fmt(P(7.5e6)))
    +R('Upgrade baterai +25 kWh','cadangan besar untuk warnet 24 jam (terisi 50%)','bat',25,fmt(P(17e6)));
  }
  if(t==='us'){
    h=R('Garasi rumah','kapasitas 10 slot',0)
    +R('Sewa ruko','30 slot · sewa Rp 2,5 juta/bln + deposit Rp 5 juta','mv','r',S.cap>=30?'Aktif':fmt(5e6),S.cap>=30)
    +R('Beli ruko (Tunai)','80 slot, bebas sewa selamanya','mv','b',S.cap>=80?'Punya':fmt(600e6),S.cap>=80)
    +R('Beli ruko (Kredit/Cicilan)','80 slot · DP Rp 120 jt + cicilan Rp 10,8 jt/bln x 60 bln (total Rp 768 jt, usia min. 21)','mv','bc',S.propLn?'Cicilan '+S.propLn.left+' bln':S.cap>=80?'Punya':'DP '+fmt(120e6),S.cap>=80||!!S.propLn||age()<21)
    +R('Mode Cuan x2 (Gratis)','tagihan pelanggan dobel, bebas nyalakan/matikan','bI','',S.bI?'ON':'OFF')
    +R('Mode Ramai x2 (Gratis)','pelanggan datang dobel, bebas nyalakan/matikan','bC','',S.bC?'ON':'OFF')
    +'<h2>Store usaha (modal usaha)</h2>'+V.map(v=>R(v.n,'untung ±'+fmt(P((v.a+v.b)/2-v.u))+'/bln','ven',v.id,S.v[v.id]?'Aktif':fmt(P(v.p)),S.v[v.id])).join('')
    +'<h2>Store aset</h2>'+AS.map(x=>R(x.n,'hemat stamina '+Math.round(x.r*100)+'%','ast',x.id,S.as[x.id]?'Punya':fmt(P(x.p)),S.as[x.id])).join('');
  }
  if(t==='bk'){
    h=`<div class="r"><b>${fmt(S.b)}</b><span class="lg">saldo m-Banking (bunga tabungan 4%/thn)</span></div>`
    +R('Setor tunai','','dep',1000000,'Setor 1 jt')
    +R('Tarik tunai','','wd',1000000,'Tarik 1 jt')
    +'<h2>Deposito (Bunga Naik Tiap Bulan)</h2>'
    +'<div class="lg">Bunga mulai 0,5%/bln dan naik +0,1% tiap bulan mengendap (maks 1,5%/bln). Bunga cair otomatis ke rekening tiap akhir bulan.</div>'
    +`<div class="row"><span>Buka deposito baru</span><span>${[5e6,10e6,25e6,50e6,100e6].map(n=>B('mkdep',n,fmt(n),S.b<n,'sm')).join(' ')}</span></div>`
    +(S.dep.length?S.dep.map((d,idx)=>R(fmt(d.amt),'umur '+d.mo+' bln · bunga bulan ini '+(depRate(d.mo)*100).toFixed(1)+'% ('+fmt(d.amt*depRate(d.mo))+')','cldep',idx,'Cairkan')).join(''):'<div class="lg">Belum ada deposito aktif.</div>')
    +'<h2>Pinjaman & Cicilan</h2>'
    +(S.ln?R('Cicilan bank berjalan',fmt(S.ln.pay)+'/bln · sisa '+S.ln.left+' bln'):'')
    +(S.propLn?R('Cicilan ruko berjalan',fmt(S.propLn.pay)+'/bln · sisa '+S.propLn.left+' bln'):'')
    +[10e6,25e6,50e6,100e6].map(n=>R('Pinjaman '+fmt(n),'bunga 18%/thn, 12 bulan, usia min. 21','ln',n,'Ajukan',!!S.ln||age()<21)).join('');
  }
  if(t==='pg'){
    const cm=(curYear()-2008)*12+curDate().getMonth(),stdSal=P(900000);
    h=`<div class="lg">Normal jam kerja karyawan adalah <b>12 jam/hari</b>. Lebih dari 12 jam membuat jenuh lebih cepat & mudah sakit. Beri libur 1x/bulan untuk memulihkan jenuh 100%. Gaji standar saat ini: ${fmt(stdSal)}/bln.</div>`
    +`<div class="row"><span>Total karyawan: <b>${S.emps.length}</b> (jaga sekarang: ${activeEmps().length})</span>${B('hi','','+ Rekrut Karyawan')}</div>`
    +S.emps.map(e=>{
      const hrs=shiftHours(e),st=e.sick>0?`<b style="color:var(--bad)">SAKIT (${e.sick} hari) - Kamu ganti!</b>`:e.off>0?'<b style="color:var(--ok)">LIBUR</b>':empWorkingNow(e)?'<b style="color:var(--ok)">Sedang jaga</b>':'Off shift';
      const usedOff=e.offMo===cm;
      return `<div class="box">
        <div class="r"><b>${e.n}</b><span class="lg">${st}</span>${B('fi',e.id,'Pecat',0,'sm bad')}</div>
        <div class="lg">Jenuh: <b>${Math.round(e.burn)}%</b> · Shift: <b>${padH(e.start)}–${padH(e.end)} (${hrs} jam${hrs>12?' ⚠️ lembur':''})</b></div>
        <div class="bar"><i style="width:${e.burn}%;background:${e.burn>70?'var(--bad)':e.burn>40?'var(--wr)':'var(--ac)'}"></i></div>
        <div class="row"><span class="lg">Masuk ${padH(e.start)}</span><span>${B('es',e.id+':-1','-1j',0,'sm')} ${B('es',e.id+':1','+1j',0,'sm')}</span><span class="lg">Pulang ${padH(e.end)}</span><span>${B('ee',e.id+':-1','-1j',0,'sm')} ${B('ee',e.id+':1','+1j',0,'sm')}</span></div>
        <div class="row"><span class="lg">Gaji: <b>${fmt(e.sal)}</b>/bln</span><span>${B('esal',e.id+':-100000','-100rb',0,'sm')} ${B('esal',e.id+':100000','+100rb',0,'sm')} ${B('eoff',e.id,usedOff?'Sudah libur bln ini':'Beri Libur (Jenuh 0%)',usedOff||e.sick>0,'sm')}</span></div>
      </div>`;
    }).join('');
  }
  if(t==='kl'){
    const dt=curDate(),y=dt.getFullYear(),m=dt.getMonth(),td=dt.getDate();
    const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    let cells=HARI.map(x=>`<div class="ch">${x}</div>`).join('')+'<div></div>'.repeat(first);
    const list=[];
    for(let d=1;d<=days;d++){
      const hn=holName(y,m,d),dow=(first+d-1)%7,red=(dow===0||!!hn);
      if(hn)list.push(d+' '+BLN[m]+': '+hn);
      cells+=`<div class="${red?'hol':''} ${d===td?'tod':''}">${d}</div>`;
    }
    const se=schoolEnd();
    h=`<div class="r"><b>${BLN[m]} ${y}</b><span class="lg">${age()<18?(se?'Sekolah hari ini: 07:00–'+se+':00':'Hari ini libur sekolah!'):'Sudah lulus sekolah'}</span></div>`
    +`<div class="cal">${cells}</div>`
    +'<h2>Hari Libur Nasional Bulan Ini</h2>'
    +(list.length?list.map(x=>`<div class="lg">• ${x}</div>`).join(''):'<div class="lg">Tidak ada tanggal merah nasional selain hari Minggu.</div>');
  }
  if(t==='jb'){
    h='<div class="lg">Kerja di luar memakai stamina dan waktu. Kalau warnet buka, perlu karyawan yang sedang shift agar tetap jalan.</div>'
    +J.map((j,i)=>R(j.n,j.h+' jam · '+fmt(P(j.pay))+' · stamina -'+j.st+' · usia '+j.age+'+'+(j.e?' · '+j.e+' karyawan jaga':''),'job',i,'Ambil',S.busy>0||age()<j.age||inSchool())).join('');
  }
  if(t==='hd'){
    const p=S.pt;
    h=`<div class="lg">Usia ${age()} · biaya hidup ${age()>=18?fmt(P(1500000+S.kids*1e6+(S.mar?5e5:0))):'ditanggung ortu (uang jajan '+fmt(P(500000))+'/bln)'} · anak ${S.kids}${S.preg?' · hamil '+(9-S.preg)+'/9 bln':''}</div>`
    +(p?R(p.n+(S.mar?' (suami)':' (pacar)'),'tipe '+p.cls+' · gaji ±'+fmt(p.sal)+' · hubungan '+Math.round(p.love)+(p.love<30?' retak':p.love>70?' harmonis':'')+(S.mar?' · nafkah 70-80% gaji':''),'bk','','Putus/cerai')+`<div class="row">${B('date','','Kencan Rp 100rb')}${B('qt','','Waktu bersama')}${B('mr','','Menikah Rp 10jt (min 19, hubungan 60)',S.mar||age()<19)}${B('kb','',S.kb?'KB aktif':'Pakai KB Rp 50rb/bln')}</div>`
    :R('Belum punya pasangan','mulai usia 18','fd','','Cari pasangan',age()<18));
  }
  if(t==='hg'){
    h='<div class="lg">Harga pasar naik tiap tahun mengikuti inflasi (angka BPS).</div>'
    +B('mk','','Samakan semua dengan harga pasar')
    +Object.keys(K).filter(k=>K[k].yr<=yr).map(k=>`<div class="row"><span>${K[k].n}<br><span class="lg">pasar ${fmt(Py(K[k].r,K[k].yr))}/jam</span></span><input type="number" data-p="${k}" value="${S.pr[k]}"></div>`).join('')
    +I.map(i=>`<div class="row"><span>${i.n}<br><span class="lg">pasar ${fmt(P(i.p))}</span></span><input type="number" data-p="${i.id}" value="${S.pr[i.id]}"></div>`).join('');
  }
  if(t==='rh'){
    const v=S.hv||'p',rec=S.rec||[],cur={w:S.inc,o:0,x:S.exp,c:S.cm||0,h:S.hm||0};
    const sum=a=>a.reduce((z,r)=>({w:z.w+r.w,o:z.o+r.o,x:z.x+r.x,c:z.c+r.c,h:z.h+r.h}),{w:0,o:0,x:0,c:0,h:0});
    const row=(l,r)=>`<div class="row"><span>${l}<br><span class="lg">${r.c} pelanggan · ${Math.round(r.h/60)} jam · warnet ${fmt(r.w)} · lain ${fmt(r.o)} · keluar ${fmt(r.x)}</span></span><b style="color:${r.w+r.o-r.x<0?'var(--bad)':'var(--ok)'}">${fmt(r.w+r.o-r.x)}</b></div>`;
    h='<div class="tabs">'+[['p','Pemain'],['b','Bulanan'],['t','Tahunan']].map(x=>B('hv',x[0],x[1],0,v===x[0]?'on':'')).join('')+'</div>';
    if(v==='p')h+=(S.hist||[]).map(x=>`<div class="row"><span>${x.n} · ${x.u}<br><span class="lg">${dur(x.m)} · ${x.o} pesanan · ${x.d}</span></span><b>${fmt(x.b)}</b></div>`).join('')||'<div class="lg">Belum ada pelanggan yang selesai main.</div>';
    if(v==='b')h+=row('Bulan berjalan',cur)+rec.slice().reverse().map(r=>row(BLN[r.m]+' '+r.y,r)).join('');
    if(v==='t'){const ys={},yc=curYear();rec.forEach(r=>(ys[r.y]=ys[r.y]||[]).push(r));if(!ys[yc])ys[yc]=[];h+=Object.keys(ys).sort().reverse().map(y=>row('Tahun '+y+(+y===yc?' (berjalan)':''),sum(ys[y].concat(+y===yc?[cur]:[])))).join('')}
  }
  if(t==='lg')h=S.log.map(l=>`<div class="lg">${l}</div>`).join('')+`<p><button data-a="rst">${rc?'Yakin? Tap lagi':'Mulai ulang game'}</button></p>`;
  return h;
}

function render(){
  const dt=curDate(),yr=curYear(),hn=holName(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const tx=taxInfo(S.inc),sk=sickEmps().length,ss=solarStats();
  const st=S.busy>0?['KERJA '+Math.ceil(S.busy/60)+'j','var(--wr)']:S.out?['PADAM','var(--bad)']:S.faint?['PINGSAN','var(--bad)']:inSchool()&&!empOnDuty()?['SEKOLAH (s/d '+schoolEnd()+':00)','var(--wr)']:S.open?['BUKA','var(--ok)']:['TUTUP','var(--mt)'];
  const chgTag=S.solCap>0?(ss.net>0&&S.solBat<S.solCap?' ⚡':''):'';
  put($('#hd'),
    `<div class="r"><b>${fmt(S.m)}</b><span class="lg">rekening ${fmt(S.b)}</span><span>${HARI[dt.getDay()]}, ${dt.getDate()} ${BLN[dt.getMonth()]} ${yr}, ${clock()}</span><span>Usia ${age()}</span><span class="chip" style="color:${st[1]}">${st[0]}</span>${hn?`<span class="chip" style="color:var(--bad)">Libur: ${hn}</span>`:''}${sk?`<span class="chip" style="color:var(--wr)">${sk} Karyawan Sakit</span>`:''}</div>`
    +`<div class="r lg"><span>Rep warnet ★${S.rw.toFixed(1)}</span><span>Rep rental ★${S.rr.toFixed(1)}</span><span>Antre ${S.q.length}</span><span>Token ${S.kwh.toFixed(0)} kWh${S.solCap?' · Bat '+S.solBat.toFixed(1)+'/'+S.solCap+chgTag:''}</span><span>${wxIcon()}</span><span>Slot ${used()}/${S.cap}</span><span>Pajak: <b>${fmt(tx.amt)}</b> (${tx.lbl})</span><span>Harga x${fx().toFixed(2)}</span></div>`
    +`<div class="bar"><i style="width:${S.stam}%;background:${S.stam<25?'var(--bad)':'var(--ac)'}"></i></div>`
  );
  put($('#ctl'),
    `<button data-a="tog" class="${S.open?'on':''}">${S.open?'Tutup':'Buka'}</button>`
    +`<button data-a="pause" class="${S.pause?'on':''}">${S.pause?'Lanjut':'Jeda'}</button>`
    +[1,4,8,16,64].map(x=>`<button data-a="spd" data-i="${x}" class="${S.spd===x?'on':''}">${x}x</button>`).join('')
    +`<button data-a="cof">Ngopi +35</button>`
    +`<button data-a="bI" class="${S.bI?'on':''}">Cuan x2</button>`
    +`<button data-a="bC" class="${S.bC?'on':''}">Ramai x2</button>`
    +`<button data-a="mute">${S.mute?'Suara: mati':'Suara: nyala'}</button>`
  );
  put($('#sts'),S.st.length?S.st.map((s,i)=>{
    const c=s.c,k=K[s.k],lv=s.lv||0,noGm=(k.c!=='pc'&&ownedGames(k.pf).length===0);
    let b='';
    if(s.brk){
      b=`<div style="color:var(--bad)"><b>RUSAK</b> (${PT[k.pt].n})</div>${B('fix',i,'Perbaiki ('+(S.parts[k.pt]||0)+')',0,'sm')}`;
    }else if(!c){
      b=`<div class="mt">${noGm?'<span style="color:var(--wr)">Beli game '+k.pf.toUpperCase()+'!</span>':'Kosong'}</div>`
        +`<div class="r">${B('ed',i,editIdx===i?'Tutup':'Kelola',0,'sm')}</div>`;
      if(editIdx===i){
        const nl=lv+1,nk=k.next?K[k.next]:null;
        b+=`<div class="upbox">`
          +(nk&&nk.yr<=yr?B('upk',i,'Ke '+nk.n+' ('+fmt(Py(k.up,nk.yr))+')',0,'sm'):nk?`<span class="lg">${nk.n} rilis ${nk.yr}</span>`:'')
          +(s.tv>=0?TV.map((tv,j)=>j>s.tv&&tv.yr<=yr?B('uptv',i+':'+j,'TV '+tv.n+' ('+fmt(Math.max(100000,Py(tv.p,tv.yr)-Math.round(Py(TV[s.tv].p,TV[s.tv].yr)*.5)))+')',0,'sm'):'').join(''):'')
          +(nl<UPLV.length?B('uplv',i,'Up Lv'+nl+' ('+fmt(P(UPLV[nl].p))+')',0,'sm'):'<span class="lg">Upgrade Lv Max</span>')
          +B('sell',i,'Jual Second ('+fmt(unitVal(s))+')',0,'sm bad')
          +`</div>`;
      }
    }else if(c.ph==='p'){
      b=`<div>${c.n}</div><div class="lg">${c.act||'Main'}${c.heavy?' · <b style="color:var(--bad)">⚠️ Berat/Lag</b>':''}</div><div class="bar"><i style="width:${c.used/c.want*100}%"></i></div><div>${fmt(bill(c)*mult())}</div><div class="lg">${dur(c.used)} · ${c.o.length} pesanan</div>`;
    }else{
      b=`<div>${c.n}</div><button data-a="coll" data-i="${i}" class="sm">Tagih ${fmt(bill(c)*mult())}</button>`;
    }
    return `<div class="card ${s.brk?'brk':c?c.ph:''}"><div><b>${k.n}</b>${lv?' <span class="chip">Lv'+lv+'</span>':''}${s.tv>=0?' <span class="lg">+ TV '+TV[s.tv].n+'</span>':''}</div>${b}</div>`;
  }).join(''):'<div class="mt">Garasi masih kosong. Beli PC/PS/Xbox di tab Unit & game ori di tab Game.</div>');
  put($('#tb'),[['un','Unit'],['gm','Game'],['st','Stok'],['li','Listrik'],['us','Usaha'],['bk','Bank'],['pg','Pegawai'],['kl','Kalender'],['jb','Kerja'],['hd','Hidup'],['hg','Harga'],['rh','Riwayat'],['lg','Catatan']].map(x=>`<button data-a="tab" data-i="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join(''));
  put($('#side'),side());
}

let last=performance.now(),acc=0;
setInterval(()=>{
  const n=performance.now();let dt=(n-last)/1000;last=n;if(dt>1)dt=1;
  if(!S.pause){acc+=dt*2*S.spd;while(acc>=1){step();acc--}}
  render();
},100);

window.getState=()=>S;
window.applyCloud=o=>{if(o&&o.st){S=migrate(o);_m=-1;rc=0;editIdx=-1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}};
window.addEventListener('pagehide',save);
render();
</script>
<script type="module" src="./cloud.js"></script></body></html>
