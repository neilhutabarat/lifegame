function holName(y,m,d){
  if(m===0&&d===1)return 'Tahun Baru Masehi';
  if(m===4&&d===1&&y>=2014)return 'Hari Buruh';
  if(m===5&&d===1&&y>=2017)return 'Hari Lahir Pancasila';
  if(m===7&&d===17)return 'HUT RI';
  if(m===11&&d===25)return 'Hari Raya Natal';
  return HOL[y+'-'+(m+1)+'-'+d]||'';
}
const isHol=dt=>{const d=dt||curDate();return d.getDay()===0||!!holName(d.getFullYear(),d.getMonth(),d.getDate())};
function schoolEnd(dt){
  const d=dt||curDate(),dow=d.getDay();
  if(age()>=18||isHol(d))return 0;
  return dow===5?12:dow===6?13:14;
}
function inSchool(){
  const end=schoolEnd(),h=Math.floor(S.T/60)%24;
  return end>0&&h>=7&&h<end;
}

let _m=-1,_f=1;
const fxAt=yr=>{
  let f=1,y=Math.max(0,yr-START_YEAR);
  for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:2.8)/100;
  return f;
};
const fx=()=>{
  const dt=curDate(),m=(dt.getFullYear()-START_YEAR)*12+dt.getMonth();
  if(m!==_m){_m=m;let f=1,y=Math.floor(m/12);for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:2.8)/100;f*=1+(INF[y]!==undefined?INF[y]:2.8)/100*(m%12)/12;_f=f}
  return _f;
};
const P=n=>Math.round(n*fx()/50)*50;
const Py=(n,yr)=>Math.round(n*(fx()/fxAt(yr||START_YEAR))/50)*50;

const shiftHours=e=>{const d=(e.end-e.start+24)%24;return d===0?24:d};
function empWorkingNow(e){
  if(e.sick>0||e.off>0)return false;
  const h=Math.floor(S.T/60)%24;
  if(e.start===e.end)return true;
  return e.start<e.end?(h>=e.start&&h<e.end):(h>=e.start||h<e.end);
}
const activeEmps=()=>S.emps.filter(empWorkingNow);

function taxInfo(omzetBulan){
  const dt=curDate(),y=dt.getFullYear(),m=dt.getMonth();
  if(y===2018&&m<6)return {rate:.01,amt:Math.round(omzetBulan*.01),lbl:'PP 46/2013 1%'};
  if(y<2022)return {rate:.005,amt:Math.round(omzetBulan*.005),lbl:'PP 23/2018 0,5%'};
  const prev=S.yrInc||0,tot=prev+omzetBulan;
  if(tot<=500e6)return {rate:0,amt:0,lbl:'UU HPP 0% (≤500jt)'};
  const kena=prev>=500e6?omzetBulan:(tot-500e6);
  return {rate:.005,amt:Math.round(kena*.005),lbl:'UU HPP 0,5%'};
}

function usedSellVal(basePrice,boughtDay){
  const ageYrs=Math.max(0,(day()-(boughtDay||0))/360);
  const ratio=Math.max(.25,.85-ageYrs*.06);
  return Math.round(basePrice*ratio/1000)*1000;
}
function solSellVal(item){return usedSellVal(25e6,item?item.day:0)}
function solAvgAgeMo(){
  if(!S.solList.length)return 0;
  const tot=S.solList.reduce((a,x)=>a+Math.max(0,day()-(x.day||0)),0);

}

}

function migrate(o){
  if(!Array.isArray(o.solList))o.solList=[];
  if(!Array.isArray(o.houses))o.houses=[];
  if(!Array.isArray(o.emps))o.emps=[];
  if(!Array.isArray(o.dep))o.dep=[];
  if(!Array.isArray(o.rec))o.rec=[];
  if(!o.grid)o.grid={lv:0,on:false,rate:1000,sat:85};
  if(!o.isp)o.isp={infra:0,lines:{},pkg:1,fault:0,sat:85};
  if(!o.isp.lines){
    o.isp.lines={};
    // Migrasi dari format lama single-line jika ada
    if(o.isp.up===1)o.isp.lines[1]=1;
    else if(o.isp.up===2)o.isp.lines[3]=1;
    else if(o.isp.up===3)o.isp.lines[5]=1;
    else if(o.isp.up>=4)o.isp.lines[7]=1;
  }
  return o;
}

const have=()=>S.m+S.b;
const spend=n=>{const t=Math.min(Math.max(S.m,0),n);S.m-=t;S.b-=n-t;S.exp+=n};
const buy=n=>{if(have()<n){log('Uang kurang ('+fmt(n)+').');snd('warn');return 0}spend(n);snd('buy');return 1};
const mult=()=>S.bI?2:1;

let AC;const _l={};
function snd(t){
  if(S.mute||document.hidden)return;
  try{
    const n=performance.now();if(_l[t]&&n-_l[t]<120)return;_l[t]=n;
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const q={coin:[[988,.07],[1319,.12]],bell:[[660,.08]],buy:[[440,.06],[554,.06],[659,.09]],warn:[[220,.18],[180,.22]],month:[[523,.1],[659,.1],[784,.18]],click:[[300,.03]]}[t]||[];
    let at=AC.currentTime;
    q.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t==='warn'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.11,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.02);at+=d*.9});
  }catch(e){}
}

const dstr=()=>{const dt=curDate();return HARI[dt.getDay()]+', '+dt.getDate()+' '+BLN[dt.getMonth()]+' '+dt.getFullYear()+' '+clock()};
const drain=()=>4.2/(1+(empOnDuty()?1.4*activeEmps().length:0));

function updateWeather(){
  const m=curDate().getMonth(),rainy=(m>=10||m<=2);
  const r=Math.random();
  S.wx=rainy?(r<.4?'cerah':r<.75?'mendung':'hujan'):(r<.65?'cerah':r<.9?'mendung':'hujan');
}

function solarStats(){
  const h=Math.floor(S.T/60)%24;
  const solCnt=S.solList.length;
  const tech=SOL_TECH[S.solTech||0];
  const wm=S.wx==='cerah'?1:S.wx==='mendung'?.45:.18;
  const sunOn=(solCnt>0&&h>=6&&h<17);
  const chgWatt=CHG[S.chgLv||0].w;
  const effSolarW=Math.round(chgWatt*solCnt*tech.mult);
  const solarChargeRate=(sunOn&&S.solCap>0&&S.solBat<S.solCap)?((effSolarW*wm)/1000):0;
  const acWatt=(S.acChgLv>=0&&S.acChgOn)?CHG[S.acChgLv].w:0;
  const acChargeRate=(acWatt>0&&S.solCap>0&&S.solBat<S.solCap&&S.kwh>0)?(acWatt/1000):0;
  return {solarChargeRate,acChargeRate,chgWatt,effSolarW,acWatt,wm,sunOn,tech};
}

function gridStats(){
  const tier=GRID_TIER[S.grid.lv||0];
  const plnRate=P(1467);
  const rate=S.grid.rate||1000;
  const discPct=((plnRate-rate)/plnRate)*100;
  const pltsHouses=S.houses.filter(x=>x.plts);
  const h=Math.floor(S.T/60)%24;
  const tod=(h>=17&&h<23)?1.35:(h>=6&&h<17)?0.9:0.55;
  let estHourlyKwh=0,totalUsedKwh=0;
  pltsHouses.forEach(hs=>{
    estHourlyKwh+=(hs.baseKw+hs.varKw*.5)*tod;
    totalUsedKwh+=(hs.usedKwh||0);
  });
  const estBill=Math.round(totalUsedKwh*rate);
  return {tier,plnRate,rate,discPct,pltsHouses,estHourlyKwh,totalUsedKwh,estBill};
}

function ispStats(){
  const inf=ISP_INFRA[S.isp.infra||0];
  const lines=S.isp.lines||{};
  let totalUpMbps=0,totalUpCost=0,lineCount=0;
  ISP_UP.forEach(u=>{
    const cnt=lines[u.id]||0;
    if(cnt>0){
      lineCount+=cnt;
      totalUpMbps+=u.mbps*cnt;
      totalUpCost+=Py(u.cost,u.yr)*cnt;
    }
  });
  const pkg=ISP_PKG[S.isp.pkg||0]||ISP_PKG[0];
  const netHouses=S.houses.filter(x=>x.net);
  const bwUsed=netHouses.length*pkg.mbps*.25; // rasio sharing 1:4
  const congested=(totalUpMbps>0&&bwUsed>totalUpMbps);
  const rev=netHouses.length*Py(pkg.fee,pkg.yr);
  return {inf,totalUpMbps,totalUpCost,lineCount,pkg,netHouses,bwUsed,congested,rev};
}

function power(h){
  if(h%4===0)updateWeather();
  const st=solarStats();
  if(st.solarChargeRate>0&&S.solCap>0){
    S.solBat=Math.min(S.solCap,S.solBat+st.solarChargeRate);
  }
  if(st.acChargeRate>0&&S.solCap>0&&S.kwh>0){
    const room=S.solCap-S.solBat;
    const draw=Math.min(room,st.acChargeRate,S.kwh);
    S.kwh-=draw;S.solBat+=draw;
  }
  if(S.grid.on){
    const pltsHouses=S.houses.filter(x=>x.plts);
    const tod=(h>=17&&h<23)?1.35:(h>=6&&h<17)?0.9:0.55;
    pltsHouses.forEach(hs=>{
      const need=(hs.baseKw+Math.random()*hs.varKw)*tod;
      if(S.solBat>=need){
        S.solBat-=need;
        hs.usedKwh=(hs.usedKwh||0)+need;
      }else if(S.solBat>0){
        hs.usedKwh=(hs.usedKwh||0)+S.solBat;
        S.solBat=0;
        hs.outHrs=(hs.outHrs||0)+1;
      }else{
        hs.outHrs=(hs.outHrs||0)+1;
      }
    });
  }
}

function dayEnd(){
  const stdSal=P(1800000);
  S.emps.forEach(e=>{
    if(e.off>0){e.off--;return}
    if(e.sick>0){
      e.sick--;
      if(e.sick===0)log(e.n+' sudah sembuh dan kembali bertugas.');
      return;
    }
    const hrs=shiftHours(e);
    const over=Math.max(0,hrs-12);
    const salFactor=e.sal<stdSal*.8?1.45:e.sal>=stdSal*1.2?.75:1;
    e.burn=Math.min(100,e.burn+(2.6+over*.65)*salFactor);
    const sickChance=.0035+over*.0032+(e.burn>75?.012:e.burn>50?.004:0);
    if(Math.random()<sickChance){
      e.sick=1+Math.floor(Math.random()*2);
      log(e.n+' sakit ('+e.sick+' hari). Kamu harus turun tangan menggantikan!');
      snd('warn');
    }
  });

  const is=ispStats();
  if(is.inf.lv>0){
    if(is.totalUpMbps<=0){
      if(is.netHouses.length>0){
        const drop=is.netHouses[is.netHouses.length-1];
        drop.net=false;
        log(drop.n+' berhenti langganan Internet karena jalur bandwidth induk belum aktif.');
      }
    }else{
      if(S.isp.fault>0){
        if(empOnDuty()){
          S.isp.fault=0;log('Teknisi memperbaiki gangguan kabel/ODP Internet.');
        }else{
          S.isp.sat=Math.max(10,(S.isp.sat||85)-8);
        }
      }else if(Math.random()<.035&&is.netHouses.length>0){
        S.isp.fault=1;
        log('Gangguan ODP/kabel Fiber terdeteksi! Perbaiki di tab Internet.');
        snd('warn');
      }
      if(is.congested){
        S.isp.sat=Math.max(10,(S.isp.sat||85)-6);
        if(is.netHouses.length>0&&Math.random()<.35){
          const drop=is.netHouses[is.netHouses.length-1];
          drop.net=false;
          log(drop.n+' putus langganan Internet karena jaringan lemot/overload.');
        }
      }else if(S.isp.fault===0){
        S.isp.sat=Math.min(100,(S.isp.sat||85)+2);
        const maxAdd=S.bC?3:1;
        if(is.netHouses.length<is.inf.max&&S.isp.sat>=50&&Math.random()<(S.bC?.85:.55)){
          for(let k=0;k<maxAdd&&S.houses.filter(x=>x.net).length<is.inf.max;k++){
            const existing=S.houses.find(x=>!x.net);
            if(existing){existing.net=true;log(existing.n+' menambah layanan Internet Fiber!')}
            else{const nh=makeHouse(S.houses.length,true,false);S.houses.push(nh);log('Pelanggan baru Internet: '+nh.n+' bergabung!')}
          }
        }
      }
    }
  }

  const gs=gridStats();
  if(gs.tier.lv>0&&S.grid.on){
    const totalOut=gs.pltsHouses.reduce((a,x)=>a+(x.outHrs||0),0);
    if(totalOut>0){
      S.grid.sat=Math.max(10,(S.grid.sat||85)-Math.min(15,Math.ceil(totalOut/2)));
      gs.pltsHouses.forEach(x=>x.outHrs=0);
      if(S.grid.sat<35&&gs.pltsHouses.length>0&&Math.random()<.45){
        const drop=gs.pltsHouses[gs.pltsHouses.length-1];
        drop.plts=false;
        log(drop.n+' berhenti langganan listrik surya karena baterai sering kosong.');
      }
    }else if(gs.discPct>=10){
      S.grid.sat=Math.min(100,(S.grid.sat||85)+2);
    }
    if(gs.discPct<0){
      S.grid.sat=Math.max(5,(S.grid.sat||85)-10);
      if(gs.pltsHouses.length>0&&Math.random()<.5){
        const drop=gs.pltsHouses[gs.pltsHouses.length-1];
        drop.plts=false;
        log(drop.n+' berhenti langganan listrik karena tarifmu lebih mahal dari PLN!');
      }
    }else if(gs.pltsHouses.length<gs.tier.max&&gs.discPct>=15&&S.solBat>=.5){
      const chance=Math.min(.85,(S.bC?.5:.2)+(gs.discPct/100));
      if(Math.random()<chance){
        const existing=S.houses.find(x=>!x.plts);
        if(existing){existing.plts=true;log(existing.n+' ikut berlangganan Listrik PLTS!')}
        else{const nh=makeHouse(S.houses.length,false,true);S.houses.push(nh);log('Pelanggan baru Listrik PLTS: '+nh.n+' ['+nh.t+'] bergabung!')}
      }
    }
  }

  S.houses=S.houses.filter(x=>x.net||x.plts);
}

function monthEnd(){
  let inc=0;
  const pay=n=>{if(n>0)spend(n)};
  const dt=curDate(),prev=new Date(dt.getFullYear(),dt.getMonth()-1,1);
  const a=age();

  if(a>=18)pay(P(1800000));
  const totalGaji=S.emps.reduce((z,e)=>z+e.sal,0);
  pay(totalGaji);

  if(S.ln){
    if(have()>=S.ln.pay)pay(S.ln.pay);
    else{spend(Math.round(S.ln.pay*1.02));log('Cicilan bank telat, kena denda 2%.')}
    if(--S.ln.left<=0)S.ln=null;
  }

  const is=ispStats();
  if(is.totalUpCost>0)pay(is.totalUpCost);
  const netRev=Math.round(is.rev*mult());
  if(netRev>0&&is.totalUpMbps>0){
    S.b+=netRev;inc+=netRev;
    log('Tagihan Internet ('+is.netHouses.length+' rumah) masuk: '+fmt(netRev)+'.');
  }

  const gs=gridStats();
  const pltsRev=Math.round(gs.estBill*mult());
  if(pltsRev>0){
    S.b+=pltsRev;inc+=pltsRev;
    log('Tagihan Listrik PLTS ('+gs.pltsHouses.length+' rumah, '+gs.totalUsedKwh.toFixed(1)+' kWh) masuk: '+fmt(pltsRev)+'.');
  }
  S.houses.forEach(hs=>hs.usedKwh=0);

  if(S.b>0){const i=Math.round(S.b*.0033);S.b+=i;inc+=i}
  if(S.dep.length){
    let depInt=0;
    S.dep.forEach(d=>{
      const r=depRate(d.mo);
      depInt+=Math.round(d.amt*r);
      d.mo++;
    });
    if(depInt>0){S.b+=depInt;inc+=depInt;log('Bunga deposito masuk '+fmt(depInt)+'.')}
  }

  const omzet=netRev+pltsRev;
  const tx=taxInfo(omzet);
  if(tx.amt>0){pay(tx.amt);log('Bayar pajak ('+tx.lbl+'): '+fmt(tx.amt)+'.')}
  S.yrInc=(S.yrInc||0)+omzet;
  if(dt.getMonth()===0)S.yrInc=0;

  (S.rec=S.rec||[]).push({y:prev.getFullYear(),m:prev.getMonth(),net:netRev,plts:pltsRev,o:inc-omzet,x:S.exp});
  log('Rekap '+BLN[prev.getMonth()]+' '+prev.getFullYear()+': Masuk '+fmt(inc)+', Keluar '+fmt(S.exp)+'.');
  snd('month');S.inc=0;S.exp=0;save();
}

function step(){
  S.T++;
  const h=Math.floor(S.T/60)%24,mi=S.T%60;
  if(S.T%1440===0&&day()>0){
    dayEnd();
    if(curDate().getDate()===1)monthEnd();
  }
  const onD=empOnDuty();
  const hasActiveOps=(S.isp.infra>0||S.grid.lv>0);
  if(hasActiveOps&&!onD&&!inSchool())S.stam-=drain()/60;
  else if(onD)S.stam=Math.min(100,S.stam+(inSchool()?0:4/60));
  else S.stam=Math.min(100,S.stam+10/60);

  if(S.stam<=0){
    S.stam=0;S.faint=true;
    if(!onD){snd('warn');log('Kamu kecapekan! Kepuasan pelanggan turun jika tidak ada teknisi jaga.')}
  }
  if(S.faint&&S.stam>=40){S.faint=false;log('Stamina kembali pulih.')}
  if(mi===0)power(h);
}

const A={
  pause(){S.pause=!S.pause},
  spd(i){S.spd=+i},
  tab(i){S.tab=i;subTab='';subPage=0},
  stab(i){subTab=i;subPage=0},
  spg(d){subPage=Math.max(0,subPage+(+d))},
  cpg(d){cardPage=Math.max(0,cardPage+(+d))},
  cof(){
    if(S.T-S.cf<60||S.stam>=100)return log('Belum butuh ngopi lagi.');
    if(!buy(15000))return;
    S.stam=Math.min(100,S.stam+35);S.cf=S.T;log('Ngopi dulu, stamina +35.');
  },
  bI(){S.bI=S.bI?0:1},
  bC(){S.bC=S.bC?0:1},
  mute(){S.mute=!S.mute;if(!S.mute)snd('coin')},

  // Internet
  ispinf(){
    const nl=(S.isp.infra||0)+1;if(nl>=ISP_INFRA.length)return;
    const inf=ISP_INFRA[nl];
    if(inf.yr>curYear())return log(inf.n+' baru tersedia tahun '+inf.yr+'.');
    if(!buy(Py(inf.p,inf.yr)))return;
    S.isp.infra=nl;
    if(Object.keys(S.isp.lines).length===0)S.isp.lines[1]=1;
    log('Pasang infrastruktur: '+inf.n+' (maks '+inf.max+' rumah).');
  },
  ispline(v){
    const[id,d]=v.split(':'),uid=+id,delta=+d;
    const u=ISP_UP.find(x=>x.id===uid);if(!u||u.yr>curYear())return;
    const cur=S.isp.lines[uid]||0;
    const next=Math.max(0,cur+delta);
    if(next===0)delete S.isp.lines[uid];
    else S.isp.lines[uid]=next;
    log((delta>0?'Tambah':'Kurangi')+' jalur '+u.n+' (aktif: '+next+' jalur).');
  },
  isppkg(id){
    const pk=ISP_PKG[+id];if(!pk||pk.yr>curYear())return;
    S.isp.pkg=+id;log('Paket internet warga diubah ke '+pk.n+'.');
  },
  ispfix(){
    if(!S.isp.fault)return;
    if(!buy(P(200000)))return;
    S.isp.fault=0;log('Gangguan ODP/kabel Fiber selesai diperbaiki.');
  },

  // Listrik & PLTS
  tok(n){if(buy(P(n*1467)+2500))S.kwh+=+n},
  sol(q){
    const qty=Math.max(1,+q||1);
    if(buy(25e6*qty)){
      for(let i=0;i<qty;i++)S.solList.push({day:day()});
      if(S.solCap===0)S.solCap=5*qty;
      log('Pasang +'+qty+' Panel Surya (total '+S.solList.length+' unit).');
    }
  },
  sellsol(q){
    const cnt=S.solList.length;if(!cnt)return;
    const qty=q==='all'?cnt:Math.min(cnt,Math.max(1,+q||1));
    let tot=0;
    for(let i=0;i<qty;i++)tot+=solSellVal(S.solList.shift());
    S.m+=tot;snd('coin');
    log('Jual second '+qty+' panel surya dapat '+fmt(tot)+'.');
  },
  upsoltech(){
    const nl=(S.solTech||0)+1;if(nl>=SOL_TECH.length)return;
    const st=SOL_TECH[nl];
    if(st.yr>curYear())return log(st.n+' baru tersedia tahun '+st.yr+'.');
    if(!buy(Py(st.p,st.yr)))return;
    S.solTech=nl;
    log('Riset Daya Serap Panel Surya berhasil: '+st.n+' ('+st.mult+'x)!');
  },
  upchg(){
    const nl=(S.chgLv||0)+1;if(nl>=CHG.length)return;
    const ch=CHG[nl];
    if(ch.yr>curYear())return log(ch.n+' baru rilis tahun '+ch.yr+'.');
    if(!buy(Py(ch.p,ch.yr)))return;
    S.chgLv=nl;log('Upgrade Teknologi Charging ke '+ch.n+' ('+fmtW(ch.w)+'/panel)!');
  },
  upac(){
    const nl=(S.acChgLv??-1)+1;if(nl>=CHG.length)return;
    const ch=CHG[nl];
    if(ch.yr>curYear())return log('Charger Listrik '+fmtW(ch.w)+' baru rilis tahun '+ch.yr+'.');
    const price=nl===0?350000:Py(ch.p,ch.yr);
    if(!buy(price))return;
    S.acChgLv=nl;S.acChgOn=true;
    log((nl===0?'Beli':'Upgrade')+' Charger Listrik AC '+fmtW(ch.w)+'!');
  },
  togac(){if(S.acChgLv>=0)S.acChgOn=!S.acChgOn},
  bat(k){
    const map={5:4.5e6,10:8.5e6,25:19e6,50:35e6},add=+k;
    if(buy(P(map[k]))){
      S.solCap+=add;
      log('Upgrade kapasitas baterai +'+add+' kWh (total '+S.solCap+' kWh).');
    }
  },
  gridup(){
    const nl=(S.grid.lv||0)+1;if(nl>=GRID_TIER.length)return;
    const gt=GRID_TIER[nl];
    if(gt.yr>curYear())return log(gt.n+' baru tersedia tahun '+gt.yr+'.');
    if(!buy(Py(gt.p,gt.yr)))return;
    S.grid.lv=nl;
    if(nl===1){
      S.grid.on=true;
      S.grid.rate=Math.round(P(1467)*.7/10)*10;
      const existing=S.houses.find(x=>!x.plts);
      if(existing)existing.plts=true;
      else S.houses.push(makeHouse(S.houses.length,false,true));
      log('Jaringan listrik warga aktif! Rumah pertama mulai berlangganan pascabayar.');
    }else{
      log('Upgrade jaringan PLTS warga ke '+gt.n+' (maks '+gt.max+' rumah).');
    }
  },
  toggrid(){
    if((S.grid.lv||0)<=0)return log('Pasang kabel distribusi tetangga dulu.');
    S.grid.on=!S.grid.on;
    log('Penyaluran listrik baterai ke warga: '+(S.grid.on?'ON (Mengalir)':'OFF'));
  },
  gridrate(d){S.grid.rate=Math.max(100,(S.grid.rate||1000)+(+d))},
  gridpreset(pct){
    const pln=P(1467);
    S.grid.rate=Math.max(100,Math.round(pln*(1-(+pct)/100)/10)*10);
  },

  // Teknisi / Karyawan
  hi(){
    const id=S.empSeq++,n=EMPNM[(id-1)%EMPNM.length]+' #'+id;
    const st=S.emps.length%2===0?8:20,en=(st+12)%24;
    S.emps.push({id,n,start:st,end:en,sal:P(1800000),burn:0,sick:0,off:0,offMo:-1});
    log('Rekrut teknisi '+n+' (shift '+String(st).padStart(2,'0')+':00–'+String(en).padStart(2,'0')+':00).');
  },
  fi(id){S.emps=S.emps.filter(e=>e.id!==+id)},
  es(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.start=(e.start+(+d)+24)%24},
  ee(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.end=(e.end+(+d)+24)%24},
  esal(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.sal=Math.max(500000,e.sal+(+d))},
  eoff(id){
    const e=S.emps.find(x=>x.id===+id);if(!e)return;
    const cm=(curYear()-START_YEAR)*12+curDate().getMonth();
    if(e.offMo===cm)return log(e.n+' sudah dapat jatah libur bulan ini.');
    if(e.sick>0)return log(e.n+' sedang sakit.');
    e.off=1;e.burn=0;e.offMo=cm;
    log(e.n+' diberi libur 1 hari! Tingkat jenuhnya pulih 100% (0%).');
  },

  // Bank
  dep(n){const t=Math.min(+n,S.m);S.m-=t;S.b+=t},
  wd(n){const t=Math.min(+n,Math.max(S.b,0));S.b-=t;S.m+=t},
  mkdep(n){
    n=+n;if(S.b<n)return log('Saldo rekening kurang untuk deposito '+fmt(n)+'.');
    S.b-=n;S.dep.push({id:Date.now()+Math.random(),amt:n,mo:0});
    log('Buka deposito '+fmt(n)+' (bunga awal 0,5%/bln, naik +0,1% tiap bulan).');snd('buy');
  },
  cldep(idx){
    const d=S.dep[+idx];if(!d)return;
    S.b+=d.amt;S.dep.splice(+idx,1);snd('coin');
    log('Cairkan deposito '+fmt(d.amt)+' ke rekening.');
  },
  ln(n){
    if(age()<21)return log('Pinjaman bank butuh usia minimal 21 tahun.');
    if(S.ln)return log('Masih ada cicilan berjalan.');
    n=+n;const r=.15/12;S.ln={pay:Math.round(n*r/(1-Math.pow(1+r,-12))),left:12};S.b+=n;log('Pinjaman cair '+fmt(n)+'.');
  },

  hv(i){S.hv=i;subPage=0},
  rst(){if(!rc){rc=1;return}rc=0;cardPage=0;subTab='';subPage=0;fresh();save()}
};

document.addEventListener('pointerup',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a!=='rst')rc=0;
  A[b.dataset.a](b.dataset.i);snd('click');render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.grate)S.grid.rate=Math.max(50,Math.round(+e.target.value||0));
});

const R=(l,s,a,i,b,x)=>`<div class="row"><span>${l}<br><span class="lg">${s}</span></span>${a?`<button data-a="${a}" data-i="${i}" class="sm" ${x?'disabled':''}>${b}</button>`:''}</div>`;
const B=(a,i,t,x,cl='')=>`<button data-a="${a}" data-i="${i}" class="${cl}" ${x?'disabled':''}>${t}</button>`;
const wxIcon=()=>S.wx==='cerah'?'☀️ Cerah':S.wx==='mendung'?'⛅ Mendung':'🌧️ Hujan';
const padH=n=>String(n).padStart(2,'0')+':00';

function paginate(items,perPage){
  const maxP=Math.max(0,Math.ceil(items.length/perPage)-1);
  if(subPage>maxP)subPage=maxP;
  const slice=items.slice(subPage*perPage,(subPage+1)*perPage);
  const nav=maxP>0?`<div class="pgnav" style="justify-content:flex-end;margin-top:4px">${B('spg',-1,'◀',subPage<=0,'sm')}<span>Hal ${subPage+1}/${maxP+1}</span>${B('spg',1,'▶',subPage>=maxP,'sm')}</div>`:'';
  return {slice,nav};
}

function side(){
  const t=S.tab,yr=curYear();let h='';

  if(t==='net'){
    const is=ispStats(),nxtInf=ISP_INFRA[(S.isp.infra||0)+1];
    const st=subTab||'bw';
    const tabs=`<div class="subtabs">${[['bw','Bandwidth Induk ('+is.lineCount+' jalur)'],['pkg','Paket Internet Warga'],['inf','Infrastruktur OLT/ODP']].map(x=>B('stab',x[0],x[1],0,'sm '+(st===x[0]?'on':''))).join('')}</div>`;
    const box=`<div class="box">
      <div class="r"><b>${is.inf.n}</b><span class="chip" style="color:${S.isp.fault?'var(--bad)':'var(--ok)'}">${S.isp.fault?'GANGGUAN':is.inf.lv?'AKTIF':'BELUM BUKA'}</span></div>
      <div class="lg">Pelanggan Internet: <b>${is.netHouses.length}/${is.inf.max} rumah</b> · Kepuasan: <b>${S.isp.sat||85}%</b> · Biaya Induk: <b>${fmt(is.totalUpCost)}/bln</b></div>
      <div class="lg">Bandwidth terpakai: <b>${is.bwUsed.toFixed(1)} / ${fmtBw(is.totalUpMbps)}</b>${is.congested?' <b style="color:var(--bad)">⚠️ OVERLOAD / LEMOT!</b>':''} · Tagihan: <b style="color:var(--ok)">${fmt(is.rev*mult())}/bln</b></div>
    </div>`;
    let rows=[];
    if(S.isp.fault)rows.push(R('Gangguan Jaringan Fiber/ODP!','pelanggan komplain (teknisi jaga otomatis perbaiki)','ispfix','','Perbaiki '+fmt(P(200000))));
    if(st==='bw'){
      rows=rows.concat(ISP_UP.filter(u=>u.yr<=yr).map(u=>{
        const cnt=S.isp.lines[u.id]||0,cost=Py(u.cost,u.yr);
        return `<div class="row"><span>${u.n} ${cnt?`<span class="chip" style="color:var(--ac)">${cnt}x</span>`:''}<br><span class="lg">+${fmtBw(u.mbps)} · biaya ${fmt(cost)}/bln/jalur</span></span><span>${cnt>0?B('ispline',u.id+':-1','-1',0,'sm bad')+' ':''}${B('ispline',u.id+':1','+1 Jalur',0,'sm')}</span></div>`;
      }));
    }else if(st==='pkg'){
      rows=rows.concat(ISP_PKG.filter(pk=>pk.yr<=yr).map(pk=>{
        const fee=Py(pk.fee,pk.yr),needPerHouse=(pk.mbps*.25).toFixed(2);
        return R(pk.n,'iuran '+fmt(fee)+'/rmh/bln · sedot induk ~'+needPerHouse+' Mbps/rmh · rilis '+pk.yr,'isppkg',pk.id,S.isp.pkg===pk.id?'Aktif':'Terapkan',S.isp.pkg===pk.id);
      }));
    }else{
      rows.push(nxtInf
        ?R('Upgrade: '+nxtInf.n,'kapasitas maksimal '+nxtInf.max+' rumah · rilis '+nxtInf.yr,'ispinf','',nxtInf.yr<=yr?fmt(Py(nxtInf.p,nxtInf.yr)):'Rilis '+nxtInf.yr,nxtInf.yr>yr)
        :R('Infrastruktur Fiber Maksimal','kapasitas hingga 400 rumah tercapai',0));
    }
    const pg=paginate(rows,4);
    h=`<div>${box}${tabs}${pg.slice.join('')}</div>${pg.nav}`;
  }

  if(t==='plts'){
    const st=subTab||'sol';
    const wm=S.wx==='cerah'?'100%':S.wx==='mendung'?'45%':'18%';
    const ss=solarStats(),gs=gridStats();
    const curTech=SOL_TECH[S.solTech||0],nxtTech=SOL_TECH[(S.solTech||0)+1];
    const curChg=CHG[S.chgLv||0],nxtChg=CHG[(S.chgLv||0)+1];
    const curAc=S.acChgLv>=0?CHG[S.acChgLv]:null,nxtAc=CHG[(S.acChgLv??-1)+1];
    const nxtGrid=GRID_TIER[(S.grid.lv||0)+1];
    const chgSt=S.solCap<=0?'Belum ada baterai':ss.solarChargeRate>0?`<b style="color:var(--ok)">☀️ +${Math.round(ss.solarChargeRate*1000)} Wh/j</b>`:ss.acChargeRate>0?`<b style="color:var(--wr)">🔌 +${Math.round(ss.acChargeRate*1000)} Wh/j</b>`:'Siaga';
    const tabs=`<div class="subtabs">${[['sol','Panel & Daya Serap'],['chg','Charging & Baterai'],['wrg','Jual ke Warga ('+gs.pltsHouses.length+'/'+gs.tier.max+')']].map(x=>B('stab',x[0],x[1],0,'sm '+(st===x[0]?'on':''))).join('')}</div>`;
    const box=`<div class="box"><div class="lg">Baterai: <b>${fmtBat(S.solBat)} / ${S.solCap} kWh</b> · ${chgSt} (${wxIcon()} ${wm}) · Token PLN: <b>${S.kwh.toFixed(1)} kWh</b></div></div>`;

    if(st==='sol'){
      const cnt=S.solList.length,avgMo=solAvgAgeMo(),oneVal=cnt?solSellVal(S.solList[0]):0;
      h=`<div>${box}${tabs}`
        +`<div class="row"><span>Panel Surya Terpasang: <b>${cnt} unit</b><br><span class="lg">rata-rata usia ${avgMo} bln · daya cas total ${fmtW(ss.effSolarW)} saat cerah</span></span><span>${B('sol',1,'+1 ('+fmt(25e6)+')',0,'sm')} ${B('sol',5,'+5 ('+fmt(125e6)+')',0,'sm')}</span></div>`
        +(cnt?`<div class="row"><span>Jual Second Panel Surya<br><span class="lg">nilai susut usia · unit tertua ${fmt(oneVal)}/unit</span></span><span>${B('sellsol',1,'Jual 1 ('+fmt(oneVal)+')',0,'sm bad')} ${cnt>=5?B('sellsol',5,'Jual 5',0,'sm bad'):''} ${cnt>1?B('sellsol','all','Jual Semua',0,'sm bad'):''}</span></div>`:'')
        +`<div class="subh">Riset Teknologi Daya Serap Panel Surya</div>`
        +R('Teknologi Aktif: '+curTech.n,'pengali daya serap matahari: '+curTech.mult+'x',0)
        +(nxtTech
          ?R('Riset: '+nxtTech.n,'daya serap & isi baterai naik jadi '+nxtTech.mult+'x · rilis '+nxtTech.yr,'upsoltech','',nxtTech.yr<=yr?fmt(Py(nxtTech.p,nxtTech.yr)):'Rilis '+nxtTech.yr,nxtTech.yr>yr)
          :R('Teknologi Sel Surya Maksimal','efisiensi tertinggi 11x tercapai',0))
        +`</div>`;
    }else if(st==='chg'){
      h=`<div>${box}${tabs}`
        +`<div class="subh">Pengembangan Teknologi Charging</div>`
        +(nxtChg
          ?R('Charger Surya: '+curChg.n,'upgrade ke '+nxtChg.n+' ('+fmtW(nxtChg.w)+'/panel x '+curTech.mult+'x)','upchg','',nxtChg.yr<=yr?fmt(Py(nxtChg.p,nxtChg.yr)):'Rilis '+nxtChg.yr,nxtChg.yr>yr)
          :R('Charger Surya: '+curChg.n,'Kecepatan charging maksimal tercapai',0))
        +`<div class="subh">Kapasitas Baterai Penyimpanan</div>`
        +`<div class="row"><span>Kapasitas saat ini: <b>${S.solCap} kWh</b></span><span>${[[5,4.5e6],[10,8.5e6],[25,19e6],[50,35e6]].map(([k,pr])=>B('bat',k,'+'+k+'kWh ('+fmt(P(pr))+')',0,'sm')).join(' ')}</span></div>`
        +`<div class="subh">Charger Listrik AC Terpisah (Pakai Token PLN)</div>`
        +(curAc
          ?`<div class="row"><span>Charger AC ${fmtW(curAc.w)} (${S.acChgOn?'ON':'OFF'}) · Token ${S.kwh.toFixed(0)} kWh<br><span class="lg">isi baterai dari token PLN ${fmtW(curAc.w)}/jam</span></span><span>${B('togac','',S.acChgOn?'Matikan':'Nyalakan',0,'sm')} ${nxtAc&&nxtAc.yr<=yr?B('upac','','Up '+fmtW(nxtAc.w)+' ('+fmt(Py(nxtAc.p,nxtAc.yr))+')',0,'sm'):''} ${B('tok',100,'+100 kWh Token',0,'sm')}</span></div>`
          :R('Beli Charger Listrik AC 18W','charger terpisah untuk isi baterai dari token PLN','upac','',fmt(350000)))
        +`</div>`;
    }else{
      const pctColor=gs.discPct>=20?'var(--ok)':gs.discPct>=0?'var(--wr)':'var(--bad)';
      const pctText=gs.discPct>0?`${gs.discPct.toFixed(1)}% lebih murah dari PLN`:gs.discPct===0?'Sama dengan PLN':`${Math.abs(gs.discPct).toFixed(1)}% lebih mahal dari PLN`;
      h=`<div>${box}${tabs}`
        +`<div class="box">
          <div class="r"><b>${gs.tier.n}</b><span class="chip" style="color:${S.grid.on?'var(--ok)':'var(--mt)'}">${S.grid.on?'MENGALIR':'OFF'}</span>${B('toggrid','',S.grid.on?'Matikan':'Salurkan',gs.tier.lv<=0,'sm '+(S.grid.on?'on':''))}</div>
          <div class="lg">Rumah: <b>${gs.pltsHouses.length}/${gs.tier.max}</b> · Kepuasan: <b>${S.grid.sat||85}%</b> · Sedot: <b>~${gs.estHourlyKwh.toFixed(2)} kWh/j</b> · Tagihan: <b style="color:var(--ok)">${fmt(gs.estBill*mult())}</b></div>
          <div class="row"><span>Tarif: <b>${fmt(gs.rate)}/kWh</b> (<b style="color:${pctColor}">${pctText}</b>)</span><span>${B('gridrate',-50,'-50',0,'sm')} <input type="number" data-grate="1" value="${gs.rate}" style="width:66px"> ${B('gridrate',50,'+50',0,'sm')} ${[30,25].map(pc=>B('gridpreset',pc,'-'+pc+'%',0,'sm')).join(' ')}</span></div>
        </div>`
        +(nxtGrid
          ?R('Upgrade Jaringan: '+nxtGrid.n,'maks '+nxtGrid.max+' rumah · rilis '+nxtGrid.yr,'gridup','',nxtGrid.yr<=yr?fmt(Py(nxtGrid.p,nxtGrid.yr)):'Rilis '+nxtGrid.yr,nxtGrid.yr>yr)
          :R('Jaringan PLTS Warga Maksimal','kapasitas 100 rumah tercapai',0))
        +`</div>`;
    }
  }

  if(t==='pg'){
    const cm=(curYear()-START_YEAR)*12+curDate().getMonth(),stdSal=P(1800000);
    const eCards=S.emps.map(e=>{
      const hrs=shiftHours(e),st=e.sick>0?`<b style="color:var(--bad)">SAKIT (${e.sick}h) - Kamu ganti!</b>`:e.off>0?'<b style="color:var(--ok)">LIBUR</b>':empWorkingNow(e)?'<b style="color:var(--ok)">Sedang jaga</b>':'Off shift';
      const usedOff=e.offMo===cm;
      return `<div class="box">
        <div class="r"><b>${e.n}</b><span class="lg">${st} · Jenuh ${Math.round(e.burn)}% · ${padH(e.start)}–${padH(e.end)} (${hrs}j${hrs>12?' ⚠️':''})</span>${B('fi',e.id,'Pecat',0,'sm bad')}</div>
        <div class="row"><span class="lg">Shift:</span><span>${B('es',e.id+':-1','-Msk',0,'sm')} ${B('es',e.id+':1','+Msk',0,'sm')} ${B('ee',e.id+':-1','-Plg',0,'sm')} ${B('ee',e.id+':1','+Plg',0,'sm')}</span><span class="lg">Gaji ${fmt(e.sal)}</span><span>${B('esal',e.id+':-100000','-100rb',0,'sm')} ${B('esal',e.id+':100000','+100rb',0,'sm')} ${B('eoff',e.id,usedOff?'Sudah Libur':'Libur (0%)',usedOff||e.sick>0,'sm')}</span></div>
      </div>`;
    });
    const pg=paginate(eCards,3);
    h=`<div><div class="row"><span>Teknisi Lapangan: <b>${S.emps.length}</b> (normal 12j · standar ${fmt(stdSal)}/bln)</span>${B('hi','','+ Rekrut Teknisi',0,'sm')}</div>`
      +(pg.slice.length?pg.slice.join(''):'<div class="lg">Belum ada teknisi. Rekrut agar gangguan jaringan otomatis ditangani & staminamu hemat.</div>')
      +`</div>${pg.nav}`;
  }

  if(t==='bk'){
    const st=subTab||'dp';
    const tabs=`<div class="subtabs">${[['dp','Tabungan & Deposito'],['ln','Pinjaman Bank']].map(x=>B('stab',x[0],x[1],0,'sm '+(st===x[0]?'on':''))).join('')}</div>`;
    if(st==='dp'){
      const dRows=S.dep.map((d,idx)=>R('Deposito '+fmt(d.amt),'umur '+d.mo+' bln · bunga '+(depRate(d.mo)*100).toFixed(1)+'% ('+fmt(d.amt*depRate(d.mo))+'/bln)','cldep',idx,'Cairkan'));
      const pg=paginate(dRows,3);
      h=`<div>${tabs}<div class="r"><b>${fmt(S.b)}</b><span class="lg">saldo m-Banking (bunga 4%/thn)</span>${B('dep',5000000,'Setor 5jt',0,'sm')}${B('wd',5000000,'Tarik 5jt',0,'sm')}</div>`
        +`<div class="row"><span>Buka Deposito (bunga naik +0,1%/bln)</span><span>${[10e6,25e6,50e6,100e6].map(n=>B('mkdep',n,fmt(n),S.b<n,'sm')).join(' ')}</span></div>`
        +(pg.slice.length?pg.slice.join(''):'<div class="lg">Belum ada deposito aktif.</div>')
        +`</div>${pg.nav}`;
    }else{
      h=`<div>${tabs}`
        +(S.ln?R('Cicilan bank berjalan',fmt(S.ln.pay)+'/bln · sisa '+S.ln.left+' bln'):'')
        +[25e6,50e6,100e6,250e6].map(n=>R('Pinjaman '+fmt(n),'bunga 15%/thn, 12 bulan, usia min. 21','ln',n,'Ajukan',!!S.ln||age()<21)).join('')
        +`</div>`;
    }
  }

  if(t==='kl'){
    const dt=curDate(),y=dt.getFullYear(),m=dt.getMonth(),td=dt.getDate();
    const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    let cells=HARI.map(x=>`<div class="ch">${x}</div>`).join('')+'<div></div>'.repeat(first);
    const list=[];
    for(let d=1;d<=days;d++){
      const hn=holName(y,m,d),dow=(first+d-1)%7,red=(dow===0||!!hn);
      if(hn)list.push(d+' '+BLN[m]+': '+hn);
      cells+=`<div class="${red?'hol':''} ${d===td?'tod':''}">${d}</div>`;
    }
    const se=schoolEnd();
    h=`<div><div class="r"><b>${BLN[m]} ${y}</b><span class="lg">${age()<18?(se?'Sekolah hari ini: 07:00–'+se+':00':'Hari ini libur sekolah!'):'Sudah lulus sekolah'}</span></div>`
      +`<div class="cal">${cells}</div>`
      +`<div class="lg"><b>Libur Nasional:</b> ${list.length?list.join(' · '):'Tidak ada selain hari Minggu.'}</div></div>`;
  }

  if(t==='rh'){
    const v=S.hv||'b',rec=S.rec||[],is=ispStats(),gs=gridStats();
    const cur={y:curYear(),m:curDate().getMonth(),net:Math.round(is.rev*mult()),plts:Math.round(gs.estBill*mult()),o:0,x:S.exp};
    const sum=a=>a.reduce((z,r)=>({net:z.net+r.net,plts:z.plts+r.plts,o:z.o+r.o,x:z.x+r.x}),{net:0,plts:0,o:0,x:0});
    const row=(l,r)=>{
      const profit=r.net+r.plts+r.o-r.x;
      return `<div class="row"><span>${l}<br><span class="lg">Internet ${fmt(r.net)} · PLTS ${fmt(r.plts)} · Bunga ${fmt(r.o)} · Keluar ${fmt(r.x)}</span></span><b style="color:${profit<0?'var(--bad)':'var(--ok)'}">${fmt(profit)}</b></div>`;
    };
    let rows=[];
    if(v==='b')rows=[row('Bulan berjalan (estimasi)',cur)].concat(rec.slice().reverse().map(r=>row(BLN[r.m]+' '+r.y,r)));
    if(v==='t'){const ys={},yc=curYear();rec.forEach(r=>(ys[r.y]=ys[r.y]||[]).push(r));if(!ys[yc])ys[yc]=[];rows=Object.keys(ys).sort().reverse().map(y=>row('Tahun '+y+(+y===yc?' (berjalan)':''),sum(ys[y].concat(+y===yc?[cur]:[]))))}
    const pg=paginate(rows,5);
    h=`<div><div class="subtabs">${[['b','Bulanan'],['t','Tahunan']].map(x=>B('hv',x[0],x[1],0,'sm '+(v===x[0]?'on':''))).join('')}</div>${pg.slice.join('')}</div>${pg.nav}`;
  }

  if(t==='lg'){
    h=`<div>${S.log.slice(0,11).map(l=>`<div class="lg" style="padding:3px 0;border-bottom:1px dashed var(--bd)">${l}</div>`).join('')}</div><div style="margin-top:6px"><button data-a="rst" class="sm bad">${rc?'Yakin? Tap lagi':'Mulai ulang game'}</button></div>`;
  }
  return h;
}

function render(){
  const dt=curDate(),yr=curYear(),hn=holName(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const is=ispStats(),gs=gridStats(),ss=solarStats(),sk=sickEmps().length;
  const estOmzet=Math.round((is.rev+gs.estBill)*mult());
  const tx=taxInfo(estOmzet);
  const st=S.faint?['KECAPEKAN','var(--bad)']:inSchool()&&!empOnDuty()?['SEKOLAH (s/d '+schoolEnd()+':00)','var(--wr)']:['OPERASIONAL','var(--ok)'];
  const chgTag=S.solCap>0&&S.solBat<S.solCap?(ss.solarChargeRate>0?' ⚡'+fmtW(ss.effSolarW):ss.acChargeRate>0?' 🔌'+fmtW(ss.acWatt):''):'';

  put($('#hd'),
    `<div class="r"><b>${fmt(S.m)}</b><span class="lg">rek ${fmt(S.b)}</span><span>${HARI[dt.getDay()]}, ${dt.getDate()} ${BLN[dt.getMonth()]} ${yr}, ${clock()}</span><span>Usia ${age()}</span><span class="chip" style="color:${st[1]}">${st[0]}</span>${hn?`<span class="chip" style="color:var(--bad)">Libur: ${hn}</span>`:''}${sk?`<span class="chip" style="color:var(--wr)">${sk} Teknisi Sakit</span>`:''}${S.isp.fault?`<span class="chip" style="color:var(--bad)">ISP Gangguan</span>`:''}</div>`
    +`<div class="r lg"><span>Internet: <b>${is.netHouses.length}/${is.inf.max}</b> rmh (${is.bwUsed.toFixed(1)}/${fmtBw(is.totalUpMbps)})</span><span>PLTS: <b>${gs.pltsHouses.length}/${gs.tier.max}</b> rmh</span><span>Baterai: <b>${fmtBat(S.solBat)}/${S.solCap}kWh</b>${chgTag}</span><span>${wxIcon()}</span><span>Pajak: <b>${fmt(tx.amt)}</b> (${tx.lbl})</span><span>x${fx().toFixed(2)}</span></div>`
    +`<div class="bar"><i style="width:${S.stam}%;background:${S.stam<25?'var(--bad)':'var(--ac)'}"></i></div>`
  );

  put($('#ctl'),
    `<button data-a="pause" class="sm ${S.pause?'on':''}">${S.pause?'Lanjut':'Jeda'}</button>`
    +[1,4,8,16,64].map(x=>`<button data-a="spd" data-i="${x}" class="sm ${S.spd===x?'on':''}">${x}x</button>`).join('')
    +`<button data-a="cof" class="sm">Ngopi +35</button>`
    +`<button data-a="bI" class="sm ${S.bI?'on':''}">Cuan x2</button>`
    +`<button data-a="bC" class="sm ${S.bC?'on':''}">Ramai x2</button>`
    +`<button data-a="mute" class="sm">${S.mute?'Suara: Off':'Suara: On'}</button>`
  );

  const perCard=9,maxCP=Math.max(0,Math.ceil(S.houses.length/perCard)-1);
  if(cardPage>maxCP)cardPage=maxCP;
  put($('#stpg'),maxCP>0?`${B('cpg',-1,'◀',cardPage<=0,'sm')}<span>${cardPage+1}/${maxCP+1}</span>${B('cpg',1,'▶',cardPage>=maxCP,'sm')}`:`<span class="lg">${S.houses.length} pelanggan aktif</span>`);

  const visHouses=S.houses.slice(cardPage*perCard,(cardPage+1)*perCard);
  put($('#sts'),visHouses.length?visHouses.map(hs=>{
    const cls=hs.net&&hs.plts?'both':hs.net?'net':'plts';
    const netBill=hs.net?Py(is.pkg.fee,is.pkg.yr):0;
    const pltsBill=hs.plts?Math.round((hs.usedKwh||0)*gs.rate):0;
    const tot=Math.round((netBill+pltsBill)*mult());
    return `<div class="card ${cls} ${(hs.net&&S.isp.fault)?'err':''}">
      <div class="r" style="justify-content:space-between"><b>${hs.n}</b><span class="lg">${hs.t}</span></div>
      <div class="r">${hs.net?`<span class="chip" style="color:var(--ac)">🌐 ${fmtBw(is.pkg.mbps)}</span>`:''}${hs.plts?`<span class="chip" style="color:var(--el)">⚡ ${(hs.usedKwh||0).toFixed(1)} kWh</span>`:''}</div>
      <div class="r" style="justify-content:space-between;margin-top:2px"><b>${fmt(tot)}<span class="lg">/bln</span></b><span class="lg">${hs.net&&hs.plts?'Bundling':hs.net?'Internet':'PLTS'}</span></div>
    </div>`;
  }).join(''):'<div class="box"><div class="mt">Belum ada pelanggan rumah.<br>1. Buka tab <b>Internet</b> untuk pasang ODP & tambah jalur Bandwidth Induk, atau<br>2. Buka tab <b>Listrik PLTS</b> untuk pasang Panel Surya, Baterai, & Kabel Warga.</div></div>');

  put($('#tb'),[['net','Internet'],['plts','Listrik PLTS'],['pg','Teknisi'],['bk','Bank'],['kl','Kalender'],['rh','Riwayat'],['lg','Catatan']].map(x=>`<button data-a="tab" data-i="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join(''));
  put($('#side'),side());
}

setInterval(()=>{
  const n=performance.now();let dt=(n-last)/1000;last=n;if(dt>1)dt=1;
  if(!S.pause){acc+=dt*2*S.spd;while(acc>=1){step();acc--}}
  render();
},100);
