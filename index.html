<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kopi Kontainer</title>
<meta name="theme-color" content="#12191d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/ikon-192.png">
<link rel="apple-touch-icon" href="img/ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <canvas id="adegan" aria-label="Kedai kopi kontainer di pinggir jalan"></canvas>

  <header id="hud" hidden>
    <div class="kartu-hud tanggal"><b id="h-hari">Senin, 2 Januari</b><span id="h-tahun">Tahun ke-1 · Hari ke-1</span></div>
    <div class="kartu-hud jam"><b id="h-jam">06.00</b><span id="h-status">Belum buka</span></div>
    <div id="h-chip" class="chips"></div>
  </header>

  <div id="toast" hidden></div>

  <footer id="bawah" hidden>
    <button id="b-aksi" class="aksi" type="button">Buka kedai</button>
    <div class="baris">
      <div class="kec" role="group" aria-label="Kecepatan waktu">
        <button type="button" data-kec="0" aria-pressed="false">Jeda</button>
        <button type="button" data-kec="1" aria-pressed="true">1×</button>
        <button type="button" data-kec="2" aria-pressed="false">2×</button>
        <button type="button" data-kec="4" aria-pressed="false">4×</button>
      </div>
      <div class="dok">
        <button id="b-kal" class="ikon" type="button" aria-label="Kalender">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="b-atur" class="ikon" type="button" aria-label="Atur usaha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <section id="layar-awal" class="layar">
    <h1 class="judul-game">Kopi Kontainer<small>Buka kedai kopi dari kontainer kecil di pinggir jalan.</small></h1>
    <div class="tombol-dua">
      <button id="b-lanjut" class="aksi" type="button" hidden>Lanjutkan</button>
      <button id="b-baru" class="tombol-lain" type="button">Mulai usaha baru</button>
    </div>
    <p id="info-simpan" class="kecil"></p>
  </section>

  <section id="layar-kota" class="layar" hidden>
    <h1 class="judul-game" style="font-size:32px">Buka di kota mana?<small>Kota menentukan gaji karyawan, sewa, dan selera pembeli.</small></h1>
    <div id="kota-daftar" class="kota-daftar"></div>
    <button id="b-kembali" class="tombol-lain" type="button">Kembali</button>
  </section>

  <div id="lembar" class="lembar" hidden><div id="lembar-isi" class="lembar-isi" role="dialog" aria-modal="true"></div></div>
</div>

<script src="js/data/nyata.js"></script>
<script src="js/kalender.js"></script>
<script src="js/simpan.js"></script>
<script src="js/adegan.js"></script>
<script src="js/main.js"></script>
</body>
</html>
