<script>
const $=s=>document.querySelector(s);
const fmt=n=>{
  const a=Math.abs(n),sg=n<0?'-':'';
  if(a>=1e15)return sg+'Rp '+(a/1e15).toFixed(2)+' Kuad';
  if(a>=1e12)return sg+'Rp '+(a/1e12).toFixed(2)+' T';
  if(a>=1e9)return sg+'Rp '+(a/1e9).toFixed(2)+' M';
  return sg+'Rp '+Math.round(a).toLocaleString('id-ID');
};
const fmtNum=n=>{
  if(n>=1e6)return (n/1e6).toFixed(2)+' Jt';
  if(n>=1e4)return (n/1e3).toFixed(1)+' Rb';
  return Math.round(n).toLocaleString('id-ID');
};
const fmtKwh=k=>{
  if(k>=1e9)return (k/1e9).toFixed(2)+' TWh';
  if(k>=1e6)return (k/1e6).toFixed(2)+' GWh';
  if(k>=1e3)return (k/1e3).toFixed(2)+' MWh';
  if(k<1)return Math.round(k*1000)+' Wh';
  return k.toFixed(2)+' kWh';
};
const fmtW=w=>{
  if(w>=1e9)return (w/1e9).toFixed(2)+' GW';
  if(w>=1e6)return (w/1e6).toFixed(2)+' MW';
  if(w>=1e3)return (w/1e3).toFixed(2)+' kW';
  return Math.round(w)+' W';
};
const put=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};

const START_YEAR=2000;

// 1. Generator Bensin/Solar Awal (Tahun 2000+) - Dibuat hemat BBM supaya tetap menguntungkan!
const GENS=[
  {id:0,n:'Belum ada generator',kw:0,fuelL:0,p:0},
  {id:1,n:'Genset Bensin Portable 5 kW (Irit)',kw:5,fuelL:0.6,p:1800000},
  {id:2,n:'Genset Bensin Twin-Cyl 18 kW',kw:18,fuelL:1.8,p:5500000},
  {id:3,n:'Generator Diesel Komunal 60 kW',kw:60,fuelL:5.0,p:16000000},
  {id:4,n:'Gardu Turbin Diesel 200 kW',kw:200,fuelL:14,p:45000000}
];

// 2. Kategori Bangunan Pelanggan (1 hingga 300 Juta Bangunan)
const SECTORS=[
  {id:'rmh',n:'Rumah Tangga',cls:'c0',kwPer:0.45,max:120000000,unlockCap:1},
  {id:'ruko',n:'Ruko & Minimarket',cls:'c1',kwPer:2.8,max:80000000,unlockCap:15},
  {id:'pabrik',n:'Pabrik & Kawasan Industri',cls:'c2',kwPer:45,max:65000000,unlockCap:250},
  {id:'mega',n:'Data Center & Pencakar Langit',cls:'c3',kwPer:420,max:35000000,unlockCap:5000}
];

// 3. Jaringan Distribusi & Transmisi
const GRID_TIER=[
  {lv:0,n:'Belum ada jaringan distribusi',max:0,p:0},
  {lv:1,n:'Kabel Tetangga Sebelah (Maks 3 Bangunan)',max:3,p:400000},
  {lv:2,n:'Jaringan Gang Kampung (Maks 12 Bangunan)',max:12,p:1800000},
  {lv:3,n:'Tiang Distribusi 1 RT (Maks 45 Bangunan)',max:45,p:6500000},
  {lv:4,n:'Gardu Trafo 1 RW (Maks 180 Bangunan)',max:180,p:22000000},
  {lv:5,n:'Jaringan Kecamatan (Maks 1.000 Bangunan)',max:1000,p:75000000},
  {lv:6,n:'Gardu Induk Kota (Maks 10.000 Bangunan)',max:10000,p:280000000},
  {lv:7,n:'Transmisi Provinsi (Maks 100.000 Bangunan)',max:100000,p:1.2e9},
  {lv:8,n:'Grid Nasional (Kalahkan PLN - 2 Juta Bangunan)',max:2000000,p:6.5e9},
  {lv:9,n:'Kabel Bawah Laut ASEAN (15 Juta Bangunan)',max:15000000,p:35e9},
  {lv:10,n:'Supergrid Asia-Pasifik (60 Juta Bangunan)',max:60000000,p:180e9},
  {lv:11,n:'HVDC Lintas Benua Eurasia (150 Juta Bangunan)',max:150000000,p:950e9},
  {lv:12,n:'Superkonduktor Global (300 Juta Bangunan)',max:300000000,p:4.8e12}
];

// 4. Stasiun Pemanen Surya Lintas Belahan Bumi
const ZONES=[
  {id:'idn',n:'Indonesia (WIB/WITA)',lat:'0° Khatulistiwa',sunStart:6,sunEnd:17,p:0},
  {id:'mea',n:'Timur Tengah & Sahara',lat:'25° LU (Gurun)',sunStart:10,sunEnd:21,p:150000000},
  {id:'eur',n:'Eropa & Afrika Barat',lat:'45° LU',sunStart:13,sunEnd:24,p:650000000},
  {id:'ame',n:'Amerika Utara & Selatan',lat:'35° LU/LS',sunStart:19,sunEnd:6,p:2.8e9},
  {id:'pac',n:'Pasifik & Australia',lat:'25° LS',sunStart:2,sunEnd:13,p:12e9}
];

// 5. Negara-negara Mitra
const COUNTRIES=[
  {id:'sg',n:'Singapura',bld:1200000,maxRate:1100,p:250000000},
  {id:'my',n:'Malaysia & Brunei',bld:6500000,maxRate:950,p:900000000},
  {id:'th',n:'Thailand & Vietnam',bld:18000000,maxRate:850,p:3.2e9},
  {id:'jp',n:'Jepang & Korea Selatan',bld:35000000,maxRate:780,p:14e9},
  {id:'in',n:'India & Asia Selatan',bld:65000000,maxRate:680,p:55e9},
  {id:'eu',n:'Uni Eropa & Inggris',bld:75000000,maxRate:600,p:220e9},
  {id:'us',n:'Amerika Serikat & Kanada',bld:99300000,maxRate:520,p:850e9}
];

const OWNERS=['Pak RT','Bu Siti','Mas Andi','Bu Tini','Pak Haji','Pak Budi','Bu Rina','Kang Dedi','Pak Joko','Bu Dewi','Mas Bayu','Pak Hendra','Bu Yanti','Pak Slamet','Mas Fajar','Bu Ningsih'];
const EMPNM=['Andi','Riko','Bambang','Dedi','Wawan','Yusuf','Rian','Bagas','Ilham','Reza','Surya','Hadi'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const INF=[3.72,11.5,12.55,10.03,5.06,6.4,17.11,6.6,6.59,11.06,2.78,6.96,3.79,4.3,8.38,8.36,3.35,3.02,3.61,3.13,2.72,1.68,1.87,5.51,2.61,1.57,2.9];

const KEY='juragan_energi_2000_v2';
let S,rc=0,cardPage=0,subTab='',subPage=0;

const day=()=>Math.floor(S.T/1440);
const curDate=()=>new Date(START_YEAR,0,1+day());
const curYear=()=>curDate().getFullYear();
const clock=()=>String(Math.floor(S.T/60)%24).padStart(2,'0')+':'+String(S.T%60).padStart(2,'0');

let _m=-1,_f=1;
const fx=()=>{
  const dt=curDate(),m=(dt.getFullYear()-START_YEAR)*12+dt.getMonth();
  if(m!==_m){_m=m;let f=1,y=Math.floor(m/12);for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;f*=1+(INF[y]!==undefined?INF[y]:3)/100*(m%12)/12;_f=f}
  return _f;
};
const P=n=>Math.round(n*fx()/50)*50;

// Sistem Riset Bertahap > 1.350x Riset
function batTechInfo(lv){
  const cap=Math.round(10*Math.pow(1.072,lv)*10)/10;
  const cost=Math.round(350000*Math.pow(1.068,lv)/1000)*1000;
  const names=['Baterai Aki Compact Rakitan','Sel Lithium-Ion Compact','Baterai LiFePO4 Modular','Solid-State Compact Cell','Graphene Super-Battery','Quantum Core Storage'];
  const nm=names[Math.min(names.length-1,Math.floor(lv/55))]+' Lv.'+(lv+1);
  return {lv,cap,cost,nm};
}
function harvTechInfo(lv){
  if(lv<=0)return {lv:0,kw:0,cost:1500000,nm:'Belum Diriset (Masih Pakai Bensin)'};
  const kw=Math.round(2.5*Math.pow(1.074,lv-1)*100)/100;
  const cost=Math.round(1500000*Math.pow(1.069,lv-1)/1000)*1000;
  const names=['Pemanen Surya Silikon Awal','Panel Monocrystalline Rakitan','Konsentrator Lensa Fresnel','Sel Multi-Junction MPPT','Kolektor Perovskite-Quantum','Pemanen Foton Spektrum Penuh'];
  const nm=names[Math.min(names.length-1,Math.floor((lv-1)/55))]+' Gen-'+lv;
  return {lv,kw,cost,nm};
}
function chgTechInfo(lv){
  const kw=Math.round(0.8*Math.pow(1.075,lv)*100)/100;
  const cost=Math.round(250000*Math.pow(1.067,lv)/1000)*1000;
  const names=['Regulator Cas 800W','Pulse Fast Charger','MPPT Smart Controller','GaN High-Speed Charger','Superconducting Busbar','Zero-Loss Quantum Transfer'];
  const nm=names[Math.min(names.length-1,Math.floor(lv/55))]+' Lv.'+(lv+1);
  return {lv,kw,cost,nm};
}
function effTechInfo(lv){
  const mult=Math.round((1+lv*0.05+Math.pow(lv,1.35)*0.018)*100)/100;
  const cost=Math.round(450000*Math.pow(1.068,lv)/1000)*1000;
  return {lv,mult,cost,nm:'Riset Efisiensi Foton & Termal Lv.'+(lv+1)};
}

function harvUnitBuyCost(lv){
  if(lv<=0)return 0;
  return Math.round(2200000*Math.pow(1.058,lv-1)/1000)*1000;
}
function harvUnitSellVal(item){
  const base=harvUnitBuyCost(item.gen||1);
  const ageYrs=Math.max(0,(day()-(item.day||0))/360);
  const ratio=Math.max(.30,.85-ageYrs*.05);
  return Math.round(base*ratio/1000)*1000;
}

function fresh(){
  // Modal awal Rp 1 Milyar (Rp 50 jt kas + Rp 950 jt rekening), mulai tahun 2000!
  S={
    m:50000000,b:950000000,T:420,stam:100,
    genLv:0,fuel:0,
    batLv:0,batKwh:0,
    harvLv:0,harvUnits:[],
    chgLv:0,effLv:0,
    zones:{idn:1},
    grid:{lv:0,on:false,rate:350,sat:85},
    sec:{rmh:0,ruko:0,pabrik:0,mega:0},
    sampleHouses:[],
    countries:{},
    emps:[],empSeq:1,
    dep:[],ln:null,
    rec:[],hv:'b',mute:false,cf:-999,
    bC:0,bI:0,spd:1,pause:false,tab:'res',
    log:['1 Jan 2000. Modal awal Rp 1 Milyar siap dipakai! Langsung gas riset teknologi, pasang alat pemanen surya, dan perluas jaringan ke warga!'],
    inc:0,exp:0,yrInc:0,moRev:0,totalKwhSold:0
  };
}
function migrate(o){
  if(!Array.isArray(o.harvUnits))o.harvUnits=[];
  if(!Array.isArray(o.sampleHouses))o.sampleHouses=[];
  if(!Array.isArray(o.emps))o.emps=[];
  if(!Array.isArray(o.dep))o.dep=[];
  if(!Array.isArray(o.rec))o.rec=[];
  if(!o.zones)o.zones={idn:1};
  if(!o.grid)o.grid={lv:0,on:false,rate:350,sat:85};
  if(!o.sec)o.sec={rmh:0,ruko:0,pabrik:0,mega:0};
  if(!o.countries)o.countries={};
  return o;
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.T===undefined)fresh();else migrate(S);

const save=()=>{S.sv=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave()};
const log=m=>{S.log.unshift(clock()+' '+m);S.log.length=Math.min(S.log.length,16)};
const have=()=>S.m+S.b;
const spend=n=>{const t=Math.min(Math.max(S.m,0),n);S.m-=t;S.b-=n-t;S.exp+=n};
const buy=n=>{if(have()<n){log('Uang kurang ('+fmt(n)+').');snd('warn');return 0}spend(n);snd('buy');return 1};
const mult=()=>S.bI?2:1;

let AC;const _l={};
function snd(t){
  if(S.mute||document.hidden)return;
  try{
    const n=performance.now();if(_l[t]&&n-_l[t]<120)return;_l[t]=n;
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const q={coin:[[988,.07],[1319,.12]],bell:[[660,.08]],buy:[[440,.06],[554,.06],[659,.09]],warn:[[220,.18],[180,.22]],month:[[523,.1],[659,.1],[784,.18]],click:[[300,.03]]}[t]||[];
    let at=AC.currentTime;
    q.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t==='warn'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.11,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.02);at+=d*.9});
  }catch(e){}
}

const shiftHours=e=>{const d=(e.end-e.start+24)%24;return d===0?24:d};
function empWorkingNow(e){
  if(e.sick>0||e.off>0)return false;
  const h=Math.floor(S.T/60)%24;
  if(e.start===e.end)return true;
  return e.start<e.end?(h>=e.start&&h<e.end):(h>=e.start||h<e.end);
}
const activeEmps=()=>S.emps.filter(empWorkingNow);
const empOnDuty=()=>activeEmps().length>0;

function depRate(mo){return Math.min(.015,.005+mo*.001)}

function totalBuildings(){
  return (S.sec.rmh||0)+(S.sec.ruko||0)+(S.sec.pabrik||0)+(S.sec.mega||0);
}

function zoneSolarRatio(h){
  const active=ZONES.filter(z=>S.zones[z.id]);
  if(!active.length)return 0;
  let sunCount=0;
  active.forEach(z=>{
    const lit=z.sunStart<z.sunEnd?(h>=z.sunStart&&h<z.sunEnd):(h>=z.sunStart||h<z.sunEnd);
    if(lit)sunCount++;
  });
  return sunCount/active.length;
}

function energyStats(){
  const h=Math.floor(S.T/60)%24;
  const bat=batTechInfo(S.batLv||0);
  const chg=chgTechInfo(S.chgLv||0);
  const eff=effTechInfo(S.effLv||0);
  const gen=GENS[S.genLv||0];

  let rawSolarKw=0;
  S.harvUnits.forEach(u=>{rawSolarKw+=harvTechInfo(u.gen||1).kw});
  const sunRatio=zoneSolarRatio(h);
  const solarAvailKw=rawSolarKw*eff.mult*sunRatio;

  const maxChgKw=chg.kw*Math.max(1,S.harvUnits.length)*eff.mult;
  const solarChargeKw=Math.min(solarAvailKw,maxChgKw);

  const genKw=(gen.kw>0&&S.fuel>0)?gen.kw:0;

  const tod=(h>=17&&h<23)?1.3:(h>=6&&h<17)?0.95:0.65;
  let demandKw=0;
  SECTORS.forEach(sc=>{demandKw+=(S.sec[sc.id]||0)*sc.kwPer*tod});
  COUNTRIES.forEach(ct=>{
    if(S.countries[ct.id])demandKw+=ct.bld*0.85*tod;
  });

  const plnRate=P(450);
  const rate=S.grid.rate||350;
  const discPct=((plnRate-rate)/plnRate)*100;

  return {bat,chg,eff,gen,rawSolarKw,sunRatio,solarAvailKw,solarChargeKw,genKw,demandKw,plnRate,rate,discPct};
}

function power(h){
  const es=energyStats();
  if(es.solarChargeKw>0&&S.batKwh<es.bat.cap){
    S.batKwh=Math.min(es.bat.cap,S.batKwh+es.solarChargeKw);
  }
  let genSupplied=0;
  if(es.gen.kw>0&&S.fuel>0){
    const needGen=(S.grid.on&&es.demandKw>S.batKwh)?Math.min(es.gen.kw,es.demandKw):(!S.grid.on&&S.batKwh<es.bat.cap)?Math.min(es.gen.kw,es.bat.cap-S.batKwh):0;
    if(needGen>0){
      const ratio=needGen/es.gen.kw;
      const fuelUse=es.gen.fuelL*Math.max(.35,ratio);
      if(S.fuel>=fuelUse){
        S.fuel-=fuelUse;
        genSupplied=needGen;
      }else{
        genSupplied=needGen*(S.fuel/fuelUse);
        S.fuel=0;
      }
      if(!S.grid.on)S.batKwh=Math.min(es.bat.cap,S.batKwh+genSupplied);
    }
  }

  if(S.grid.on&&es.demandKw>0){
    let need=es.demandKw;
    const fromGen=Math.min(need,genSupplied);
    need-=fromGen;
    const fromBat=Math.min(need,S.batKwh);
    S.batKwh-=fromBat;
    need-=fromBat;
    const supplied=fromGen+fromBat;

    if(supplied>0){
      const rev=Math.round(supplied*es.rate*mult());
      S.b+=rev;S.inc+=rev;S.moRev=(S.moRev||0)+rev;
      S.totalKwhSold=(S.totalKwhSold||0)+supplied;
      S.sampleHouses.forEach(sh=>{
        const u=sh.kw*0.9;
        sh.usedKwh=(sh.usedKwh||0)+u;
        sh.bill=(sh.bill||0)+Math.round(u*es.rate*mult());
      });
    }
    if(need>es.demandKw*0.15){
      S.grid.sat=Math.max(10,(S.grid.sat||85)-2);
    }else{
      S.grid.sat=Math.min(100,(S.grid.sat||85)+1);
    }
  }
}

function addBuildings(secId,count){
  if(count<=0)return;
  S.sec[secId]=(S.sec[secId]||0)+count;
  const sc=SECTORS.find(x=>x.id===secId);
  while(S.sampleHouses.length<18&&S.sampleHouses.length<totalBuildings()){
    const idx=S.sampleHouses.length;
    const nm=sc.id==='rmh'?(OWNERS[idx%OWNERS.length]+' #'+(idx+1)):(sc.n+' #'+(idx+1));
    S.sampleHouses.push({n:nm,sec:sc.n,cls:sc.cls,kw:sc.kwPer,usedKwh:0,bill:0});
  }
}

function dayEnd(){
  S.emps.forEach(e=>{
    if(e.off>0)e.off--;
    if(e.sick>0){
      e.sick--;
      if(e.sick===0)log(e.n+' sudah sembuh dan kembali bertugas.');
      return;
    }
    const hrs=shiftHours(e);
    const over=Math.max(0,hrs-12);
    if(Math.random()<(.002+over*.003)){
      e.sick=1+Math.floor(Math.random()*2);
      log(e.n+' sakit ('+e.sick+' hari).');
    }
  });

  const es=energyStats();
  const tier=GRID_TIER[S.grid.lv||0];
  const totBld=totalBuildings();

  if(tier.lv>0&&S.grid.on){
    if(es.discPct<0){
      S.grid.sat=Math.max(5,(S.grid.sat||85)-10);
      if(totBld>0){
        const drop=Math.max(1,Math.floor(totBld*0.05));
        SECTORS.forEach(sc=>{S.sec[sc.id]=Math.max(0,(S.sec[sc.id]||0)-Math.ceil(drop/4))});
        log('Tarif lebih mahal dari kompetitor! Sebagian pelanggan berhenti.');
      }
    }else if(totBld<tier.max&&es.discPct>=5&&(S.batKwh>0||es.genKw>0)){
      const room=tier.max-totBld;
      const growth=Math.min(room,Math.max(1,Math.ceil(tier.max*0.1*(S.bC?2.5:1)*(1+es.discPct/50))));
      let rem=growth;
      SECTORS.forEach(sc=>{
        if(rem<=0)return;
        if(tier.max>=sc.unlockCap&&(S.sec[sc.id]||0)<sc.max){
          const take=Math.min(rem,sc.max-(S.sec[sc.id]||0),Math.max(1,Math.ceil(growth*0.4)));
          addBuildings(sc.id,take);
          rem-=take;
        }
      });
      if(S.spd<=64&&growth>0)log('+'+fmtNum(growth)+' bangunan baru tersambung ke jaringan listrikmu!');
    }
  }
}

function monthEnd(){
  const dt=curDate(),prev=new Date(dt.getFullYear(),dt.getMonth()-1,1);
  const totalGaji=S.emps.reduce((z,e)=>z+e.sal,0);
  if(totalGaji>0)spend(totalGaji);

  if(S.ln){
    if(have()>=S.ln.pay)spend(S.ln.pay);
    else{spend(Math.round(S.ln.pay*1.02));log('Cicilan bank telat, kena denda 2%.')}
    if(--S.ln.left<=0)S.ln=null;
  }

  let bankInt=0;
  if(S.b>0){bankInt=Math.round(S.b*.0033);S.b+=bankInt}
  if(S.dep.length){
    S.dep.forEach(d=>{
      const r=depRate(d.mo);
      const g=Math.round(d.amt*r);
      S.b+=g;bankInt+=g;d.mo++;
    });
  }

  const omzet=S.moRev||0;
  const tax=Math.round(omzet*0.005);
  if(tax>0)spend(tax);

  (S.rec=S.rec||[]).push({y:prev.getFullYear(),m:prev.getMonth(),rev:omzet,o:bankInt,x:S.exp});
  log('Rekap '+BLN[prev.getMonth()]+' '+prev.getFullYear()+': Omzet Listrik '+fmt(omzet)+', Keluar '+fmt(S.exp)+'.');
  snd('month');S.inc=0;S.exp=0;S.moRev=0;
  S.sampleHouses.forEach(sh=>{sh.usedKwh=0;sh.bill=0});
  save();
}

function step(){
  S.T++;
  const h=Math.floor(S.T/60)%24,mi=S.T%60;
  if(S.T%1440===0&&day()>0){
    dayEnd();
    if(curDate().getDate()===1)monthEnd();
  }
  const onD=empOnDuty();
  const sleeping=(h>=22||h<6);
  if(sleeping||onD){
    S.stam=Math.min(100,S.stam+15/60);
  }else{
    S.stam=Math.max(20,S.stam-1.5/60);
    if(S.stam<35&&S.T-S.cf>=90&&have()>=10000){
      spend(10000);S.stam=Math.min(100,S.stam+40);S.cf=S.T;
    }
  }
  if(mi===0)power(h);
}

const A={
  pause(){S.pause=!S.pause},
  spd(i){S.spd=+i},
  tab(i){S.tab=i;subTab='';subPage=0},
  stab(i){subTab=i;subPage=0},
  spg(d){subPage=Math.max(0,subPage+(+d))},
  cpg(d){cardPage=Math.max(0,cardPage+(+d))},
  cof(){
    if(S.T-S.cf<60||S.stam>=100)return log('Stamina masih bugar.');
    if(!buy(10000))return;
    S.stam=Math.min(100,S.stam+40);S.cf=S.T;log('Ngopi dulu, stamina +40.');
  },
  bI(){S.bI=S.bI?0:1},
  bC(){S.bC=S.bC?0:1},
  mute(){S.mute=!S.mute;if(!S.mute)snd('coin')},

  // Generator Bensin & Bahan Bakar
  upgen(){
    const nl=(S.genLv||0)+1;if(nl>=GENS.length)return;
    const g=GENS[nl];
    if(!buy(P(g.p)))return;
    S.genLv=nl;log('Beli generator: '+g.n+' ('+g.kw+' kW).');
  },
  sellgen(){
    if((S.genLv||0)<=0)return;
    const g=GENS[S.genLv];
    const v=Math.round(P(g.p)*0.65);
    S.m+=v;S.genLv=0;snd('coin');
    log('Jual second '+g.n+' dapat '+fmt(v)+'.');
  },
  buyfuel(liters){
    const L=+liters,cost=P(L*1200);
    if(!buy(cost))return;
    S.fuel=(S.fuel||0)+L;
    log('Isi bensin/solar +'+L+' Liter (stok: '+S.fuel.toFixed(1)+' L).');
  },

  // Riset Bertahap (> 1.350x Riset) - Mendukung +1x dan +5x riset sekaligus!
  rbat(q){
    const times=Math.max(1,+q||1);let done=0;
    for(let i=0;i<times;i++){
      const nx=batTechInfo((S.batLv||0)+1);
      if(!buy(nx.cost))break;
      S.batLv=nx.lv;done++;
    }
    if(done>0){
      const cur=batTechInfo(S.batLv);
      log('Riset Baterai +'+done+'x: '+cur.nm+' (kapasitas '+fmtKwh(cur.cap)+')!');
    }
  },
  rharv(q){
    const times=Math.max(1,+q||1);let done=0;
    for(let i=0;i<times;i++){
      const nx=harvTechInfo((S.harvLv||0)+1);
      if(!buy(nx.cost))break;
      S.harvLv=nx.lv;done++;
    }
    if(done>0){
      const cur=harvTechInfo(S.harvLv);
      log('Riset Pemanen Surya +'+done+'x: '+cur.nm+' ('+fmtW(cur.kw)+'/unit)!');
    }
  },
  rchg(q){
    const times=Math.max(1,+q||1);let done=0;
    for(let i=0;i<times;i++){
      const nx=chgTechInfo((S.chgLv||0)+1);
      if(!buy(nx.cost))break;
      S.chgLv=nx.lv;done++;
    }
    if(done>0){
      const cur=chgTechInfo(S.chgLv);
      log('Riset Charging +'+done+'x: '+cur.nm+' ('+fmtW(cur.kw)+')!');
    }
  },
  reff(q){
    const times=Math.max(1,+q||1);let done=0;
    for(let i=0;i<times;i++){
      const nx=effTechInfo((S.effLv||0)+1);
      if(!buy(nx.cost))break;
      S.effLv=nx.lv;done++;
    }
    if(done>0){
      const cur=effTechInfo(S.effLv);
      log('Riset Efisiensi +'+done+'x: '+cur.nm+' ('+cur.mult+'x)!');
    }
  },

  // Produksi, Pemasangan & Jual Second Alat Pemanen Surya
  buyharv(q){
    if((S.harvLv||0)<=0)return log('Riset dulu Alat Pemanen Surya Gen-1 di tab Riset!');
    const qty=Math.max(1,+q||1);
    const unitCost=harvUnitBuyCost(S.harvLv);
    if(!buy(unitCost*qty))return;
    for(let i=0;i<qty;i++)S.harvUnits.push({gen:S.harvLv,day:day()});
    log('Pasang +'+qty+' unit '+harvTechInfo(S.harvLv).nm+' (total '+S.harvUnits.length+' unit).');
  },
  sellharv(mode){
    if(!S.harvUnits.length)return;
    let tot=0,sold=0;
    if(mode==='old'){
      const minGen=Math.min(...S.harvUnits.map(x=>x.gen));
      if(minGen>=S.harvLv)return log('Semua alatmu sudah generasi terbaru.');
      const keep=[];
      S.harvUnits.forEach(u=>{
        if(u.gen===minGen){tot+=harvUnitSellVal(u);sold++}
        else keep.push(u);
      });
      S.harvUnits=keep;
    }else{
      const qty=mode==='all'?S.harvUnits.length:Math.min(S.harvUnits.length,+mode||1);
      for(let i=0;i<qty;i++)tot+=harvUnitSellVal(S.harvUnits.shift());
      sold=qty;
    }
    S.m+=tot;snd('coin');
    log('Jual second '+sold+' alat pemanen surya dapat '+fmt(tot)+'.');
  },

  // Belahan Bumi (24 Jam Matahari)
  buyzone(id){
    const z=ZONES.find(x=>x.id===id);if(!z||S.zones[id])return;
    if(!buy(z.p))return;
    S.zones[id]=1;
    log('Stasiun Pemanen Surya di '+z.n+' aktif! Cakupan matahari global meningkat.');
  },

  // Jaringan & Tarif Listrik
  gridup(){
    const nl=(S.grid.lv||0)+1;if(nl>=GRID_TIER.length)return;
    const gt=GRID_TIER[nl];
    if(!buy(gt.p))return;
    S.grid.lv=nl;
    if(nl===1){
      S.grid.on=true;
      S.grid.rate=Math.round(P(450)*0.78/10)*10;
      addBuildings('rmh',1);
      log('Kabel listrik pertama tersambung ke rumah tetangga!');
    }else{
      log('Upgrade jaringan ke '+gt.n+' (kapasitas '+fmtNum(gt.max)+' bangunan).');
    }
  },
  toggrid(){
    if((S.grid.lv||0)<=0)return log('Pasang kabel distribusi pertama dulu.');
    S.grid.on=!S.grid.on;
    log('Penyaluran listrik ke pelanggan: '+(S.grid.on?'ON (Mengalir)':'OFF'));
  },
  gridrate(d){S.grid.rate=Math.max(20,(S.grid.rate||350)+(+d))},
  gridpreset(pct){
    const pln=P(450);
    S.grid.rate=Math.max(20,Math.round(pln*(1-(+pct)/100)/10)*10);
  },

  // Ekspansi Antarnegara
  buycountry(id){
    const ct=COUNTRIES.find(x=>x.id===id);if(!ct||S.countries[id])return;
    const rate=S.grid.rate||350;
    if(rate>P(ct.maxRate))return log('Tarifmu terlalu mahal untuk '+ct.n+'! Turunkan tarif di bawah '+fmt(P(ct.maxRate))+'/kWh.');
    if(!buy(ct.p))return;
    S.countries[id]=1;
    addBuildings('mega',Math.min(ct.bld,2500000));
    log('Izin resmi disetujui! Jaringan listrikmu kini menyuplai negara '+ct.n+'!');
  },

  // Teknisi / Karyawan
  hi(){
    const id=S.empSeq++,n=EMPNM[(id-1)%EMPNM.length]+' #'+id;
    const st=S.emps.length%2===0?8:20,en=(st+12)%24;
    S.emps.push({id,n,start:st,end:en,sal:P(1200000),sick:0,off:0,offMo:-1});
    log('Rekrut teknisi '+n+' (shift '+String(st).padStart(2,'0')+':00–'+String(en).padStart(2,'0')+':00).');
  },
  fi(id){S.emps=S.emps.filter(e=>e.id!==+id)},
  es(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.start=(e.start+(+d)+24)%24},
  ee(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.end=(e.end+(+d)+24)%24},
  esal(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.sal=Math.max(400000,e.sal+(+d))},
  eoff(id){
    const e=S.emps.find(x=>x.id===+id);if(!e)return;
    const cm=(curYear()-START_YEAR)*12+curDate().getMonth();
    if(e.offMo===cm)return log(e.n+' sudah dapat jatah libur bulan ini.');
    if(e.sick>0)return log(e.n+' sedang sakit.');
    e.off=1;e.offMo=cm;
    log(e.n+' diberi libur 1 hari.');
  },

  // Bank
  dep(n){const t=Math.min(+n,S.m);S.m-=t;S.b+=t},
  wd(n){const t=Math.min(+n,Math.max(S.b,0));S.b-=t;S.m+=t},
  mkdep(n){
    n=+n;if(S.b<n)return log('Saldo rekening kurang untuk deposito '+fmt(n)+'.');
    S.b-=n;S.dep.push({id:Date.now()+Math.random(),amt:n,mo:0});
    log('Buka deposito '+fmt(n)+' (bunga awal 0,5%/bln, naik +0,1% tiap bulan).');snd('buy');
  },
  cldep(idx){
    const d=S.dep[+idx];if(!d)return;
    S.b+=d.amt;S.dep.splice(+idx,1);snd('coin');
    log('Cairkan deposito '+fmt(d.amt)+' ke rekening.');
  },
  ln(n){
    if(S.ln)return log('Masih ada cicilan berjalan.');
    n=+n;const r=.15/12;S.ln={pay:Math.round(n*r/(1-Math.pow(1+r,-12))),left:12};S.b+=n;log('Pinjaman cair '+fmt(n)+'.');
  },

  hv(i){S.hv=i;subPage=0},
  rst(){if(!rc){rc=1;return}rc=0;cardPage=0;subTab='';subPage=0;fresh();save()}
};

const R=(l,s,a,i,b,x)=>`<div class="row"><span>${l}<br><span class="lg">${s}</span></span>${a?`<button data-a="${a}" data-i="${i}" class="sm" ${x?'disabled':''}>${b}</button>`:''}</div>`;
const B=(a,i,t,x,cl='')=>`<button data-a="${a}" data-i="${i}" class="${cl}" ${x?'disabled':''}>${t}</button>`;
const padH=n=>String(n).padStart(2,'0')+':00';

function paginate(items,perPage){
  const maxP=Math.max(0,Math.ceil(items.length/perPage)-1);
  if(subPage>maxP)subPage=maxP;
  const slice=items.slice(subPage*perPage,(subPage+1)*perPage);
  const nav=maxP>0?`<div class="pgnav" style="justify-content:flex-end;margin-top:4px">${B('spg',-1,'◀',subPage<=0,'sm')}<span>Hal ${subPage+1}/${maxP+1}</span>${B('spg',1,'▶',subPage>=maxP,'sm')}</div>`:'';
  return {slice,nav};
}

function side(){
  const t=S.tab;let h='';

  if(t==='res'){
    const es=energyStats();

      +`<div class="row"><span>1. ${nxBat.nm}<br><span class="lg">kapasitas baterai: ${fmtKwh(es.bat.cap)} → <b>${fmtKwh(nxBat.cap)}</b></span></span><span>${B('rbat',1,'+1 ('+fmt(nxBat.cost)+')',0,'sm')} ${B('rbat',5,'+5x',0,'sm')}</span></div>`
      +`<div class="row"><span>2. ${nxHarv.nm}<br><span class="lg">daya pemanen: ${fmtW(es.harvLv?harvTechInfo(S.harvLv).kw:0)} → <b>${fmtW(nxHarv.kw)}</b>/unit</span></span><span>${B('rharv',1,'+1 ('+fmt(nxHarv.cost)+')',0,'sm')} ${B('rharv',5,'+5x',0,'sm')}</span></div>`
      +`<div class="row"><span>3. ${nxChg.nm}<br><span class="lg">kecepatan cas: ${fmtW(es.chg.kw)} → <b>${fmtW(nxChg.kw)}</b>/unit</span></span><span>${B('rchg',1,'+1 ('+fmt(nxChg.cost)+')',0,'sm')} ${B('rchg',5,'+5x',0,'sm')}</span></div>`

    const box=`<div class="box"><div class="lg">Baterai Utama: <b>${fmtKwh(S.batKwh)} / ${fmtKwh(es.bat.cap)}</b> · Matahari Aktif: <b>${Math.round(es.sunRatio*100)}%</b> · Cas masuk: <b style="color:var(--ok)">+${fmtKwh(es.solarChargeKw)}/jam</b></div></div>`;

    if(st==='unit'){
      h=`<div>${tabs}${box}`
        +(curGen>0
          ?`<div class="row"><span>Pasang ${harvTechInfo(curGen).nm}<br><span class="lg">harga ${fmt(unitCost)}/unit · daya ${fmtW(harvTechInfo(curGen).kw)}/unit</span></span><span>${[1,5,25].map(q=>B('buyharv',q,'+'+q+' ('+fmt(unitCost*q)+')',0,'sm')).join(' ')}</span></div>`
          :`<div class="box"><div class="mt">Belum ada cetak biru Alat Pemanen Surya. Buka tab <b>Riset (1000+)</b> dan lakukan riset #2 (Alat Pemanen Surya Gen-1) terlebih dahulu!</div></div>`)

    const totBld=totalBuildings();
    const plnShare=Math.min(100,(totBld/2000000)*100);
    const pctColor=es.discPct>=20?'var(--ok)':es.discPct>=0?'var(--wr)':'var(--bad)';
    const pctText=es.discPct>0?`${es.discPct.toFixed(1)}% lebih murah dari PLN/Global`:`${Math.abs(es.discPct).toFixed(1)}% lebih mahal`;
    const tabs=`<div class="subtabs">${[['tarif','Jaringan & Tarif'],['negara','Ekspansi Negara ('+Object.keys(S.countries).length+'/'+COUNTRIES.length+')']].map(x=>B('stab',x[0],x[1],0,'sm '+(st===x[0]?'on':''))).join('')}</div>`;

    if(st==='tarif'){
      h=`<div>${tabs}<div class="box">
        <div class="r"><b>${tier.n}</b><span class="chip" style="color:${S.grid.on?'var(--ok)':'var(--mt)'}">${S.grid.on?'MENGALIR':'OFF'}</span>${B('toggrid','',S.grid.on?'Matikan':'Salurkan',tier.lv<=0,'sm '+(S.grid.on?'on':''))}</div>
        <div class="lg">Bangunan: <b>${fmtNum(totBld)} / ${fmtNum(tier.max)}</b> · Sedot: <b>${fmtW(es.demandKw*1000)}</b> · Pangsa vs PLN: <b>${plnShare>=100?'🏆 PLN KALAH!':plnShare.toFixed(2)+'%'}</b></div>
        <div class="row"><span>Tarif: <b>${fmt(es.rate)}/kWh</b> (<b style="color:${pctColor}">${pctText}</b>)</span><span>${B('gridrate',-25,'-25',0,'sm')} <input type="number" data-grate="1" value="${es.rate}" style="width:62px"> ${B('gridrate',25,'+25',0,'sm')} ${[20,30].map(pc=>B('gridpreset',pc,'-'+pc+'%',0,'sm')).join(' ')}</span></div>
      </div>`
      +(nxtTier
        ?R('Perluas Jaringan: '+nxtTier.n,'kapasitas maksimal '+fmtNum(nxtTier.max)+' bangunan','gridup','',fmt(nxtTier.p))
        :R('Jaringan Global Maksimal','kapasitas hingga 300.000.000 bangunan tercapai!',0))
      +`</div>`;
    }else{
      const rows=COUNTRIES.map(ct=>{
        const maxR=P(ct.maxRate);
        return R(ct.n+' (+'+fmtNum(ct.bld)+' bangunan)','syarat tarif ≤ '+fmt(maxR)+'/kWh · izin ekspansi','buycountry',ct.id,S.countries[ct.id]?'Tersambung':fmt(ct.p),!!S.countries[ct.id]);
      });
      const pg=paginate(rows,4);
      h=`<div>${tabs}<div class="lg" style="margin-bottom:4px">Negara lain akan mengizinkan jaringanmu masuk jika tarifmu lebih murah dari standar negara mereka.</div>${pg.slice.join('')}</div>${pg.nav}`;
    }
  }

  if(t==='gen'){
    const es=energyStats(),nxtGen=GENS[(S.genLv||0)+1];
    const fuelPrice=P(1200);
    h=`<div><div class="box">
      <div class="r"><b>${es.gen.n}</b><span class="chip" style="color:${es.genKw>0?'var(--ok)':'var(--mt)'}">${es.genKw>0?es.genKw+' kW AKTIF':'OFF / BENSIN HABIS'}</span></div>
      <div class="lg">Stok Bensin/Solar: <b>${(S.fuel||0).toFixed(1)} Liter</b> · Konsumsi penuh: <b>${es.gen.fuelL} L/jam</b> · Harga BBM: <b>${fmt(fuelPrice)}/L</b></div>
    </div>`
    +`<div class="row"><span>Beli Bensin / Solar</span><span>${[50,250,1000,5000].map(L=>B('buyfuel',L,'+'+L+'L ('+fmt(fuelPrice*L)+')',0,'sm')).join(' ')}</span></div>`
    +(nxtGen
      ?R('Upgrade Generator: '+nxtGen.n,'daya '+nxtGen.kw+' kW · konsumsi '+nxtGen.fuelL+' L/jam','upgen','',fmt(P(nxtGen.p)))
      :R('Generator Bensin/Diesel Maksimal','sudah siap diperkuat dengan Alat Pemanen Surya!',0))
    +((S.genLv||0)>0
      ?R('Jual Second Generator','jual mesin bensin jika sudah full tenaga surya','sellgen','',fmt(Math.round(P(es.gen.p)*0.65)))
      :'')
    +`</div>`;
  }

  if(t==='pg'){
    const cm=(curYear()-START_YEAR)*12+curDate().getMonth(),stdSal=P(1200000);
    const eCards=S.emps.map(e=>{
      const hrs=shiftHours(e),st=e.sick>0?`<b style="color:var(--bad)">SAKIT (${e.sick}h)</b>`:e.off>0?'<b style="color:var(--ok)">LIBUR</b>':empWorkingNow(e)?'<b style="color:var(--ok)">Jaga</b>':'Off';
      const usedOff=e.offMo===cm;
      return `<div class="box">
        <div class="r"><b>${e.n}</b><span class="lg">${st} · Shift ${padH(e.start)}–${padH(e.end)} (${hrs}j)</span>${B('fi',e.id,'Pecat',0,'sm bad')}</div>
        <div class="row"><span class="lg">Shift:</span><span>${B('es',e.id+':-1','-Msk',0,'sm')} ${B('es',e.id+':1','+Msk',0,'sm')} ${B('ee',e.id+':-1','-Plg',0,'sm')} ${B('ee',e.id+':1','+Plg',0,'sm')}</span><span class="lg">Gaji ${fmt(e.sal)}</span><span>${B('esal',e.id+':-100000','-100rb',0,'sm')} ${B('esal',e.id+':100000','+100rb',0,'sm')} ${B('eoff',e.id,usedOff?'Sudah Libur':'Libur',usedOff||e.sick>0,'sm')}</span></div>
      </div>`;
    });
    const pg=paginate(eCards,3);
    h=`<div><div class="row"><span>Operator & Teknisi: <b>${S.emps.length}</b> (gaji standar ${fmt(stdSal)}/bln)</span>${B('hi','','+ Rekrut',0,'sm')}</div>`
      +(pg.slice.length?pg.slice.join(''):'<div class="lg">Belum ada teknisi. Rekrut untuk membantu operasional jaringan.</div>')
      +`</div>${pg.nav}`;
  }

  if(t==='bk'){
    const st=subTab||'dp';
    const tabs=`<div class="subtabs">${[['dp','Tabungan & Deposito'],['ln','Pinjaman Bank']].map(x=>B('stab',x[0],x[1],0,'sm '+(st===x[0]?'on':''))).join('')}</div>`;
    if(st==='dp'){
      const dRows=S.dep.map((d,idx)=>R('Deposito '+fmt(d.amt),'umur '+d.mo+' bln · bunga '+(depRate(d.mo)*100).toFixed(1)+'% ('+fmt(d.amt*depRate(d.mo))+'/bln)','cldep',idx,'Cairkan'));
      const pg=paginate(dRows,3);
      h=`<div>${tabs}<div class="r"><b>${fmt(S.b)}</b><span class="lg">saldo Bank (bunga 4%/thn)</span>${B('dep',50000000,'Setor 50jt',0,'sm')}${B('wd',50000000,'Tarik 50jt',0,'sm')}</div>`
        +`<div class="row"><span>Buka Deposito (bunga naik +0,1%/bln)</span><span>${[50e6,200e6,500e6,2e9].map(n=>B('mkdep',n,fmt(n),S.b<n,'sm')).join(' ')}</span></div>`
        +(pg.slice.length?pg.slice.join(''):'<div class="lg">Belum ada deposito aktif.</div>')
        +`</div>${pg.nav}`;
    }else{
      h=`<div>${tabs}`
        +(S.ln?R('Cicilan bank berjalan',fmt(S.ln.pay)+'/bln · sisa '+S.ln.left+' bln'):'')
        +[100e6,500e6,2e9,10e9].map(n=>R('Pinjaman '+fmt(n),'bunga 15%/thn, 12 bulan','ln',n,'Ajukan',!!S.ln)).join('')
        +`</div>`;
    }
  }

  if(t==='rh'){
    const v=S.hv||'b',rec=S.rec||[];
    const cur={y:curYear(),m:curDate().getMonth(),rev:S.moRev||0,o:0,x:S.exp};
    const sum=a=>a.reduce((z,r)=>({rev:z.rev+r.rev,o:z.o+r.o,x:z.x+r.x}),{rev:0,o:0,x:0});
    const row=(l,r)=>{
      const profit=r.rev+r.o-r.x;
      return `<div class="row"><span>${l}<br><span class="lg">Listrik ${fmt(r.rev)} · Bunga ${fmt(r.o)} · Keluar ${fmt(r.x)}</span></span><b style="color:${profit<0?'var(--bad)':'var(--ok)'}">${fmt(profit)}</b></div>`;
    };
    let rows=[];
    if(v==='b')rows=[row('Bulan berjalan (real-time)',cur)].concat(rec.slice().reverse().map(r=>row(BLN[r.m]+' '+r.y,r)));
    if(v==='t'){const ys={},yc=curYear();rec.forEach(r=>(ys[r.y]=ys[r.y]||[]).push(r));if(!ys[yc])ys[yc]=[];rows=Object.keys(ys).sort().reverse().map(y=>row('Tahun '+y+(+y===yc?' (berjalan)':''),sum(ys[y].concat(+y===yc?[cur]:[]))))}
    const pg=paginate(rows,5);
    h=`<div><div class="subtabs">${[['b','Bulanan'],['t','Tahunan']].map(x=>B('hv',x[0],x[1],0,'sm '+(v===x[0]?'on':''))).join('')}</div>${pg.slice.join('')}</div>${pg.nav}`;
  }

  if(t==='lg'){
    h=`<div>${S.log.slice(0,11).map(l=>`<div class="lg" style="padding:3px 0;border-bottom:1px dashed var(--bd)">${l}</div>`).join('')}</div><div style="margin-top:6px"><button data-a="rst" class="sm bad">${rc?'Yakin? Tap lagi':'Mulai ulang game'}</button></div>`;
  }
  return h;
}

function render(){
  const dt=curDate(),yr=curYear(),es=energyStats(),totBld=totalBuildings();
  const h=Math.floor(S.T/60)%24;
  const st=(h>=22||h<6)?['ISTIRAHAT (22-06)','var(--ac)']:S.grid.on?['MENYALURKAN','var(--ok)']:['SIAGA','var(--mt)'];
  const plnPct=Math.min(100,(totBld/2000000)*100);

  put($('#hd'),
    `<div class="r"><b>${fmt(S.m)}</b><span class="lg">bank ${fmt(S.b)}</span><span>${HARI[dt.getDay()]}, ${dt.getDate()} ${BLN[dt.getMonth()]} ${yr}, ${clock()}</span><span class="chip" style="color:${st[1]}">${st[0]}</span><span class="chip" style="color:var(--ac)">Bangunan: ${fmtNum(totBld)} / 300 Jt</span><span class="chip" style="color:${plnPct>=100?'var(--ok)':'var(--wr)'}">${plnPct>=100?'🏆 PLN KALAH':'vs PLN: '+plnPct.toFixed(1)+'%'}</span></div>`
    +`<div class="r lg"><span>Baterai: <b>${fmtKwh(S.batKwh)} / ${fmtKwh(es.bat.cap)}</b></span><span>Cas Surya: <b style="color:var(--ok)">+${fmtKwh(es.solarChargeKw)}/j</b> (${Math.round(es.sunRatio*100)}% zona)</span><span>BBM Genset: <b>${(S.fuel||0).toFixed(1)} L</b></span><span>Pemanen: <b>${S.harvUnits.length} unit</b> (Gen-${S.harvLv||0})</span><span>Tarif: <b>${fmt(es.rate)}/kWh</b></span></div>`
    +`<div class="bar"><i style="width:${Math.min(100,(S.batKwh/Math.max(1,es.bat.cap))*100)}%"></i></div>`
  );

  put($('#ctl'),
    `<button data-a="pause" class="sm ${S.pause?'on':''}">${S.pause?'Lanjut':'Jeda'}</button>`
    +[1,4,16,64,128,256,512].map(x=>`<button data-a="spd" data-i="${x}" class="sm ${S.spd===x?'on':''}">${x}x</button>`).join('')
    +`<button data-a="cof" class="sm">Ngopi +40</button>`
    +`<button data-a="bI" class="sm ${S.bI?'on':''}">Cuan x2</button>`
    +`<button data-a="bC" class="sm ${S.bC?'on':''}">Ramai x2</button>`
    +`<button data-a="mute" class="sm">${S.mute?'Suara: Off':'Suara: On'}</button>`
  );

  const secCards=SECTORS.map(sc=>{
    const cnt=S.sec[sc.id]||0;
    const kwTot=cnt*sc.kwPer;
    return `<div class="card ${sc.cls}">
      <div class="r" style="justify-content:space-between"><b>${sc.n}</b><span class="chip">${fmtNum(cnt)}</span></div>
      <div class="lg">Beban sektor: <b>${fmtW(kwTot*1000)}</b></div>
      <div class="lg">Target maks: ${fmtNum(sc.max)}</div>
    </div>`;
  });

  const allCards=secCards.concat(S.sampleHouses.map(sh=>`<div class="card ${sh.cls}">
    <div class="r" style="justify-content:space-between"><b>${sh.n}</b><span class="lg">${sh.sec}</span></div>
    <div class="r"><span class="chip" style="color:var(--el)">⚡ ${fmtKwh(sh.usedKwh||0)}</span><b>${fmt(sh.bill||0)}</b></div>
  </div>`));

  const perCard=9,maxCP=Math.max(0,Math.ceil(allCards.length/perCard)-1);
  if(cardPage>maxCP)cardPage=maxCP;
  put($('#stpg'),maxCP>0?`${B('cpg',-1,'◀',cardPage<=0,'sm')}<span>${cardPage+1}/${maxCP+1}</span>${B('cpg',1,'▶',cardPage>=maxCP,'sm')}`:`<span class="lg">${fmtNum(totBld)} bangunan</span>`);
  put($('#sts'),allCards.slice(cardPage*perCard,(cardPage+1)*perCard).join(''));

  put($('#tb'),[['res','Riset (1000+)'],['sol','Pemanen Surya'],['grid','Jaringan & Negara'],['gen','Genset & BBM'],['pg','Teknisi'],['bk','Bank'],['rh','Riwayat'],['lg','Catatan']].map(x=>`<button data-a="tab" data-i="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join(''));
  put($('#side'),side());
}

let last=performance.now(),acc=0;
setInterval(()=>{
  const n=performance.now();let dt=(n-last)/1000;last=n;if(dt>1)dt=1;
  if(!S.pause){acc+=dt*2*S.spd;while(acc>=1){step();acc--}}
  render();
},100);

window.getState=()=>S;
window.applyCloud=o=>{if(o&&o.T!==undefined){S=migrate(o);_m=-1;rc=0;cardPage=0;subPage=0;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}};
window.addEventListener('pagehide',save);
render();
</script>
<script type="module" src="./cloud.js"></script></body></html>
