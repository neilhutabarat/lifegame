<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rental PS & Life Simulator (2010–Now) • Oneilverse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-theme">

<div class="app-shell">
  <!-- 1. TOP HUD TERKUNCI (TANPA SCROLL SAMPING DI HP) -->
  <header class="top-hud-locked">
    <div class="hud-bar-top">
      <button class="hud-user-btn" onclick="openCharacterCreationModal()" title="Karakter / Reset">
        👤 <span id="hudPlayerBadge">Neil (12 Thn)</span>
      </button>
      <div class="hud-clock-box">
        <b id="hudDateTime">Jum, 1/1/2010 • 08:00</b>
        <small id="hudCityUmr">Jambi • $1=Rp9.090</small>
      </div>
      <button id="btnToggleOpen" class="hud-open-btn success" onclick="toggleRentalOpenStatus()">🟢 BUKA</button>
    </div>

    <div class="hud-bar-controls">
      <div class="speed-controls">
        <button id="btnPause" class="speed-btn" type="button" onclick="togglePause()">⏸️</button>
        <button class="speed-btn active" type="button" data-speed="1" onclick="setSpeed(1)">1x</button>
        <button class="speed-btn" type="button" data-speed="2" onclick="setSpeed(2)">2x</button>
        <button class="speed-btn" type="button" data-speed="4" onclick="setSpeed(4)">4x</button>
        <button class="speed-btn" type="button" data-speed="8" onclick="setSpeed(8)">8x</button>
      </div>
      <div class="hud-mini-tools">
        <button type="button" onclick="manualCleanShop()">🧹 <span id="hudClean">100%</span></button>
        <button type="button" id="btnSoundToggle" onclick="toggleSound()">🔊</button>
        <button type="button" onclick="openCloudSyncModal()">☁️</button>
      </div>
    </div>

    <!-- GRID 3x2 STAT KEUANGAN & ANTREAN (TANPA SCROLL SAMPING!) -->
    <div class="hud-stats-grid">
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Laci Kasir</span>
        <b id="hudLaci" style="color:#c084fc;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Dompet</span>
        <b id="hudHand" style="color:#4ade80;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openBankTransferModal()">
        <span>Bank</span>
        <b id="hudBank" style="color:#38bdf8;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openDrawerTab('agen_ppob')">
        <span>Saldo Pulsa</span>
        <b id="hudPpob" style="color:#fbbf24;">Rp 0</b>
      </div>
      <div class="stat-cell" onclick="openDrawerTab('finance')">
        <span>Token PLN</span>
        <b id="hudKwh">45.0 kWh</b>
      </div>
      <div class="stat-cell" onclick="spawnIncomingCustomer()">
        <span>Ruang Tunggu</span>
        <b style="color:#38bdf8;">+<span id="lblQueueCount">0</span> Antre</b>
      </div>
    </div>
  </header>

  <!-- 2. AREA UTAMA RUANGAN & BILLING 20 SLOT (TERKUNCI, TIDAK BISA GESER SAMPING, TAMPIL GAMBAR PS+TV & BAR MUNDUR BILLING) -->
  <main id="studio3dViewport" class="room-board-locked"></main>

  <!-- 3. TICKER AKTIVITAS SINGKAT -->
  <div id="liveToastBar" class="live-toast-bar" onclick="openDrawerTab('logs')">
    📢 Tap slot ruangan untuk pasang PS/TV, atau gunakan menu dock di bawah.
  </div>

  <!-- 4. DOCK BAWAH 5x2 TERKUNCI (TANPA SCROLL) -->
  <nav class="bottom-dock-locked">
    <button class="dock-btn" type="button" data-tab="slots" onclick="openDrawerTab('slots')"><span>🎮</span><small>20 Slot</small></button>
    <button class="dock-btn" type="button" data-tab="store_hw" onclick="openDrawerTab('store_hw')"><span>🛒</span><small>Toko PS</small></button>
    <button class="dock-btn" type="button" data-tab="discs" onclick="openDrawerTab('discs')"><span>💿</span><small>Kaset</small></button>
    <button class="dock-btn" type="button" data-tab="cashier_stik" onclick="openDrawerTab('cashier_stik')"><span>🔧</span><small>Stik/Kasir</small></button>
    <button class="dock-btn" type="button" data-tab="agen_ppob" onclick="openDrawerTab('agen_ppob')"><span>📦</span><small>Agen/Pulsa</small></button>
    <button class="dock-btn" type="button" data-tab="employees" onclick="openDrawerTab('employees')"><span>👷</span><small>Karyawan</small></button>
    <button class="dock-btn" type="button" data-tab="finance" onclick="openDrawerTab('finance')"><span>🏦</span><small>Bank/PLN</small></button>
    <button class="dock-btn" type="button" data-tab="automotive" onclick="openDrawerTab('automotive')"><span>🛵</span><small>Motor/HP</small></button>
    <button class="dock-btn" type="button" data-tab="life" onclick="openDrawerTab('life')"><span>🧬</span><small>Hidup</small></button>
    <button class="dock-btn" type="button" data-tab="logs" onclick="openDrawerTab('logs')"><span>📜</span><small>Catatan</small></button>
  </nav>
</div>

<!-- SLIDE-UP DRAWER MENU -->
<div id="appDrawerBackdrop" class="drawer-backdrop" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer-sheet">
    <div class="drawer-header">
      <h2 id="drawerTitle">📱 Menu Manajemen</h2>
      <button class="drawer-close" type="button" onclick="closeDrawer()">✕ Tutup</button>
    </div>
    <div id="rightPanelContent" class="drawer-body"></div>
  </div>
</div>

<!-- HIDDEN LOG STORAGE -->
<div id="logBox" style="display:none;"></div>

<!-- MODAL POPUP -->
<div id="customModalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeCustomModal()">
  <div class="modal">
    <h3 id="customModalTitle" style="margin:0;color:var(--accent);font-size:0.95rem;">Judul</h3>
    <div id="customModalBody" style="display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;"></div>
    <div id="customModalFooter" style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="catalog_games.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="world3d.js"></script>
</body>
</html>
