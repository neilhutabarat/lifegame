function holName(y,m,d){
  if(m===0&&d===1)return 'Tahun Baru Masehi';

}

let _m=-1,_f=1;
const fxAt=yr=>{
  let f=1,y=Math.max(0,yr-START_YEAR);
  for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;
  return f;
};
const fx=()=>{
  const dt=curDate(),m=(dt.getFullYear()-START_YEAR)*12+dt.getMonth();
  if(m!==_m){_m=m;let f=1,y=Math.floor(m/12);for(let i=0;i<y;i++)f*=1+(INF[i]!==undefined?INF[i]:3)/100;f*=1+(INF[y]!==undefined?INF[y]:3)/100*(m%12)/12;_f=f}
  return _f;
};

const Py=(n,yr)=>Math.round(n*(fx()/fxAt(yr||START_YEAR))/50)*50;

  if(!isInherited()&&S.dad){
    let bestMotor=0;
    VEH.filter(v=>v.role==='ojek'&&(S.vehs[v.id]||0)>0).forEach(v=>{if(v.incDay>bestMotor)bestMotor=v.incDay});
    const base=bestMotor>0?P(bestMotor):P(S.dad.baseOjek);
    const wxFactor=S.wx==='hujan'?0.65:S.wx==='mendung'?0.9:1.05;
    ojekGross=Math.round(base*wxFactor*(0.85+Math.random()*0.3));
    if(S.dad.cheating)ojekGross=Math.round(ojekGross*0.5); // suami selingkuh -> setorannya dipotong jajan selingkuhan!
    const setor80=Math.round(ojekGross*0.80);
    S.m+=setor80;S.moOjek=(S.moOjek||0)+setor80;
    if(S.spd<=64)log('Suami setor ojek (80%): +'+fmt(setor80)+(S.wx==='hujan'?' (hujan tarikan sepi)':'')+'.');
  }else if(isInherited()&&S.mar&&S.pt){
    const base=P(S.pt.ojekDay||95000);
    const wxFactor=S.wx==='hujan'?0.65:1.0;
    const setor80=Math.round(base*wxFactor*0.80);
    S.m+=setor80;S.moOjek=(S.moOjek||0)+setor80;
  }

  // 3. Pemasukan Harian Rental Motor/Mobil & Angkutan/Travel
  let fleetDay=0;
  VEH.forEach(v=>{
    const cnt=S.vehs[v.id]||0;
    if(cnt>0&&(v.role==='rental'||v.role==='angkut')){
      fleetDay+=cnt*P(v.incDay)*(S.wx==='hujan'&&v.role==='rental'?0.8:1);
    }
  });
  if(fleetDay>0){
    const netFleet=Math.round(fleetDay*0.85);
    S.b+=netFleet;S.inc+=netFleet;
  }

  // 4. Karyawan (tanpa tingkat jenuh)
  S.emps.forEach(e=>{
    if(e.off>0)e.off--;
    if(e.sick>0){
      e.sick--;
      if(e.sick===0)log(e.n+' sudah sembuh dan kembali kerja.');
      return;
    }
    const hrs=shiftHours(e);
    const over=Math.max(0,hrs-12);
    if(Math.random()<(.002+over*.003)){
      e.sick=1+Math.floor(Math.random()*2);
      log(e.n+' sakit ('+e.sick+' hari). Kamu menggantikan shift-nya.');
    }
  });

  // 5. Keharmonisan & Risiko Suami Selingkuh jika Rumah Tangga Berantakan
  if(!isInherited()&&S.mom){
    S.mom.love=Math.max(0,S.mom.love-(S.stam<30?2:0.5));
    if(S.mom.love<30&&!S.dad.cheating&&Math.random()<.08){
      S.dad.cheating=true;
      log('⚠️ Rumah tangga berantakan! Suami ketahuan selingkuh di pangkalan ojek & setorannya berkurang!');
      snd('warn');
    }
  }
}

function monthEnd(){
  let inc=0;
  const pay=n=>{if(n>0)spend(n)};
  const dt=curDate(),prev=new Date(dt.getFullYear(),dt.getMonth()-1,1);
  const y=dt.getFullYear();

  if(y>=2014&&!S.handedOver){
    S.handedOver=true;
    log('🎉 TAHUN 2014 (Usia 12 Tahun): Orang tuamu mewariskan bisnis Rental PS & seluruh aset kepada '+S.kidName+'!');
    snd('month');
  }

  // Biaya bulanan: gaji karyawan, sewa tempat, listrik/air rumah, servis kendaraan, perawatan kontrakan
  const totalGaji=S.emps.reduce((z,e)=>z+e.sal,0);
  pay(totalGaji);
  pay(P(S.rent));
  pay(monthlyUtilityCost());

  let vehMaint=0;
  VEH.forEach(v=>{const cnt=S.vehs[v.id]||0;if(cnt>0)vehMaint+=cnt*P(v.maint)});
  if(vehMaint>0)pay(vehMaint);

  // Pemasukan & perawatan kontrakan/kos
  let propNet=0;
  PROP.forEach(pr=>{
    const cnt=S.props[pr.id]||0;
    if(cnt>0)propNet+=cnt*(P(pr.rentMo)-P(pr.maint));
  });
  if(propNet>0){S.b+=propNet;inc+=propNet;log('Sewa kontrakan/kos masuk: +'+fmt(propNet)+'.')}

  // Arisan Kampung
  if(S.arisan>0){
    const iuran=P(200000);
    pay(iuran);
    if(Math.random()<.12){
      const menang=P(2400000);
      S.m+=menang;inc+=menang;
      log('🎉 Dapat kocokan Arisan Kampung: +'+fmt(menang)+'!');
    }
  }

  // Cicilan bank & ruko
  if(S.ln){
    if(have()>=S.ln.pay)pay(S.ln.pay);
    else{spend(Math.round(S.ln.pay*1.02));rep(-.1);log('Cicilan bank telat, kena denda 2%.')}
    if(--S.ln.left<=0)S.ln=null;
  }
  if(S.propLn){
    if(have()>=S.propLn.pay)pay(S.propLn.pay);
    else{spend(Math.round(S.propLn.pay*1.02));log('Cicilan ruko telat, kena denda 2%.')}
    if(--S.propLn.left<=0){S.propLn=null;log('Cicilan ruko LUNAS!')}
  }

  // Kehamilan & Selingkuh (Era Ibu & Era Anak Dewasa)
  if(!isInherited()){
    if(S.mom.preg>0){
      if(--S.mom.preg===0){
        if(!S.bpjs)pay(P(2500000));
        if(S.mom.affairPreg){
          S.mom.affairPreg=0;
          if(Math.random()<.55){
            S.mom.love=Math.max(5,S.mom.love-45);
            S.mom.affair=null;
            log('😱 Bayi lahir dan KETAHUAN suami bukan anaknya! Suami marah besar & keharmonisan hancur!');
            snd('warn');
          }else{
            S.mom.secretKid=(S.mom.secretKid||0)+1;
            log('🤫 Bayi lahir! Suami tidak curiga dan mengira itu anaknya sendiri.');
          }
        }else{
          log('Adik bayi lahir sehat!');
        }
      }
    }else if(S.mom.affair&&Math.random()<(S.kb?.01:.14)){
      S.mom.preg=9;S.mom.affairPreg=1;
      log(S.kb?'⚠️ KB kebobolan! Kamu hamil dari selingkuhan!':'⚠️ Kamu lupa aktifkan KB dan HAMIL dari selingkuhan!');
      snd('warn');
    }
  }else if(isInherited()){
    if(S.preg>0){
      if(--S.preg===0){
        if(!S.bpjs)pay(P(3000000));
        if(S.affairPreg){
          S.affairPreg=0;
          if(Math.random()<.55){
            if(S.pt)S.pt.love=Math.max(5,S.pt.love-50);
            S.affair=null;
            log('😱 Anak lahir dan KETAHUAN selingkuh! Pasanganmu murka!');
            snd('warn');
          }else{
            S.kids=(S.kids||0)+1;
            log('🤫 Anak lahir! Tidak ketahuan selingkuh.');
          }
        }else{
          S.kids=(S.kids||0)+1;
          log('Anakmu lahir sehat!');
        }
      }
    }else if(S.affair&&Math.random()<(S.kb?.01:.14)){
      S.preg=9;S.affairPreg=1;
      log(S.kb?'⚠️ KB kebobolan! Kamu hamil dari selingkuhan!':'⚠️ Lupa aktifkan KB! Kamu HAMIL dari selingkuhan!');
      snd('warn');
    }
  }

  // Bunga tabungan & deposito
  if(S.b>0){const i=Math.round(S.b*.0033);S.b+=i;inc+=i}
  if(S.dep.length){
    let depInt=0;
    S.dep.forEach(d=>{
      const r=depRate(d.mo);
      depInt+=Math.round(d.amt*r);
      d.mo++;
    });
    if(depInt>0){S.b+=depInt;inc+=depInt;log('Bunga deposito masuk '+fmt(depInt)+'.')}
  }

  V.forEach(v=>{if(S.v[v.id]){const g=P((v.a+Math.random()*(v.b-v.a))*(.6+S.rr/5)-v.u);S.b+=g;inc+=g}});

  const tx=taxInfo(S.inc);
  if(tx.amt>0){pay(tx.amt);log('Bayar pajak ('+tx.lbl+'): '+fmt(tx.amt)+'.')}
  S.yrInc=(S.yrInc||0)+S.inc;
  if(dt.getMonth()===0)S.yrInc=0;

  (S.rec=S.rec||[]).push({y:prev.getFullYear(),m:prev.getMonth(),w:S.inc,o:inc+(S.moOjek||0),x:S.exp,c:S.cm||0,h:S.hm||0});
  S.cm=0;S.hm=0;
  log('Rekap '+BLN[prev.getMonth()]+' '+prev.getFullYear()+': Rental '+fmt(S.inc)+', Ojek/Lain '+fmt(inc+(S.moOjek||0))+', Keluar '+fmt(S.exp)+'.');
  snd('month');S.inc=0;S.exp=0;S.moFood=0;S.moOjek=0;save();
}

function step(){
  S.T++;
  const h=Math.floor(S.T/60)%24,mi=S.T%60;
  if(mi===0&&h%4===0)updateWeather();
  if(S.T%1440===0&&day()>0){
    dayEnd();
    if(curDate().getDate()===1)monthEnd();
  }
  const onD=empOnDuty();
  const sleeping=(h>=22||h<6);

  if(inSchool()&&S.open&&!onD){
    S.open=false;log('Jam sekolah mulai! Rental tutup sementara sampai pulang sekolah.');
  }

  if(sleeping||onD){
    S.stam=Math.min(100,S.stam+16/60);
  }else if(S.open){
    S.stam-=drain()/60;
    if(S.stam<30&&S.T-S.cf>=90&&have()>=10000){
      spend(10000);S.stam=Math.min(100,S.stam+35);S.cf=S.T;
      if(S.spd<=64)log('Stamina rendah, otomatis ngopi (+35).');
    }
  }else{
    S.stam=Math.min(100,S.stam+10/60);
  }

  if(S.stam<=0){
    S.stam=0;S.faint=true;
    if(!onD){S.open=false;snd('warn');log('Kecapekan! Rental tutup sementara.')}
  }
  if(S.faint&&S.stam>=40){S.faint=false}
  if(mi===0)power();
  if(S.busy>0&&--S.busy===0){S.m+=S.jp;S.inc+=S.jp;log('Pulang kerja, dapat '+fmt(S.jp)+'.')}
  if(S.out)return;

  if(S.open){
    // Razia Satpol PP jika buka pagi jam sekolah tanpa izin usaha
    if(mi===30&&h===9&&!isHol()&&!S.izin&&Math.random()<.015){
      const denda=P(350000);
      spend(denda);
      log('🚨 Razia Satpol PP! Banyak anak bolos main PS & belum punya Izin Usaha, kena denda '+fmt(denda)+'.');
      snd('warn');
    }
    const holM=isHol()?1.35:1;
    const rainM=S.wx==='hujan'?1.28:1; // Kalau hujan anak-anak banyak berteduh main PS!
    const wt=(h>=15&&h<23?1:h>=8&&h<15?.6:h>=23||h<3?.4:.15)*holM*rainM;
    S.st.forEach(s=>{
      if(s.brk)return;
      const kc=K[s.k],gms=ownedGames(kc.pf);
      if(gms.length===0)return;
      const gBonus=1+Math.min(.5,(gms.length-1)*.1);
      if(Math.random()<.35*wt*(.5+S.rr/5)*dm(s.k)*gBonus*(S.bC?2:1)/60){
        const g=gms[Math.random()*gms.length|0];
        snd('bell');
        S.q.push({n:NM[Math.random()*NM.length|0],pf:kc.pf,act:g.n.replace(' (Ori)',''),want:60+Math.random()*180|0,used:0,wait:0,o:[],ph:'q'});
      }
    });
  }
  for(const c of S.q.slice()){
    c.wait++;
    const s=S.st.find(x=>!x.c&&!x.brk&&K[x.k].pf===c.pf&&ownedGames(K[x.k].pf).length>0);
    if(s){
      s.c=c;c.k=s.k;c.r=S.pr[s.k];
      c.q=(s.tv>=0?TV[s.tv].q:0);
      c.ph='p';
      S.q.splice(S.q.indexOf(c),1);
    }else if(c.wait>75){
      S.q.splice(S.q.indexOf(c),1);rep(-.04);
    }
  }
  S.st.forEach((s,i)=>{
    const c=s.c;if(!c)return;
    if(c.ph==='p'){
      c.used++;
      if(Math.random()<1/45)order(c);
      if(Math.random()<.00022){
        const pId=K[s.k].pt;
        if((S.parts[pId]||0)>0){
          S.parts[pId]--;
          if(S.spd<=64)log(PT[pId].n+' di '+K[s.k].n+' rusak, diganti stok cadangan (sisa '+S.parts[pId]+').');
        }else{
          s.brk=true;c.ph='d';collect(i);
          log(PT[pId].n+' di '+K[s.k].n+' RUSAK! Stok cadangan habis, beli di tab Game.');
          snd('warn');return;
        }
      }
      if(c.used>=c.want){c.ph='d';collect(i)}
    }else{
      c.dw=(c.dw||0)+1;
      if(onD&&Math.random()<Math.min(1,.3*activeEmps().length))collect(i);
      else if(c.dw>120){log(c.n+' kabur tanpa bayar '+fmt(bill(c))+'!');rep(-.1);s.c=null}
    }
  });
}

function collect(i){
  const s=S.st[i],c=s&&s.c;if(!c||c.ph!=='d')return;
  const b=bill(c)*mult();S.m+=b;S.inc+=b;rep(.03+(c.q||0));
  S.cm=(S.cm||0)+1;S.hm=(S.hm||0)+c.used;
  (S.hist=S.hist||[]).unshift({n:c.n,u:K[c.k].n+' ('+(c.act||'Main')+')',m:c.used,b:b,d:dstr(),o:c.o.length});
  S.hist.length=Math.min(S.hist.length,60);snd('coin');s.c=null;
}

const A={
  tog(){
    if(S.faint&&!empOnDuty())return log('Masih lemas, istirahat dulu.');
    if(inSchool()&&!empOnDuty())return log('Sedang jam sekolah (selesai jam '+schoolEnd()+':00). Rekrut karyawan jika ingin tetap buka.');
    if(!S.st.length)return log('Belum ada unit untuk disewakan.');
    S.open=!S.open;log(S.open?'Rental PS BUKA.':'Rental PS TUTUP.');
  },
  pause(){S.pause=!S.pause},
  spd(i){S.spd=+i},
  tab(i){S.tab=i;subTab=''},
  stab(i){subTab=i},
  cof(){
    if(S.T-S.cf<60||S.stam>=100)return log('Stamina masih segar.');
    if(!buy(10000))return;
    S.stam=Math.min(100,S.stam+35);S.cf=S.T;log('Ngopi dulu, stamina +35.');
  },
  coll(i){if(S.busy>0&&!empOnDuty())return log('Lagi kerja di luar.');collect(+i)},
  bu(v){
    const[k,j]=v.split(':'),c=K[k],t=j!=null?TV[j]:null;
    if(c.yr>curYear())return log(c.n+' baru rilis tahun '+c.yr+'.');
    if(t&&t.yr>curYear())return log('TV ini belum rilis.');
    if(used()>=S.cap)return log('Ruangan penuh.');
    const cost=Py(c.p,c.yr)+(t?Py(t.p,t.yr):0);
    if(!buy(cost))return;
    S.st.push({k,tv:t?+j:-1,brk:false,c:null});
    log('Beli '+c.n+(t?' + TV '+t.n:'')+'.');
    if(!ownedGames(c.pf).length)log('Beli game ori untuk '+c.pf.toUpperCase()+' di tab Game!');
  },
  ed(i){editIdx=editIdx===+i?-1:+i},
  sell(i){
    const s=S.st[+i];if(!s||s.c)return log('Tunggu pelanggan selesai main dulu.');
    const v=unitVal(s);S.m+=v;S.st.splice(+i,1);editIdx=-1;snd('coin');
    log('Jual second '+K[s.k].n+' dapat '+fmt(v)+'.');
  },
  upk(i){
    const s=S.st[+i];if(!s||s.c)return;
    const c=K[s.k];if(!c.next)return;
    const nk=K[c.next];
    if(nk.yr>curYear())return log(nk.n+' baru rilis tahun '+nk.yr+'.');
    if(!buy(Py(c.up,nk.yr)))return;
    s.k=c.next;log('Upgrade konsol jadi '+nk.n+'!');
  },
  uptv(v){
    const[idx,j]=v.split(':'),s=S.st[+idx];if(!s||s.c||s.tv<0||+j<=s.tv)return;
    if(TV[+j].yr>curYear())return log('TV ini belum rilis.');
    const cost=Math.max(100000,Py(TV[+j].p,TV[+j].yr)-Math.round(Py(TV[s.tv].p,TV[s.tv].yr)*.5));
    if(!buy(cost))return;
    s.tv=+j;log('Upgrade TV unit #'+(+idx+1)+' jadi '+TV[s.tv].n+'.');
  },
  fix(i){
    const s=S.st[+i];if(!s||!s.brk)return;
    const pId=K[s.k].pt;
    if((S.parts[pId]||0)<=0)return log('Stok '+PT[pId].n+' kosong! Beli dulu di tab Game.');
    S.parts[pId]--;s.brk=false;log(K[s.k].n+' sudah diperbaiki.');
  },
  bgm(id){
    const g=GM.find(x=>x.id===id);if(!g||S.games[id]||g.yr>curYear())return;
    if(buy(Py(g.p,g.yr))){S.games[id]=1;log('Beli game ori: '+g.n+'.')}
  },
  bpt(v){
    const[id,q]=v.split(':'),qty=Math.max(1,+q||1);
    const p=PT[id];if(!p||p.yr>curYear())return;
    if(buy(Py(p.p,p.yr)*qty)){S.parts[id]=(S.parts[id]||0)+qty;log('Beli cadangan '+p.n+' +'+qty+'.')}
  },
  eq(i){if(S.eq[i])return;if(buy(EQ[i][1]))S.eq[i]=1},
  bs(v){
    const[id,q]=v.split(':'),qty=Math.min(1000,Math.max(100,+q||100));
    const it=I.find(x=>x.id===id);if(!it)return;
    if(buy(P(it.c)*qty)){S.stock[id]+=qty;log('Beli stok '+it.n+' +'+qty+'.')}
  },
  sp(v){
    const[id,q]=v.split(':'),qty=Math.max(5,+q||5);
    const base=id==='gas'?12000:8000;
    if(buy(P(base)*qty)){S.sup[id]+=qty;log('Beli '+(id==='gas'?'Gas 3 kg':'Air galon')+' +'+qty+'.')}
  },
  tok(n){if(buy(P(n*900)+2500)){S.kwh+=+n;S.out=0}},
  gen(){if(!S.gen&&buy(4000000))S.gen=true},
  mv(i){
    if(i==='r'&&S.cap<35&&buy(4e6)){S.cap=35;S.rent=2e6}
    if(i==='b'&&S.cap<80&&buy(450e6)){S.cap=80;S.rent=0;S.propLn=null;log('Beli ruko tunai 80 slot!')}
    if(i==='bc'&&S.cap<80&&!S.propLn){
      if(buy(90e6)){S.cap=80;S.rent=0;S.propLn={pay:8200000,left:60};log('Kredit ruko disetujui! DP Rp 90 jt, cicilan Rp 8,2 jt/bln x 60 bln.')}
    }
  },
  bveh(id){
    const v=VEH.find(x=>x.id===id);if(!v||v.yr>curYear())return;
    if(buy(Py(v.p,v.yr))){S.vehs[id]=(S.vehs[id]||0)+1;log('Beli '+v.n+'!')}
  },
  bprop(id){
    const pr=PROP.find(x=>x.id===id);if(!pr)return;
    if(buy(P(pr.p))){S.props[id]=(S.props[id]||0)+1;log('Beli properti: '+pr.n+'!')}
  },
  izin(){if(!S.izin&&buy(P(2500000))){S.izin=true;log('Izin Usaha & HO resmi terbit! Aman dari razia Satpol PP.')}},
  bpjs(){S.bpjs=!S.bpjs},
  arisan(){S.arisan=S.arisan?0:1},
  tourney(){
    if(S.T-S.dt<1440)return log('Turnamen PS cukup diadakan sehari sekali.');
    if(!S.st.length)return log('Belum ada unit konsol.');
    if(!buy(P(150000)))return;
    S.dt=S.T;rep(.15);
    const hadiah=P(450000);
    S.m+=hadiah;S.inc+=hadiah;
    log('🏆 Turnamen PS Kampung sukses! Reputasi naik & pemasukan tiket/jajan +'+fmt(hadiah)+'.');
  },

  // Keluarga, Keharmonisan, & Selingkuh
  date(){
    if(!buy(P(100000)))return;
    if(!isInherited()){
      S.mom.love=Math.min(100,S.mom.love+10);
      if(S.dad.cheating&&S.mom.love>=75){S.dad.cheating=false;log('Suami insaf & kembali setia setelah hubungan membaik!')}
      log('Jalan & makan malam bareng suami, keharmonisan naik ('+Math.round(S.mom.love)+'%).');
    }else if(S.pt){
      S.pt.love=Math.min(100,S.pt.love+10);
      log('Kencan dengan pasangan, keharmonisan naik.');
    }
  },
  findaffair(){
    const richNames=['Ko Hendra (Bos Elektronik)','Pak Budi (Juragan Sawit)','Ko Kevin (Dealer Mobil)','Koh Andre (Pengusaha Tambang)','Pak Rudi (Kontraktor)'];
    const n=richNames[Math.random()*richNames.length|0];
    const gift=P(650000+Math.floor(Math.random()*900000));
    if(!isInherited()){
      S.mom.affair={n,gift};
      log('💋 Kenalan diam-diam dengan '+n+' (lebih kaya dari suami).');
    }else{
      S.affair={n,gift};
      log('💋 Punya selingkuhan tajir: '+n+'.');
    }
  },
  dateaffair(){
    const af=!isInherited()?S.mom.affair:S.affair;
    if(!af)return;
    S.m+=af.gift;
    if(!isInherited()){
      S.mom.love=Math.max(0,S.mom.love-6);
      log('💋 Jalan diam-diam dengan '+af.n+', dikasih uang jajan +'+fmt(af.gift)+'!'+(S.kb?' (KB aktif)':' (⚠️ KB tidak aktif!)'));
    }else{
      if(S.pt)S.pt.love=Math.max(0,S.pt.love-6);
      log('💋 Jalan diam-diam dengan '+af.n+', dikasih uang jajan +'+fmt(af.gift)+'!');
    }
  },
  endaffair(){
    if(!isInherited())S.mom.affair=null;
    else S.affair=null;
    log('Hubungan gelap diakhiri.');
  },
  kb(){S.kb=S.kb?0:1},

  // Pasangan era anak (setelah usia 18)
  fd(){
    if(!isInherited()||kidAge()<18||S.pt)return;
    const x=Math.random(),s=x<.35?[85000,120000,'sederhana']:x<.85?[140000,220000,'biasa']:[350000,650000,'mapan'];
    S.pt={n:['Andre','Hendra','Kevin','Rudi','Tommy'][Math.random()*5|0],ojekDay:Math.round(s[0]+Math.random()*(s[1]-s[0])),cls:s[2],love:30};
  },
  mr(){if(!S.pt||S.mar||kidAge()<19||S.pt.love<60||!buy(10e6))return;S.mar=1;log('Kalian menikah! Mulai besok dapat setoran 80% penghasilan suami.')},
  bk(){if(!S.pt)return;if(S.mar)spend(5e6);S.mar=0;S.pt=null;S.preg=0},

  // Pegawai
  hi(){
    const id=S.empSeq++,n=EMPNM[(id-1)%EMPNM.length]+' #'+id;
    const st=S.emps.length%2===0?8:20,en=(st+12)%24;
    S.emps.push({id,n,start:st,end:en,sal:P(850000),sick:0,off:0,offMo:-1});
    log('Rekrut '+n+' (shift '+String(st).padStart(2,'0')+':00–'+String(en).padStart(2,'0')+':00).');
  },
  fi(id){S.emps=S.emps.filter(e=>e.id!==+id)},
  es(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.start=(e.start+(+d)+24)%24},
  ee(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.end=(e.end+(+d)+24)%24},
  esal(v){const[id,d]=v.split(':'),e=S.emps.find(x=>x.id===+id);if(e)e.sal=Math.max(200000,e.sal+(+d))},
  eoff(id){
    const e=S.emps.find(x=>x.id===+id);if(!e)return;
    const cm=(curYear()-START_YEAR)*12+curDate().getMonth();
    if(e.offMo===cm)return log(e.n+' sudah dapat jatah libur bulan ini.');
    if(e.sick>0)return log(e.n+' sedang sakit.');
    e.off=1;e.offMo=cm;
    log(e.n+' diberi libur 1 hari.');
  },

  // Bank
  dep(n){const t=Math.min(+n,S.m);S.m-=t;S.b+=t},
  wd(n){const t=Math.min(+n,Math.max(S.b,0));S.b-=t;S.m+=t},
  mkdep(n){
    n=+n;if(S.b<n)return log('Saldo rekening kurang untuk deposito '+fmt(n)+'.');
    S.b-=n;S.dep.push({id:Date.now()+Math.random(),amt:n,mo:0});
    log('Buka deposito '+fmt(n)+' (bunga awal 0,5%/bln, naik +0,1% tiap bulan).');snd('buy');
  },
  cldep(idx){
    const d=S.dep[+idx];if(!d)return;
    S.b+=d.amt;S.dep.splice(+idx,1);snd('coin');
    log('Cairkan deposito '+fmt(d.amt)+' ke rekening.');
  },
  ln(n){
    if(S.ln)return log('Masih ada cicilan berjalan.');
    n=+n;const r=.16/12;S.ln={pay:Math.round(n*r/(1-Math.pow(1+r,-12))),left:12};S.b+=n;log('Pinjaman cair '+fmt(n)+'.');
  },
  job(i){
    const j=J[i];if(S.busy>0)return log('Masih bekerja di luar.');
    if(isInherited()&&kidAge()<j.age)return log('Belum cukup umur untuk pekerjaan ini.');
    if(inSchool())return log('Sedang jam sekolah.');
    if(S.open&&activeEmps().length<Math.max(1,j.e))return log('Tutup rental dulu, atau pastikan ada karyawan jaga.');
    if(S.stam<j.st+10)return log('Terlalu capek untuk kerja.');
    S.stam-=j.st;S.busy=j.h*60;S.jp=P(j.pay);log('Berangkat kerja: '+j.n+' ('+j.h+' jam).');
  },
  mk(){Object.keys(K).forEach(k=>S.pr[k]=Py(K[k].r,K[k].yr));I.forEach(i=>S.pr[i.id]=P(i.p))},
  mute(){S.mute=!S.mute;if(!S.mute)snd('coin')},
  hv(i){S.hv=i},
  rst(){if(!rc){rc=1;return}rc=0;editIdx=-1;subTab='';fresh();save()}
};

          +`<div class="row">${B('date','','Kencan',0,'sm')}${B('mr','','Menikah 10jt (19+, hub 60)',S.mar||ka<19,'sm')}</div>`

  if(t==='kl'){

  }

  if(t==='jb'){
    h=`<div class="lg" style="margin-bottom:4px">Kerja di luar memakai stamina & waktu. Jika rental buka, pastikan ada karyawan jaga.</div>`
      +J.map((j,i)=>R(j.n,j.h+'j · '+fmt(P(j.pay))+' · stam -'+j.st+(isInherited()?' · usia '+j.age+'+':'')+(j.e?' · '+j.e+' kry':''),'job',i,'Ambil',S.busy>0||(isInherited()&&kidAge()<j.age)||inSchool())).join('');
  }

  if(t==='hg'){
    h=`<div class="row"><span class="lg">Harga pasar naik tiap tahun sesuai inflasi.</span>${B('mk','','Samakan Pasar',0,'sm')}</div>`
      +Object.keys(K).filter(k=>K[k].yr<=yr).map(k=>`<div class="row"><span>${K[k].n} <span class="lg">(pasar ${fmt(Py(K[k].r,K[k].yr))}/j)</span></span><input type="number" data-p="${k}" value="${S.pr[k]}"></div>`).join('')
      +I.map(i=>`<div class="row"><span>${i.n} <span class="lg">(pasar ${fmt(P(i.p))})</span></span><input type="number" data-p="${i.id}" value="${S.pr[i.id]}"></div>`).join('');
  }

  if(t==='rh'){
    const v=S.hv||'p',rec=S.rec||[],cur={w:S.inc,o:S.moOjek||0,x:S.exp,c:S.cm||0,h:S.hm||0};
    const sum=a=>a.reduce((z,r)=>({w:z.w+r.w,o:z.o+r.o,x:z.x+r.x,c:z.c+r.c,h:z.h+r.h}),{w:0,o:0,x:0,c:0,h:0});
    const row=(l,r)=>`<div class="row"><span>${l}<br><span class="lg">${r.c} plg · ${Math.round(r.h/60)}j · rental ${fmt(r.w)} · ojek/lain ${fmt(r.o)} · keluar ${fmt(r.x)}</span></span><b style="color:${r.w+r.o-r.x<0?'var(--bad)':'var(--ok)'}">${fmt(r.w+r.o-r.x)}</b></div>`;
    h=`<div class="subtabs">${[['p','Pemain'],['b','Bulanan'],['t','Tahunan']].map(x=>B('hv',x[0],x[1],0,'sm '+(v===x[0]?'on':''))).join('')}</div>`;
    if(v==='p')h+=(S.hist||[]).map(x=>`<div class="row"><span>${x.n} · ${x.u}<br><span class="lg">${dur(x.m)} · ${x.o} psn · ${x.d}</span></span><b>${fmt(x.b)}</b></div>`).join('')||'<div class="lg">Belum ada riwayat.</div>';
    if(v==='b')h+=row('Bulan berjalan',cur)+rec.slice().reverse().map(r=>row(BLN[r.m]+' '+r.y,r)).join('');
    if(v==='t'){const ys={},yc=curYear();rec.forEach(r=>(ys[r.y]=ys[r.y]||[]).push(r));if(!ys[yc])ys[yc]=[];h+=Object.keys(ys).sort().reverse().map(y=>row('Tahun '+y+(+y===yc?' (berjalan)':''),sum(ys[y].concat(+y===yc?[cur]:[])))).join('')}
  }

  if(t==='lg'){
    h=S.log.map(l=>`<div class="lg" style="padding:3px 0;border-bottom:1px dashed var(--bd)">${l}</div>`).join('')+`<div style="margin-top:8px"><button data-a="rst" class="sm bad">${rc?'Yakin? Tap lagi':'Mulai ulang game'}</button></div>`;
  }
  return h;
}

function render(){
  const dt=curDate(),yr=curYear(),hn=holName(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const tx=taxInfo(S.inc),sk=sickEmps().length,ka=kidAge(),inh=isInherited();
  const st=S.busy>0?['KERJA '+Math.ceil(S.busy/60)+'j','var(--wr)']:S.out?['PADAM','var(--bad)']:S.faint?['CAPEK','var(--bad)']:inSchool()&&!empOnDuty()?['SEKOLAH (s/d '+schoolEnd()+':00)','var(--wr)']:S.open?['BUKA','var(--ok)']:['TUTUP','var(--mt)'];
  const roleTag=inh?'Pemilik: '+S.kidName+' ('+ka+' thn)':'Ibu Chinese & Suami Batak (Anak '+ka+' thn)';

  put($('#hd'),
    `<div class="r"><b>${fmt(S.m)}</b><span class="lg">bank ${fmt(S.b)}</span><span>${HARI[dt.getDay()]}, ${dt.getDate()} ${BLN[dt.getMonth()]} ${yr}, ${clock()}</span><span class="chip" style="color:${inh?'var(--ok)':'var(--pk)'}">${roleTag}</span><span class="chip" style="color:${st[1]}">${st[0]}</span><span>${wxIcon()}</span>${hn?`<span class="chip" style="color:var(--bad)">Libur: ${hn}</span>`:''}${sk?`<span class="chip" style="color:var(--wr)">${sk} Sakit</span>`:''}</div>`
    +`<div class="r lg"><span>Rep ★${S.rr.toFixed(1)}</span><span>Antre ${S.q.length}</span><span>Token ${S.kwh.toFixed(0)}kWh</span><span>Slot ${used()}/${S.cap}</span><span>Makan -${fmt(dailyFoodCost())}/hr</span><span>Pajak: <b>${fmt(tx.amt)}</b> (${tx.lbl})</span><span>x${fx().toFixed(2)}</span></div>`
    +`<div class="bar"><i style="width:${S.stam}%;background:${S.stam<25?'var(--bad)':'var(--ac)'}"></i></div>`
  );

  put($('#ctl'),
    `<button data-a="tog" class="sm ${S.open?'on':''}">${S.open?'Tutup':'Buka'}</button>`
    +`<button data-a="pause" class="sm ${S.pause?'on':''}">${S.pause?'Lanjut':'Jeda'}</button>`
    +[1,4,16,64,128,256,512].map(x=>`<button data-a="spd" data-i="${x}" class="sm ${S.spd===x?'on':''}">${x}x</button>`).join('')
    +`<button data-a="cof" class="sm">Ngopi +35</button>`
    +`<button data-a="bI" class="sm ${S.bI?'on':''}">Cuan x2</button>`
    +`<button data-a="bC" class="sm ${S.bC?'on':''}">Ramai x2</button>`
    +`<button data-a="mute" class="sm">${S.mute?'Suara: Off':'Suara: On'}</button>`
  );

  // Panel Avatar Karakter Keluarga (Statis, ekspresi berubah dinamis sesuai kondisi!)
  const rain=(S.wx==='hujan');
  const momMood=(S.mom.love<35||S.dad.cheating)?'sad':S.stam<35?'tired':'happy';
  const dadMood=(S.dad.cheating||S.mom.love<35)?'sad':rain?'tired':'happy';
  const kidMood=S.faint?'tired':'happy';
  let famHtml='';
  if(!inh){
    famHtml=
      `<div class="avcard">
        ${avatarSVG('mom',{mood:momMood,preg:S.mom.preg>0,rain,affair:!!S.mom.affair})}
        <div><b>${S.mom.n}</b><div class="lg">Chinese · Harmonis ${Math.round(S.mom.love)}%${S.mom.preg>0?' · Hamil '+(9-S.mom.preg)+'/9':''}${S.mom.affair?' · 💋 Selingkuh':''}</div></div>
      </div>`
      +`<div class="avcard">
        ${avatarSVG('dad',{mood:dadMood,rain,helm:true})}
        <div><b>${S.dad.n}</b><div class="lg">Batak · Ngojek (80% setor)${S.dad.cheating?' · 💔 Selingkuh':''}</div></div>
      </div>`
      +`<div class="avcard main">
        ${avatarSVG('kid',{mood:kidMood,age:ka,school:inSchool()})}
        <div><b>${S.kidName}</b><div class="lg">Blasteran Batak-Chinese · Usia ${ka} thn (Pewaris 2014)</div></div>
      </div>`;
  }else{
    famHtml=
      `<div class="avcard main">
        ${avatarSVG('kid',{mood:kidMood,age:ka,preg:S.preg>0,rain,school:inSchool(),affair:!!S.affair})}
        <div><b>${S.kidName} (Kamu)</b><div class="lg">Cantik Blasteran Batak-Chinese · Usia ${ka} thn${S.preg>0?' · Hamil '+(9-S.preg)+'/9':''}${S.affair?' · 💋 Selingkuh':''}</div></div>
      </div>`
      +(S.pt?`<div class="avcard">
        ${avatarSVG('dad',{mood:S.pt.love<35?'sad':'happy',rain,helm:!!S.mar})}
        <div><b>${S.pt.n}</b><div class="lg">${S.mar?'Suami (Setor 80%)':'Pacar'} · Hubungan ${Math.round(S.pt.love)}%</div></div>
      </div>`:'');
  }
  put($('#fam'),famHtml);

  // Semua unit konsol tampil tanpa geser/paginasi, kartu statis anti salah pencet
  put($('#sts'),S.st.length?S.st.map((s,i)=>{
    const c=s.c,k=K[s.k],noGm=(ownedGames(k.pf).length===0);
    let b='';
    if(s.brk){
      b=`<div style="color:var(--bad)"><b>RUSAK</b> (${PT[k.pt].n})</div>${B('fix',i,'Perbaiki ('+(S.parts[k.pt]||0)+')',0,'sm')}`;
    }else if(!c){
      b=`<div class="r" style="justify-content:space-between"><span class="mt">${noGm?'<span style="color:var(--wr)">Beli game '+k.pf.toUpperCase()+'!</span>':'Kosong'}</span>${B('ed',i,editIdx===i?'Tutup':'Kelola',0,'sm')}</div>`;
      if(editIdx===i){
        const nk=k.next?K[k.next]:null;
        b+=`<div class="upbox">`
          +(nk&&nk.yr<=yr?B('upk',i,'Ke '+nk.n+' ('+fmt(Py(k.up,nk.yr))+')',0,'sm'):nk?`<span class="lg">${nk.n} rilis ${nk.yr}</span>`:'<span class="lg">Seri Konsol Terbaru</span>')
          +(s.tv>=0?TV.map((tv,j)=>j>s.tv&&tv.yr<=yr?B('uptv',i+':'+j,'TV '+tv.n+' ('+fmt(Math.max(100000,Py(tv.p,tv.yr)-Math.round(Py(TV[s.tv].p,TV[s.tv].yr)*.5)))+')',0,'sm'):'').join(''):'')
          +B('sell',i,'Jual Second ('+fmt(unitVal(s))+')',0,'sm bad')
          +`</div>`;
      }
    }else if(c.ph==='p'){
      b=`<div>${c.n} · <span class="lg">${c.act||'Main'}</span></div><div class="bar"><i style="width:${c.used/c.want*100}%"></i></div><div class="r" style="justify-content:space-between"><b>${fmt(bill(c)*mult())}</b><span class="lg">${dur(c.used)}</span></div>`;
    }else{
      b=`<div>${c.n}</div><button data-a="coll" data-i="${i}" class="sm">Tagih ${fmt(bill(c)*mult())}</button>`;
    }
    return `<div class="card ${s.brk?'brk':c?c.ph:''}"><div><b>${k.n}</b>${s.tv>=0?' <span class="lg">+ '+TV[s.tv].n+'</span>':''}</div>${b}</div>`;
  }).join(''):'<div class="mt">Belum ada unit konsol. Beli di tab Unit.</div>');

  put($('#tb'),[['un','Unit'],['gm','Game'],['st','Stok'],['li','Listrik'],['hd','Keluarga'],['veh','Kendaraan & Kos'],['us','Usaha'],['bk','Bank'],['pg','Pegawai'],['kl','Kalender'],['jb','Kerja'],['hg','Harga'],['rh','Riwayat'],['lg','Catatan']].map(x=>`<button data-a="tab" data-i="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join(''));
  put($('#side'),side());
}

let last=performance.now(),acc=0;
setInterval(()=>{
  const n=performance.now();let dt=(n-last)/1000;last=n;if(dt>1)dt=1;
  if(!S.pause){acc+=dt*2*S.spd;while(acc>=1){step();acc--}}
  render();
},100);

window.getState=()=>S;
window.applyCloud=o=>{if(o&&o.st){S=migrate(o);_m=-1;rc=0;editIdx=-1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}};
window.addEventListener('pagehide',save);
render();
</script>
<script type="module" src="./cloud.js"></script></body></html>
